<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/shared.css">
  <style>
    body {
      margin: 0;
      background: #fcfcfc;
      font-family: "Computer Modern Sans", sans-serif;
      color: #333;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border: 2px solid #666;
      border-radius: 6px;
      padding: 1.5rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.6rem;
    }
    p {
      margin: 0;
      color: #666;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>Not Found</h1>
      <p>The link you opened does not exist or has expired.</p>
    </div>
  </div>
</body>
</html>
