<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Beamer+</title>

  <!-- Beamer+ Modular CSS -->
  <link rel="stylesheet" href="/static/css/shared.css">
  <link rel="stylesheet" href="/static/css/control-panel.css">
  <link rel="stylesheet" href="/static/css/button.css">
  <link rel="stylesheet" href="/static/css/selector.css">
  <link rel="stylesheet" href="/static/css/label.css">
  <link rel="stylesheet" href="/static/css/toggle.css">
  <link rel="stylesheet" href="/static/css/canvas.css">
  <link rel="stylesheet" href="/static/css/timer.css">
  <link rel="stylesheet" href="/static/css/modal.css">
  <link rel="stylesheet" href="/static/css/survey.css">
  <link rel="stylesheet" href="/static/css/splash.css">

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <svg class="splash-squiggle" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M 5,20 Q 15,5 25,20 T 45,20 Q 55,5 65,20 T 85,20 Q 95,5 105,20 T 115,20" />
    </svg>
  </div>

  <div id="slide-navigator"></div>

  <div id="control-panel">
    <div class="controls-left">
    <div id="display-controls"></div>
    <input type="file" id="upload-zip" accept=".zip" style="display: none;">
    <input type="file" id="upload-folder" webkitdirectory directory multiple style="display: none;">
    <div id="screen-share-container"></div>
    <div id="record-container"></div>
    <div id="nav-container"></div>
    </div>

  <div class="controls-right">

    <div id="tool-container"></div>
    <div id="color-picker"></div>
    <div id="brush-controls"></div>
    <div id="other-controls"></div>
    <div id="timer-container"></div>
  </div>
</div>

  <div id="pdf-container">
      <div id="ann-canvas"></div>
      <div id="pdf-canvas"></div>
  </div>

  <script>
    // Hide splash screen after 2 seconds
    window.addEventListener('DOMContentLoaded', () => {
      const splashScreen = document.getElementById('splash-screen');
      setTimeout(() => {
        splashScreen.style.display = 'none';
      }, 2000);
    });
  </script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
