<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MCQ Poll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg:          oklch(99% 0.003 80);
      --bg-2:        oklch(97% 0.005 80);
      --bg-3:        oklch(94% 0.007 80);
      --bg-4:        oklch(90% 0.008 80);
      --ink-1:       oklch(22% 0.012 260);
      --ink-2:       oklch(38% 0.010 260);
      --ink-3:       oklch(55% 0.008 260);
      --ink-4:       oklch(72% 0.006 260);
      --accent:      oklch(45% 0.005 260);
      --accent-hi:   oklch(32% 0.006 260);
      --ok:          oklch(48% 0.13 155);
      --ok-lo:       oklch(94% 0.06 155);
      --bar-default: oklch(36% 0.004 260);
      --line:        1px solid oklch(85% 0.005 260);
      --r:           8px;
      --font:        "EB Garamond", Georgia, serif;
      --mono:        ui-monospace, "SF Mono", Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg); color: var(--ink-1); }

    #shell { display: flex; flex-direction: column; height: 100%; }

    /* Prompt header */
    #question-header {
      flex-shrink: 0;
      padding: 28px 32px 22px;
      border-bottom: var(--line);
      background: var(--bg);
    }
    #question-text {
      font-size: clamp(1.4rem, 4vw, 2.1rem);
      font-weight: 500;
      line-height: 1.25;
      color: var(--ink-1);
      text-align: center;
    }

    /* Body */
    #body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    /* QR collect view */
    #collect-view {
      flex: 1;
      display: none;
      flex-direction: row;
      align-items: stretch;
      overflow: hidden;
    }
    #options-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 24px 20px 24px 28px;
      overflow-y: auto;
    }
    .choice-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 14px;
      background: var(--bg-2);
      border: var(--line);
      border-radius: var(--r);
    }
    .choice-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-3);
      border: var(--line);
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 500;
      flex-shrink: 0;
    }
    .choice-text {
      font-size: 1rem;
      line-height: 1.35;
      color: var(--ink-1);
      word-break: break-word;
      padding-top: 2px;
    }
    #qr-col {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px 28px 24px 20px;
      border-left: var(--line);
    }
    #qrcode {
      padding: 10px;
      background: white;
      border: var(--line);
      border-radius: var(--r);
    }
    #join-url {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-4);
      text-align: center;
      max-width: 400px;
      word-break: break-all;
      cursor: pointer;
    }

    /* Results bar chart */
    #results-view {
      flex: 1;
      display: none;
      flex-direction: column;
      padding: 24px 32px;
      gap: 6px;
      overflow-y: auto;
      justify-content: center;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 2rem 1fr 3.6rem;
      align-items: center;
      gap: 10px;
    }
    .bar-label {
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink-2);
      text-align: right;
    }
    .bar-label.correct { color: var(--ok); }
    .bar-track {
      height: 30px;
      background: var(--bg-3);
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--bar-default);
      border-radius: 4px;
      transition: width 0.65s cubic-bezier(.22,1,.36,1);
    }
    .bar-fill.correct { background: var(--ok); }
    .bar-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .bar-pct {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    .bar-votes { font-size: 0.75rem; color: var(--ink-4); }
    .bar-text-row {
      display: grid;
      grid-template-columns: 2rem 1fr 3.6rem;
      gap: 10px;
      margin-top: -2px;
      margin-bottom: 8px;
    }
    .bar-text {
      grid-column: 2;
      font-size: 0.82rem;
      color: var(--ink-3);
      padding-left: 2px;
    }

    /* Idle */
    #idle-msg {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--ink-4);
      font-style: italic;
    }
    .pulse {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.1s ease-in-out infinite;
      display: inline-block;
      margin-right: 8px;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }

    /* Footer */
    #footer-panel {
      flex-shrink: 0;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-top: var(--line);
      background: var(--bg);
      gap: 12px;
    }
    #resp-count-row { font-size: 14px; color: var(--ink-3); }
    #resp-count-row strong { color: var(--ink-1); font-size: 15px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 22px;
      font-family: var(--font);
      font-size: 1rem;
      background: var(--bg);
      color: var(--ink-2);
      border: var(--line);
      border-radius: var(--r);
      cursor: pointer;
      transition: background 100ms;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--bg-4); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn.primary {
      background: var(--accent);
      color: oklch(97% 0.003 80);
      border-color: var(--accent-hi);
    }
    .btn.primary:hover:not(:disabled) { background: var(--accent-hi); }
    #btn-row { display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
<div id="shell">
  <div id="question-header">
    <div id="question-text">Multiple Choice Poll</div>
  </div>

  <div id="body">
    <div id="idle-msg"><span class="pulse"></span>Waiting for poll to start…</div>

    <div id="collect-view">
      <div id="options-list"></div>
      <div id="qr-col">
        <div id="qrcode"></div>
        <div id="join-url" onclick="copyUrl(this)" title="Click to copy"></div>
      </div>
    </div>

    <div id="results-view"></div>
  </div>

  <div id="footer-panel">
    <div id="resp-count-row"><strong id="footer-resp-count">0</strong> responses</div>
    <div id="btn-row">
      <button class="btn primary" id="close-btn" onclick="closePoll()">Close</button>
      <button class="btn" id="reset-btn" onclick="newPoll()" style="display:none">Reset</button>
    </div>
  </div>
</div>

<script>
  const LETTERS = ['A','B','C','D','E','F','G','H'];
  let cfg = {}, socket = null, role = 'presenter';
  let widgetId = 'mcq-default', serverUrl = '', publicBaseUrl = '';
  let surveyId = null, pollInterval = null, revealed = false, pollClosed = false;
  let votes = {}, options = [], correctAnswer = null;

  function letter(i) { return LETTERS[i] || String(i+1); }

  function renderOptionList() {
    const list = document.getElementById('options-list');
    list.innerHTML = '';
    options.forEach((opt, i) => {
      const card = document.createElement('div');
      card.className = 'choice-card';
      card.innerHTML = `<span class="choice-letter">${letter(i)}</span><span class="choice-text">${opt}</span>`;
      list.appendChild(card);
    });
  }

  function renderChart() {
    const view = document.getElementById('results-view');
    const total = Object.values(votes).reduce((s,v)=>s+v, 0);
    view.innerHTML = '';
    options.forEach((opt, i) => {
      const k = letter(i);
      const n = votes[k] || 0;
      const pct = total > 0 ? Math.round(n / total * 100) : 0;
      const isCorrect = revealed && correctAnswer === i;

      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <span class="bar-label${isCorrect ? ' correct' : ''}">${k}</span>
        <div class="bar-track"><div class="bar-fill${isCorrect ? ' correct' : ''}" data-pct="${pct}"></div></div>
        <div class="bar-meta">
          <span class="bar-pct">${pct}%</span>
          <span class="bar-votes">${n}v</span>
        </div>`;
      view.appendChild(row);

      const textRow = document.createElement('div');
      textRow.className = 'bar-text-row';
      textRow.innerHTML = `<span></span><span class="bar-text">${opt}</span>`;
      view.appendChild(textRow);
    });
    requestAnimationFrame(() => {
      view.querySelectorAll('.bar-fill').forEach(el => { el.style.width = el.dataset.pct + '%'; });
    });
  }

  function emitState() {
    if (!socket || role !== 'presenter') return;
    socket.emit('widget_state', {
      widgetId,
      state: { question: cfg.question, options, votes, revealed, correctAnswer, surveyId, pollClosed },
    });
  }

  function applyState(s) {
    if (!s || !s.options?.length) return;
    options = s.options; votes = s.votes || {};
    revealed = s.revealed || false;
    correctAnswer = s.correctAnswer ?? null;
    pollClosed = s.pollClosed || false;
    document.getElementById('question-text').textContent = s.question || 'Multiple Choice Poll';
    setRespCount(Object.values(votes).reduce((a,b)=>a+b,0));
    showPhase(pollClosed ? 'results' : 'collect');
  }

  function initSocket() {
    const url = cfg.socketUrl || serverUrl;
    if (!url) return;
    socket = io(url);
    socket.on('connect', () => { if (role === 'presenter') socket.emit('join_presenter'); });
    socket.on('widget_state', data => {
      if (role !== 'viewer' || data?.widgetId !== widgetId) return;
      applyState(data.state);
      if (data.state?.surveyId && !data.state.pollClosed) showQR(data.state.surveyId);
    });
  }

  function showPhase(p) {
    document.getElementById('idle-msg').style.display     = p === 'idle'    ? '' : 'none';
    document.getElementById('collect-view').style.display = p === 'collect' ? 'flex' : 'none';
    document.getElementById('results-view').style.display = p === 'results' ? 'flex' : 'none';
    document.getElementById('footer-panel').style.display = p !== 'idle' ? 'flex' : 'none';
    if (role !== 'presenter') {
      document.getElementById('btn-row').style.display = 'none';
    } else {
      document.getElementById('close-btn').style.display = p === 'collect' ? '' : 'none';
      document.getElementById('reset-btn').style.display  = p === 'results' ? '' : 'none';
    }
    if (p === 'collect') renderOptionList();
    if (p === 'results') renderChart();
  }

  function setRespCount(n) {
    document.getElementById('footer-resp-count').textContent = n;
  }

  function showQR(sid) {
    const base = publicBaseUrl || serverUrl;
    const url = `${base}/mcq/${sid}`;
    document.getElementById('join-url').textContent = url;
    const qrEl = document.getElementById('qrcode');
    if (qrEl.innerHTML) return;
    new QRCode(qrEl, { text: url, width: 180, height: 180, colorDark: '#222', colorLight: '#ffffff' });
  }

  function copyUrl(el) { navigator.clipboard?.writeText(el.textContent).catch(()=>{}); }

  async function startPoll() {
    if (!cfg.question || !options.length) return;
    try {
      const res = await fetch(`${serverUrl}/api/survey/create`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ question: cfg.question, options, model: null, num_summaries: 0 }),
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      surveyId = data.survey_id;
      votes = {}; revealed = false; pollClosed = false;
      setRespCount(0);
      showQR(surveyId);
      showPhase('collect');
      pollInterval = setInterval(fetchVotes, 3000);
      emitState();
    } catch(e) { console.error('startPoll:', e); }
  }

  async function fetchVotes() {
    if (!surveyId) return;
    const res = await fetch(`${serverUrl}/api/survey/${surveyId}/responses`).catch(()=>null);
    if (!res?.ok) return;
    const data = await res.json();
    const newVotes = {};
    (data.responses || []).forEach(r => {
      const k = (r.text||'').trim().toUpperCase();
      if (k) newVotes[k] = (newVotes[k]||0) + 1;
    });
    votes = newVotes;
    setRespCount(Object.values(votes).reduce((a,b)=>a+b,0));
    if (pollClosed) renderChart();
    emitState();
  }

  async function closePoll() {
    if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
    await fetchVotes();
    pollClosed = true;
    if (surveyId) fetch(`${serverUrl}/api/survey/${surveyId}/close`, {method:'POST'}).catch(()=>{});
    showPhase('results');
    emitState();
  }

  function newPoll() {
    if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
    surveyId = null; votes = {}; revealed = false; pollClosed = false;
    document.getElementById('qrcode').innerHTML = '';
    document.getElementById('join-url').textContent = '';
    setRespCount(0);
    showPhase('idle');
    startPoll();
  }

  function init(c) {
    cfg = c || {};
    role = cfg.role || 'presenter';
    widgetId = cfg.id || cfg.widgetId || widgetId;
    serverUrl = cfg.socketUrl || cfg.serverUrl || (()=>{ try{return window.parent.location.origin}catch(e){return window.location.origin} })();
    publicBaseUrl = cfg.publicBaseUrl || serverUrl;
    options = cfg.options || [];
    correctAnswer = cfg.correctAnswer ?? null;
    document.getElementById('question-text').textContent = cfg.question || 'Multiple Choice Poll';
    initSocket();
    if (role !== 'viewer' && cfg.question && options.length) startPoll();
  }

  window.addEventListener('message', e => {
    if (e.data?.type === 'widget-config') init(e.data.config);
    if (e.data?.type === 'widget-cleanup') { clearInterval(pollInterval); socket?.disconnect(); }
  });
</script>
</body>
</html>
