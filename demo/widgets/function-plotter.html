<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Function Plotter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
  <style>
    :root {
      --surface-paper:   oklch(99% 0.003 80);
      --surface-cream:   oklch(97% 0.005 80);
      --surface-cream-2: oklch(94% 0.007 80);
      --surface-cream-3: oklch(90% 0.008 80);
      --ink-1:  oklch(22% 0.012 260);
      --ink-2:  oklch(38% 0.010 260);
      --ink-3:  oklch(55% 0.008 260);
      --ink-4:  oklch(72% 0.006 260);
      --accent: oklch(45% 0.005 260);
      --accent-soft:   oklch(92% 0.004 260);
      --accent-strong: oklch(32% 0.006 260);
      --danger: oklch(58% 0.18 25);
      --line:   1px solid oklch(85% 0.005 260);
      --r-sm: 6px; --r-md: 8px;
      --font-sans: "EB Garamond", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
      --shadow-1: 0 1px 3px oklch(20% 0.01 260 / 0.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--ink-1);
      background: var(--surface-paper);
    }

    #widget-container {
      display: flex;
      flex-direction: column;
      width: 100%; height: 100%;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface-cream-2);
      border-bottom: var(--line);
      flex-wrap: wrap;
    }

    #function-inputs {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 220px;
    }

    .function-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .color-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      padding: 5px 9px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--ink-1);
      background: var(--surface-paper);
      border: var(--line);
      border-radius: var(--r-sm);
      transition: border-color 150ms;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--ink-4);
    }
    input[type="text"]:disabled {
      color: var(--ink-3);
      background: var(--surface-cream);
    }

    #error {
      font-size: 12px;
      color: var(--danger);
      min-height: 16px;
    }

    /* ── Controls ── */
    #controls {
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: flex-end;
    }

    #btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 5px 11px;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--ink-2);
      background: var(--surface-paper);
      border: var(--line);
      border-radius: var(--r-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: background 120ms, color 120ms;
      user-select: none;
    }
    .btn:hover { background: var(--surface-cream-3); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn.primary {
      background: var(--accent);
      color: oklch(97% 0.003 80);
      border-color: var(--accent-strong);
    }
    .btn.primary:hover { background: var(--accent-strong); }
    .btn.active {
      background: var(--accent-soft);
      color: var(--accent-strong);
      border-color: var(--ink-4);
    }

    #range-row {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--ink-3);
    }

    .range-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .range-label { font-style: italic; }

    input[type="number"] {
      width: 52px;
      padding: 4px 6px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--ink-1);
      background: var(--surface-paper);
      border: var(--line);
      border-radius: var(--r-sm);
    }
    input[type="number"]:focus { outline: none; border-color: var(--ink-4); }
    input[type="number"]:disabled { color: var(--ink-3); background: var(--surface-cream); }

    /* ── Plot area ── */
    #canvas-container {
      flex: 1;
      position: relative;
      background: var(--surface-paper);
      overflow: hidden;
    }

    #canvas {
      display: block;
      cursor: crosshair;
    }
    #canvas.dragging { cursor: grabbing; }
    #canvas.viewer   { cursor: default; }

    #coord-info {
      position: absolute;
      top: 8px; left: 8px;
      background: var(--surface-cream);
      border: var(--line);
      border-radius: var(--r-sm);
      padding: 4px 8px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--ink-3);
      pointer-events: none;
      box-shadow: var(--shadow-1);
    }

    #hint {
      position: absolute;
      bottom: 8px; left: 8px;
      background: var(--surface-cream);
      border: var(--line);
      border-radius: var(--r-sm);
      padding: 3px 8px;
      font-size: 11px;
      color: var(--ink-4);
      pointer-events: none;
    }

    /* Viewer overlay badge */
    #viewer-badge {
      display: none;
      position: absolute;
      top: 8px; right: 8px;
      background: var(--accent-soft);
      border: var(--line);
      border-radius: var(--r-sm);
      padding: 3px 8px;
      font-size: 11px;
      color: var(--ink-3);
      pointer-events: none;
    }
    body.viewer-mode #viewer-badge { display: block; }
    body.viewer-mode #hint { display: none; }
  </style>
</head>
<body>
  <div id="widget-container">
    <div id="toolbar">
      <div id="function-inputs">
        <div class="function-row">
          <div class="color-dot" style="background: oklch(58% 0.18 25);"></div>
          <input type="text" id="func1" placeholder="e.g. sin(x), x^2" value="sin(x)">
        </div>
        <div class="function-row">
          <div class="color-dot" style="background: oklch(52% 0.12 250);"></div>
          <input type="text" id="func2" placeholder="Second function (optional)">
        </div>
        <div class="function-row">
          <div class="color-dot" style="background: oklch(58% 0.14 160);"></div>
          <input type="text" id="func3" placeholder="Third function (optional)">
        </div>
        <div id="error"></div>
      </div>

      <div id="controls">
        <div id="btn-row">
          <button class="btn primary" id="plot-btn">Plot</button>
          <button class="btn" id="clear-btn">Clear</button>
          <button class="btn active" id="grid-btn">Grid</button>
          <button class="btn" id="reset-btn">Reset</button>
        </div>
        <div id="range-row">
          <div class="range-group">
            <span class="range-label">x</span>
            <input type="number" id="xmin" value="-10" step="1">
            <span>–</span>
            <input type="number" id="xmax" value="10" step="1">
          </div>
          <div class="range-group">
            <span class="range-label">y</span>
            <input type="number" id="ymin" value="-10" step="1">
            <span>–</span>
            <input type="number" id="ymax" value="10" step="1">
          </div>
        </div>
      </div>
    </div>

    <div id="canvas-container">
      <canvas id="canvas"></canvas>
      <div id="coord-info">x: 0.00, y: 0.00</div>
      <div id="hint">Scroll to zoom · Drag to pan</div>
      <div id="viewer-badge">Live view</div>
    </div>
  </div>

  <script>
    const COLORS = [
      'oklch(58% 0.18 25)',
      'oklch(52% 0.12 250)',
      'oklch(58% 0.14 160)',
    ];

    class FunctionPlotter {
      constructor() {
        this.canvas    = document.getElementById('canvas');
        this.ctx       = this.canvas.getContext('2d');
        this.coordInfo = document.getElementById('coord-info');
        this.errorEl   = document.getElementById('error');
        this.funcInputs = [
          document.getElementById('func1'),
          document.getElementById('func2'),
          document.getElementById('func3'),
        ];
        this.xminEl = document.getElementById('xmin');
        this.xmaxEl = document.getElementById('xmax');
        this.yminEl = document.getElementById('ymin');
        this.ymaxEl = document.getElementById('ymax');

        this.xmin = -10; this.xmax = 10;
        this.ymin = -10; this.ymax = 10;
        this.showGrid = true;
        this.isDragging = false;
        this.dragStart = { x: 0, y: 0, xmin: 0, xmax: 0, ymin: 0, ymax: 0 };
        this.lastTouchDist = null;

        // Sync
        this.widgetId  = null;
        this.role      = 'presenter';
        this.socket    = null;
        this.syncTimer = null;

        this.setupCanvas();
        this.setupEvents();
        this.plot();
      }

      setupCanvas() {
        const resize = () => {
          const rect = this.canvas.parentElement.getBoundingClientRect();
          this.canvas.width  = rect.width;
          this.canvas.height = rect.height;
          this.plot();
        };
        resize();
        window.addEventListener('resize', resize);
      }

      setupEvents() {
        document.getElementById('plot-btn').addEventListener('click', () => {
          this.plot();
          this.emitState();
        });
        document.getElementById('clear-btn').addEventListener('click', () => {
          this.funcInputs.forEach(i => i.value = '');
          this.plot();
          this.emitState();
        });
        document.getElementById('grid-btn').addEventListener('click', () => {
          this.showGrid = !this.showGrid;
          document.getElementById('grid-btn').classList.toggle('active', this.showGrid);
          this.plot();
          this.emitState();
        });
        document.getElementById('reset-btn').addEventListener('click', () => {
          this.xmin = -10; this.xmax = 10;
          this.ymin = -10; this.ymax = 10;
          this.syncInputs();
          this.plot();
          this.emitState();
        });

        this.funcInputs.forEach(inp => {
          inp.addEventListener('keydown', e => { if (e.key === 'Enter') { this.plot(); this.emitState(); } });
        });
        [this.xminEl, this.xmaxEl, this.yminEl, this.ymaxEl].forEach(inp => {
          inp.addEventListener('change', () => { this.readRangeInputs(); this.plot(); this.emitState(); });
        });

        this.canvas.addEventListener('mousemove', e => this.onMouseMove(e));
        this.canvas.addEventListener('mousedown', e => this.onMouseDown(e));
        this.canvas.addEventListener('mouseup',   e => this.onMouseUp(e));
        this.canvas.addEventListener('mouseleave', e => this.onMouseUp(e));
        this.canvas.addEventListener('wheel', e => this.onWheel(e), { passive: false });
        this.canvas.addEventListener('touchstart', e => this.onTouchStart(e), { passive: false });
        this.canvas.addEventListener('touchmove',  e => this.onTouchMove(e),  { passive: false });
        this.canvas.addEventListener('touchend',   e => this.onTouchEnd(e));
      }

      // ── Interaction ──

      onMouseDown(e) {
        if (this.role === 'viewer') return;
        this.isDragging = true;
        this.canvas.classList.add('dragging');
        this.dragStart = { x: e.clientX, y: e.clientY,
          xmin: this.xmin, xmax: this.xmax, ymin: this.ymin, ymax: this.ymax };
      }

      onMouseMove(e) {
        const rect = this.canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
        const gx = this.xmin + (cx / this.canvas.width)  * (this.xmax - this.xmin);
        const gy = this.ymax - (cy / this.canvas.height) * (this.ymax - this.ymin);
        this.coordInfo.textContent = `x: ${gx.toFixed(2)}, y: ${gy.toFixed(2)}`;
        if (!this.isDragging) return;
        const dx = e.clientX - this.dragStart.x;
        const dy = e.clientY - this.dragStart.y;
        const xr = this.dragStart.xmax - this.dragStart.xmin;
        const yr = this.dragStart.ymax - this.dragStart.ymin;
        this.xmin = this.dragStart.xmin - (dx / this.canvas.width)  * xr;
        this.xmax = this.dragStart.xmax - (dx / this.canvas.width)  * xr;
        this.ymin = this.dragStart.ymin + (dy / this.canvas.height) * yr;
        this.ymax = this.dragStart.ymax + (dy / this.canvas.height) * yr;
        this.syncInputs();
        this.plot();
        this.debouncedEmit();
      }

      onMouseUp() {
        this.isDragging = false;
        this.canvas.classList.remove('dragging');
      }

      onWheel(e) {
        if (this.role === 'viewer') return;
        e.preventDefault();
        const rect = this.canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
        const gx = this.xmin + (cx / this.canvas.width)  * (this.xmax - this.xmin);
        const gy = this.ymax - (cy / this.canvas.height) * (this.ymax - this.ymin);
        const f  = e.deltaY > 0 ? 1.1 : 0.9;
        const xr = (this.xmax - this.xmin) * f, yr = (this.ymax - this.ymin) * f;
        const rx = (gx - this.xmin) / (this.xmax - this.xmin);
        const ry = (gy - this.ymin) / (this.ymax - this.ymin);
        this.xmin = gx - xr * rx; this.xmax = gx + xr * (1 - rx);
        this.ymin = gy - yr * ry; this.ymax = gy + yr * (1 - ry);
        this.syncInputs();
        this.plot();
        this.debouncedEmit();
      }

      onTouchStart(e) {
        if (this.role === 'viewer') return;
        if (e.touches.length === 1) {
          this.isDragging = true;
          this.dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY,
            xmin: this.xmin, xmax: this.xmax, ymin: this.ymin, ymax: this.ymax };
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          this.lastTouchDist = Math.hypot(dx, dy);
        }
      }

      onTouchMove(e) {
        if (this.role === 'viewer') return;
        e.preventDefault();
        if (e.touches.length === 1 && this.isDragging) {
          const dx = e.touches[0].clientX - this.dragStart.x;
          const dy = e.touches[0].clientY - this.dragStart.y;
          const xr = this.dragStart.xmax - this.dragStart.xmin;
          const yr = this.dragStart.ymax - this.dragStart.ymin;
          this.xmin = this.dragStart.xmin - (dx / this.canvas.width)  * xr;
          this.xmax = this.dragStart.xmax - (dx / this.canvas.width)  * xr;
          this.ymin = this.dragStart.ymin + (dy / this.canvas.height) * yr;
          this.ymax = this.dragStart.ymax + (dy / this.canvas.height) * yr;
          this.syncInputs(); this.plot(); this.debouncedEmit();
        } else if (e.touches.length === 2 && this.lastTouchDist) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          const f = this.lastTouchDist / dist;
          const cx = (this.xmin + this.xmax) / 2, cy = (this.ymin + this.ymax) / 2;
          const xr = (this.xmax - this.xmin) * f, yr = (this.ymax - this.ymin) * f;
          this.xmin = cx - xr / 2; this.xmax = cx + xr / 2;
          this.ymin = cy - yr / 2; this.ymax = cy + yr / 2;
          this.lastTouchDist = dist;
          this.syncInputs(); this.plot(); this.debouncedEmit();
        }
      }

      onTouchEnd(e) {
        this.isDragging = false;
        if (e.touches.length < 2) this.lastTouchDist = null;
      }

      // ── Rendering ──

      plot() {
        this.errorEl.textContent = '';
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        if (this.showGrid) this.drawGrid();
        this.drawAxes();
        this.funcInputs.forEach((inp, i) => {
          if (inp.value.trim()) {
            try { this.plotFunction(inp.value, COLORS[i]); }
            catch (err) { this.errorEl.textContent = `f${i + 1}: ${err.message}`; }
          }
        });
      }

      plotFunction(expr, color) {
        expr = expr.replace(/log(?!10)/g, 'log10temp')
                   .replace(/log10temp/g, 'log10')
                   .replace(/\bln\b/g, 'log');
        const fn = math.compile(expr);
        this.ctx.strokeStyle = color;
        this.ctx.lineWidth   = 2;
        this.ctx.beginPath();
        let first = true;
        const step = (this.xmax - this.xmin) / this.canvas.width;
        for (let x = this.xmin; x <= this.xmax; x += step) {
          const y = fn.evaluate({ x });
          if (y == null || !isFinite(y) || y < this.ymin || y > this.ymax) { first = true; continue; }
          const cx = ((x - this.xmin) / (this.xmax - this.xmin)) * this.canvas.width;
          const cy = ((this.ymax - y) / (this.ymax - this.ymin)) * this.canvas.height;
          first ? this.ctx.moveTo(cx, cy) : this.ctx.lineTo(cx, cy);
          first = false;
        }
        this.ctx.stroke();
      }

      drawGrid() {
        this.ctx.strokeStyle = 'oklch(90% 0.005 260)';
        this.ctx.lineWidth   = 1;
        const xStep = (this.xmax - this.xmin) / 10;
        for (let x = this.xmin; x <= this.xmax + 1e-9; x += xStep) {
          const cx = ((x - this.xmin) / (this.xmax - this.xmin)) * this.canvas.width;
          this.ctx.beginPath(); this.ctx.moveTo(cx, 0); this.ctx.lineTo(cx, this.canvas.height); this.ctx.stroke();
        }
        const yStep = (this.ymax - this.ymin) / 10;
        for (let y = this.ymin; y <= this.ymax + 1e-9; y += yStep) {
          const cy = ((this.ymax - y) / (this.ymax - this.ymin)) * this.canvas.height;
          this.ctx.beginPath(); this.ctx.moveTo(0, cy); this.ctx.lineTo(this.canvas.width, cy); this.ctx.stroke();
        }
      }

      drawAxes() {
        this.ctx.strokeStyle = 'oklch(55% 0.008 260)';
        this.ctx.lineWidth   = 1.5;
        if (this.ymin <= 0 && this.ymax >= 0) {
          const y0 = ((this.ymax) / (this.ymax - this.ymin)) * this.canvas.height;
          this.ctx.beginPath(); this.ctx.moveTo(0, y0); this.ctx.lineTo(this.canvas.width, y0); this.ctx.stroke();
        }
        if (this.xmin <= 0 && this.xmax >= 0) {
          const x0 = ((-this.xmin) / (this.xmax - this.xmin)) * this.canvas.width;
          this.ctx.beginPath(); this.ctx.moveTo(x0, 0); this.ctx.lineTo(x0, this.canvas.height); this.ctx.stroke();
        }
      }

      syncInputs() {
        this.xminEl.value = this.xmin.toFixed(2);
        this.xmaxEl.value = this.xmax.toFixed(2);
        this.yminEl.value = this.ymin.toFixed(2);
        this.ymaxEl.value = this.ymax.toFixed(2);
      }

      readRangeInputs() {
        this.xmin = parseFloat(this.xminEl.value);
        this.xmax = parseFloat(this.xmaxEl.value);
        this.ymin = parseFloat(this.yminEl.value);
        this.ymax = parseFloat(this.ymaxEl.value);
      }

      // ── Sync ──

      connectSocket(socketUrl) {
        this.socket = io(socketUrl);
        this.socket.on('widget_state', (data) => {
          if (data.widgetId !== this.widgetId) return;
          this.applyState(data.state);
        });
      }

      getState() {
        return {
          functions: this.funcInputs.map(i => i.value),
          xmin: this.xmin, xmax: this.xmax,
          ymin: this.ymin, ymax: this.ymax,
          showGrid: this.showGrid,
        };
      }

      emitState() {
        if (!this.socket || this.role !== 'presenter') return;
        this.socket.emit('widget_state', { widgetId: this.widgetId, state: this.getState() });
      }

      debouncedEmit() {
        clearTimeout(this.syncTimer);
        this.syncTimer = setTimeout(() => this.emitState(), 250);
      }

      applyState(s) {
        if (s.functions) {
          s.functions.forEach((f, i) => { if (this.funcInputs[i]) this.funcInputs[i].value = f; });
        }
        if (s.xmin != null) { this.xmin = s.xmin; this.xminEl.value = s.xmin.toFixed(2); }
        if (s.xmax != null) { this.xmax = s.xmax; this.xmaxEl.value = s.xmax.toFixed(2); }
        if (s.ymin != null) { this.ymin = s.ymin; this.yminEl.value = s.ymin.toFixed(2); }
        if (s.ymax != null) { this.ymax = s.ymax; this.ymaxEl.value = s.ymax.toFixed(2); }
        if (s.showGrid != null) {
          this.showGrid = s.showGrid;
          document.getElementById('grid-btn').classList.toggle('active', this.showGrid);
        }
        this.plot();
      }

      setViewerMode() {
        this.role = 'viewer';
        document.body.classList.add('viewer-mode');
        // Disable all inputs
        [...document.querySelectorAll('input, button')].forEach(el => el.disabled = true);
        this.canvas.classList.add('viewer');
      }

      // ── Config from Beamer+ ──

      updateConfig(cfg) {
        this.widgetId = cfg.id ?? cfg.widgetId ?? this.widgetId;
        if (cfg.role === 'viewer') this.setViewerMode();
        if (cfg.socketUrl) this.connectSocket(cfg.socketUrl);

        if (cfg.functions) cfg.functions.forEach((f, i) => { if (this.funcInputs[i]) this.funcInputs[i].value = f; });
        if (cfg.xmin != null) { this.xmin = cfg.xmin; this.xminEl.value = cfg.xmin; }
        if (cfg.xmax != null) { this.xmax = cfg.xmax; this.xmaxEl.value = cfg.xmax; }
        if (cfg.ymin != null) { this.ymin = cfg.ymin; this.yminEl.value = cfg.ymin; }
        if (cfg.ymax != null) { this.ymax = cfg.ymax; this.ymaxEl.value = cfg.ymax; }
        if (cfg.showGrid != null) {
          this.showGrid = cfg.showGrid;
          document.getElementById('grid-btn').classList.toggle('active', this.showGrid);
        }
        if (cfg.autoPlot !== false) this.plot();
      }
    }

    const widget = new FunctionPlotter();

    window.addEventListener('message', e => {
      if (e.data?.type === 'widget-config')  widget.updateConfig(e.data.config);
      if (e.data?.type === 'widget-cleanup') { /* nothing to clean up */ }
    });
  </script>
