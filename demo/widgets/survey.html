<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Survey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg:         oklch(99% 0.003 80);
      --bg-2:       oklch(97% 0.005 80);
      --bg-3:       oklch(94% 0.007 80);
      --bg-4:       oklch(90% 0.008 80);
      --ink-1:      oklch(22% 0.012 260);
      --ink-2:      oklch(38% 0.010 260);
      --ink-3:      oklch(55% 0.008 260);
      --ink-4:      oklch(72% 0.006 260);
      --accent:     oklch(45% 0.005 260);
      --accent-hi:  oklch(32% 0.006 260);
      --ok:         oklch(48% 0.13 155);
      --err:        oklch(58% 0.18 25);
      --line:       1px solid oklch(85% 0.005 260);
      --r:          8px;
      --font:       "EB Garamond", Georgia, serif;
      --mono:       ui-monospace, "SF Mono", Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg); color: var(--ink-1); }

    #shell { display: flex; flex-direction: column; height: 100%; }

    /* Prompt header */
    #question-header {
      flex-shrink: 0;
      padding: 28px 32px 22px;
      border-bottom: var(--line);
      background: var(--bg);
      display: none;
    }
    #question-text {
      font-size: clamp(1.4rem, 4vw, 2.1rem);
      font-weight: 500;
      line-height: 1.25;
      color: var(--ink-1);
      text-align: center;
    }

    /* Body */
    #body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    /* Setup view */
    #setup-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .setup-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-2);
      border: var(--line);
      border-radius: var(--r);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .setup-title { font-size: 1.3rem; font-weight: 500; }
    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 4px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 8px 10px;
      font-family: var(--font);
      font-size: 14px;
      background: var(--bg);
      color: var(--ink-1);
      border: var(--line);
      border-radius: var(--r);
      outline: none;
      transition: border-color 120ms;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field .hint { font-size: 11px; color: var(--ink-4); margin-top: 3px; }
    .no-models { font-size: 13px; color: var(--ink-4); text-align: center; line-height: 1.5; }

    /* QR collect view */
    #collect-view {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
    }
    .scan-hint {
      font-size: 0.85rem;
      color: var(--ink-4);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    #qrcode {
      padding: 10px;
      background: white;
      border: var(--line);
      border-radius: var(--r);
    }
    #join-url {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-4);
      text-align: center;
      max-width: 400px;
      word-break: break-all;
      cursor: pointer;
    }
    #count-badge {
      font-size: 14px;
      color: var(--ink-3);
      padding: 5px 16px;
      border: var(--line);
      border-radius: 999px;
      background: var(--bg-2);
    }
    #count-badge strong { color: var(--ink-1); font-size: 15px; }

    /* Results carousel */
    #results-view {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
    }
    .summary-card {
      width: 100%;
      max-width: 560px;
      background: var(--bg-2);
      border: var(--line);
      border-radius: var(--r);
      padding: 24px 28px;
      box-shadow: 0 2px 8px oklch(0% 0 0 / 0.06);
    }
    #summary-text {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--ink-2);
    }
    #summary-meta {
      font-size: 12px;
      color: var(--ink-4);
      margin-top: 12px;
    }
    .carousel-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #nav-counter { font-size: 13px; color: var(--ink-4); min-width: 3rem; text-align: center; }

    /* Loading view */
    #loading-view {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }
    #loading-msg { font-size: 13px; color: var(--ink-4); font-style: italic; }

    /* Footer */
    #footer-panel {
      flex-shrink: 0;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-top: var(--line);
      background: var(--bg);
      gap: 12px;
    }
    #resp-count-row { font-size: 14px; color: var(--ink-3); }
    #resp-count-row strong { color: var(--ink-1); font-size: 15px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 22px;
      font-family: var(--font);
      font-size: 1rem;
      background: var(--bg);
      color: var(--ink-2);
      border: var(--line);
      border-radius: var(--r);
      cursor: pointer;
      transition: background 100ms;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--bg-4); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn.primary {
      background: var(--accent);
      color: oklch(97% 0.003 80);
      border-color: var(--accent-hi);
    }
    .btn.primary:hover:not(:disabled) { background: var(--accent-hi); }
    .btn.icon-only { padding: 10px 14px; }
    #btn-row { display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
<div id="shell">
  <div id="question-header"><div id="question-text"></div></div>

  <div id="body">
    <!-- Setup -->
    <div id="setup-view">
      <div class="setup-card">
        <div class="setup-title">Survey</div>
        <div class="field">
          <label>Question</label>
          <input type="text" id="setup-question" placeholder="What do you think about…?">
        </div>
        <div id="model-field" class="field">
          <label>Summarizer</label>
          <select id="setup-model"></select>
          <div class="hint">AI script to summarize responses</div>
        </div>
        <div class="field">
          <label>Summaries to generate</label>
          <input type="number" id="setup-n" min="1" max="10" value="3">
        </div>
        <div id="no-models-msg" class="no-models" style="display:none">
          No AI models found. Add a Python script in the <code>ai/</code> folder.
        </div>
        <button class="btn primary" id="launch-btn" onclick="launchSurvey()">Launch Survey</button>
      </div>
    </div>

    <!-- QR collect -->
    <div id="collect-view">
      <div id="qrcode"></div>
      <div id="join-url" onclick="copyUrl(this)" title="Click to copy"></div>
    </div>

    <!-- Results carousel -->
    <div id="results-view">
      <div class="summary-card">
        <div id="summary-text"></div>
        <div id="summary-meta"></div>
      </div>
      <div class="carousel-nav">
        <button class="btn icon-only" id="prev-btn" onclick="prevSummary()">&#8592;</button>
        <span id="nav-counter">1 / 3</span>
        <button class="btn icon-only" id="next-btn" onclick="nextSummary()">&#8594;</button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading-view">
      <div class="pulse"></div>
      <div id="loading-msg">Connecting…</div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer-panel">
    <div id="resp-count-row"><strong id="footer-resp-count">0</strong> responses</div>
    <div id="btn-row">
      <button class="btn" id="reset-btn" onclick="newSurvey()" style="display:none">Reset</button>
      <button class="btn primary" id="close-btn" onclick="summarize()" disabled>Close</button>
    </div>
  </div>
</div>

<script>
  let cfg = {}, socket = null, role = 'presenter';
  let widgetId = 'survey-default', serverUrl = '', publicBaseUrl = '';
  let currentSurvey = null, currentResults = null, currentIdx = 0, respCount = 0;
  let phase = 'setup';

  function deriveServer() {
    try { return window.parent.location.origin; } catch(e) { return window.location.origin; }
  }

  function getHeaderQuestion() {
    return currentSurvey?.question || cfg.question || document.getElementById('setup-question').value.trim() || '';
  }

  function refreshHeader() {
    const title = getHeaderQuestion();
    const header = document.getElementById('question-header');
    document.getElementById('question-text').textContent = title;
    header.style.display = title ? 'block' : 'none';
  }

  function showPhase(p) {
    phase = p;
    document.getElementById('setup-view').style.display   = p === 'setup'   ? ''     : 'none';
    document.getElementById('collect-view').style.display = p === 'collect' ? 'flex' : 'none';
    document.getElementById('results-view').style.display = p === 'results' ? 'flex' : 'none';
    document.getElementById('loading-view').style.display = p === 'loading' ? 'flex' : 'none';

    const showFooter = p !== 'setup' && p !== 'loading';
    document.getElementById('footer-panel').style.display = showFooter ? 'flex' : 'none';
    if (role === 'viewer') {
      document.getElementById('btn-row').style.display = 'none';
    } else {
      document.getElementById('close-btn').style.display  = p === 'collect' ? '' : 'none';
      document.getElementById('reset-btn').style.display  = p === 'results' ? '' : 'none';
    }
    refreshHeader();
  }

  function setLoading(msg) {
    document.getElementById('loading-msg').textContent = msg;
    showPhase('loading');
  }

  function setRespCount(n) {
    respCount = n;
    document.getElementById('footer-resp-count').textContent = n;
    const minN = currentSurvey?.num_summaries || 3;
    document.getElementById('close-btn').disabled = n < minN;
  }

  /* Socket */
  function emitState() {
    if (!socket || role !== 'presenter') return;
    const state = { phase, question: currentSurvey?.question };
    if (phase === 'collect') {
      state.surveyId = currentSurvey?.survey_id;
      state.url = document.getElementById('join-url').textContent;
      state.count = respCount;
    } else if (phase === 'results') {
      state.results = currentResults;
      state.idx = currentIdx;
    }
    socket.emit('widget_state', { widgetId, state });
  }

  function applyState(s) {
    if (!s) return;
    if (s.phase === 'collect' && s.surveyId) {
      currentSurvey = { survey_id: s.surveyId, question: s.question };
      setRespCount(s.count || 0);
      showQR(s.url);
      showPhase('collect');
    } else if (s.phase === 'results' && s.results) {
      currentSurvey = { ...(currentSurvey || {}), question: s.question || currentSurvey?.question || cfg.question };
      currentResults = s.results;
      currentIdx = s.idx || 0;
      renderSummary();
      showPhase('results');
    }
  }

  function connectSocket() {
    if (socket) socket.disconnect();
    socket = io(serverUrl);
    socket.on('connect', () => { if (role === 'presenter') socket.emit('join_presenter'); });
    socket.on('widget_state', data => {
      if (role !== 'viewer' || data?.widgetId !== widgetId) return;
      applyState(data.state);
    });
    socket.on('survey_response', data => {
      if (!currentSurvey || data.survey_id !== currentSurvey.survey_id) return;
      setRespCount(data.total);
      emitState();
    });
  }

  /* QR */
  function showQR(url) {
    document.getElementById('join-url').textContent = url || '';
    const qrEl = document.getElementById('qrcode');
    qrEl.innerHTML = '';
    if (url) new QRCode(qrEl, { text: url, width: 180, height: 180, colorDark: '#222', colorLight: '#ffffff' });
  }

  function copyUrl(el) { navigator.clipboard?.writeText(el.textContent).catch(()=>{}); }

  /* Models */
  async function loadModels() {
    try {
      const res = await fetch(`${serverUrl}/api/models`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      const sel = document.getElementById('setup-model');
      sel.innerHTML = '';
      if (!data.models.length) {
        document.getElementById('model-field').style.display = 'none';
        document.getElementById('no-models-msg').style.display = '';
        document.getElementById('launch-btn').disabled = true;
        return;
      }
      data.models.forEach(m => {
        const o = document.createElement('option');
        o.value = m; o.textContent = m.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
        sel.appendChild(o);
      });
    } catch(e) { /* non-fatal */ }
  }

  async function launchSurvey() {
    const question = document.getElementById('setup-question').value.trim() || 'Survey';
    const model    = document.getElementById('setup-model').value;
    const n        = parseInt(document.getElementById('setup-n').value) || 3;
    await doLaunch(question, model, n);
  }

  async function doLaunch(question, model, n) {
    setLoading('Creating survey…');
    try {
      const res = await fetch(`${serverUrl}/api/survey/create`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ question, model, num_summaries: n }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      currentSurvey = { ...data, question, model, num_summaries: n };
      setRespCount(0);
      socket?.emit('join_survey', { survey_id: data.survey_id });
      const base = publicBaseUrl || serverUrl;
      showQR(base + data.url);
      showPhase('collect');
      emitState();
    } catch(e) {
      alert('Failed to create survey: ' + e.message);
      showPhase('setup');
    }
  }

  async function summarize() {
    if (!currentSurvey) return;
    const n = currentSurvey.num_summaries || 3;
    if (respCount < n) { alert(`Need at least ${n} responses.`); return; }
    await fetch(`${serverUrl}/api/survey/${currentSurvey.survey_id}/close`, {method:'POST'}).catch(()=>{});
    setLoading('Summarizing responses…');
    try {
      const res = await fetch(`${serverUrl}/api/survey/${currentSurvey.survey_id}/analyze`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
      });
      if (!res.ok) { const d = await res.json(); throw new Error(d.error); }
      currentResults = await res.json();
      currentIdx = 0;
      renderSummary();
      showPhase('results');
      emitState();
    } catch(e) {
      alert('Analysis failed: ' + e.message);
      showPhase('collect');
    }
  }

  function renderSummary() {
    if (!currentResults?.summaries?.length) return;
    const s = currentResults.summaries[currentIdx];
    const tot = currentResults.summaries.length;
    document.getElementById('summary-text').textContent = s.summary;
    document.getElementById('summary-meta').textContent =
      `${s.num_respondents} respondent${s.num_respondents!==1?'s':''} · based on ${currentResults.num_responses} total response${currentResults.num_responses!==1?'s':''}`;
    document.getElementById('nav-counter').textContent = `${currentIdx+1} / ${tot}`;
    document.getElementById('prev-btn').disabled = currentIdx === 0;
    document.getElementById('next-btn').disabled = currentIdx === tot - 1;
    emitState();
  }

  function prevSummary() { if (currentIdx > 0) { currentIdx--; renderSummary(); } }
  function nextSummary() {
    if (currentResults && currentIdx < currentResults.summaries.length - 1) { currentIdx++; renderSummary(); }
  }

  async function newSurvey() {
    const question = currentSurvey?.question || cfg.question || document.getElementById('setup-question').value.trim() || 'Survey';
    const model = currentSurvey?.model || cfg.model || document.getElementById('setup-model').value;
    const n = currentSurvey?.num_summaries || parseInt(cfg.numSummaries) || parseInt(document.getElementById('setup-n').value) || 3;
    if (currentSurvey) fetch(`${serverUrl}/api/survey/${currentSurvey.survey_id}/close`, {method:'POST'}).catch(()=>{});
    currentSurvey = null; currentResults = null; currentIdx = 0;
    document.getElementById('qrcode').innerHTML = '';
    setRespCount(0);
    await doLaunch(question, model, n);
  }

  document.addEventListener('keydown', e => {
    if (phase !== 'results') return;
    if (e.key === 'ArrowLeft') prevSummary();
    if (e.key === 'ArrowRight') nextSummary();
  });

  async function updateConfig(c) {
    cfg = c || {};
    role = cfg.role || 'presenter';
    widgetId = cfg.id || cfg.widgetId || widgetId;
    serverUrl = cfg.socketUrl || cfg.serverUrl || deriveServer();
    publicBaseUrl = cfg.publicBaseUrl || serverUrl;
    setLoading('Connecting…');
    if (cfg.question) document.getElementById('setup-question').value = cfg.question;
    if (cfg.numSummaries) document.getElementById('setup-n').value = cfg.numSummaries;
    refreshHeader();
    await loadModels();
    connectSocket();
    if (role === 'viewer') { showPhase('loading'); return; }
    if (cfg.model) document.getElementById('setup-model').value = cfg.model;
    const hasConfig = cfg.question && cfg.model;
    if (hasConfig && cfg.autoStart !== false) {
      await doLaunch(cfg.question, cfg.model, parseInt(cfg.numSummaries) || 3);
    } else {
      showPhase('setup');
    }
  }

  window.addEventListener('message', e => {
    if (e.data?.type === 'widget-config') updateConfig(e.data.config);
    if (e.data?.type === 'widget-cleanup') socket?.disconnect();
  });

  (async () => {
    serverUrl = deriveServer();
    await loadModels();
    connectSocket();
    refreshHeader();
    showPhase('setup');
  })();
</script>
</body>
</html>
