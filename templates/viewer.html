<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beamer+ Viewer</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/features/viewer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
    <div id="splash-screen">
        <svg class="splash-squiggle" viewBox="0 0 120 40">
            <path d="M5 20 Q 15 5, 25 20 T 45 20 T 65 20 T 85 20 T 105 20" />
        </svg>
        <div class="splash-title">Beamer+</div>
        <div class="splash-subtitle">Waiting for presenter to share...</div>
    </div>

    <main id="viewer-stage">
        <div id="pdf-container">
            <div id="pdf-canvas"></div>
            <div id="ann-canvas"></div>
            <div class="slide-loading-overlay">
                <svg class="slide-squiggle" viewBox="0 0 120 40">
                    <path d="M5 20 Q 15 5, 25 20 T 45 20 T 65 20 T 85 20 T 105 20" />
                </svg>
            </div>
        </div>
        <div id="viewer-split-divider"></div>
        <div id="pdf-container-2">
            <div id="pdf-canvas-2"></div>
            <div id="ann-canvas-2"></div>
        </div>

        <div id="viewer-waiting">
            <svg class="splash-squiggle" viewBox="0 0 120 40">
                <path d="M5 20 Q 15 5, 25 20 T 45 20 T 65 20 T 85 20 T 105 20" />
            </svg>
            <p>Waiting for presenter to share...</p>
        </div>
    </main>

    <script type="module" src="/static/js/viewer.js"></script>
</body>
</html>
