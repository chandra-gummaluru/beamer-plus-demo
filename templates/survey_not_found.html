<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Not Found — Beamer+</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

:root {
  --bg:         #ffffff;
  --border:     #e9e9e6;
  --text:       #1a1a18;
  --text-3:     #aeaea5;
  --red:        #dc2626;
  --font-mono:  'JetBrains Mono', ui-monospace, monospace;
  --font-ui:    'DM Sans', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-ui); font-size: 15px;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}


.content {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px; gap: 8px; text-align: center;
}
.status-title {
  font-size: 1.3rem; font-weight: 600;
  color: var(--red); line-height: 1.3;
}
.status-sub {
  font-size: 14px; color: var(--text-3);
  line-height: 1.5; margin-top: 2px;
}
</style>
</head>
<body>


<div class="content">
  <div class="status-title">Not found</div>
  <div class="status-sub">This link is invalid or the survey has been removed.</div>
</div>

</body>
</html>
