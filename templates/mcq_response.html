<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg:         oklch(99% 0.003 80);
      --bg-2:       oklch(97% 0.005 80);
      --bg-3:       oklch(94% 0.007 80);
      --bg-4:       oklch(90% 0.008 80);
      --ink-1:      oklch(22% 0.012 260);
      --ink-2:      oklch(38% 0.010 260);
      --ink-3:      oklch(55% 0.008 260);
      --ink-4:      oklch(72% 0.006 260);
      --accent:     oklch(45% 0.005 260);
      --accent-hi:  oklch(32% 0.006 260);
      --accent-lo:  oklch(92% 0.004 260);
      --ok:         oklch(52% 0.14 160);
      --err:        oklch(58% 0.18 25);
      --line:       1px solid oklch(85% 0.005 260);
      --r:          6px;
      --font:       "EB Garamond", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      font-family: var(--font);
      color: var(--ink-1);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0;
    }

    /* ── question ── */
    .question-block {
      padding: 1.5rem 1.25rem 1rem;
      text-align: center;
    }

    .question-text {
      font-size: 1.45rem;
      font-weight: 500;
      line-height: 1.35;
      color: var(--ink-1);
    }

    /* ── options ── */
    .options-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 0.5rem 1.25rem 2rem;
    }

    .option-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: var(--bg-2);
      border: var(--line);
      border-radius: var(--r);
      cursor: pointer;
      font-family: var(--font);
      font-size: 1.15rem;
      color: var(--ink-1);
      text-align: left;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
      background: var(--bg-3);
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: var(--accent-lo);
    }

    .option-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: var(--bg-3);
      border: var(--line);
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--accent);
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }

    .option-btn.selected .option-letter {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .option-text-label {
      flex: 1;
      line-height: 1.3;
    }

    /* ── status cards ── */
    .status-card {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      gap: 10px;
      text-align: center;
    }

    .status-card.visible { display: flex; }

    .status-card .status-title {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--ink-1);
    }

    .status-card .status-sub {
      font-size: 1rem;
      color: var(--ink-3);
    }

    .status-card.ok-card .status-title {
      color: var(--ok);
    }

    /* ── loading skeleton ── */
    .loading-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 2rem;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50%       { opacity: 1;   transform: scale(1.1); }
    }

    .loading-text {
      font-size: 0.95rem;
      color: var(--ink-4);
      font-style: italic;
    }
  </style>
</head>
<body>
  <!-- Loading state -->
  <div class="loading-area" id="loading-area">
    <div class="pulse-dot"></div>
    <span class="loading-text">Loading question...</span>
  </div>

  <!-- Question + options (hidden until loaded) -->
  <div id="poll-area" style="display:none; flex-direction:column; flex:1;">
    <div class="question-block">
      <p class="question-text" id="question-text"></p>
    </div>
    <div class="options-container" id="options-container"></div>
  </div>

  <!-- Status messages -->
  <div class="status-card ok-card" id="thanks-card">
    <div class="status-title">Thank you!</div>
    <div class="status-sub">Your response has been recorded.</div>
  </div>

  <div class="status-card" id="already-voted-card">
    <div class="status-title">Response already recorded</div>
    <div class="status-sub">This device has already submitted a response for this poll.</div>
  </div>

  <div class="status-card" id="closed-card">
    <div class="status-title">Poll has closed</div>
    <div class="status-sub">This poll is no longer accepting responses.</div>
  </div>

  <div class="status-card" id="error-card">
    <div class="status-title">Unable to load poll</div>
    <div class="status-sub" id="error-detail">Please check your connection and try again.</div>
  </div>

  <script>
    const SURVEY_ID = "{{ survey_id }}";
    const LETTERS = ['A','B','C','D','E','F','G','H','I','J'];
    const SESSION_KEY = 'voted_' + SURVEY_ID;

    let socket = null;
    let hasVoted = false;

    // ── Helpers ────────────────────────────────────────────────────
    function showLoading(visible) {
      document.getElementById('loading-area').style.display = visible ? '' : 'none';
    }

    function showPoll(visible) {
      const el = document.getElementById('poll-area');
      el.style.display = visible ? 'flex' : 'none';
    }

    function showCard(id) {
      ['thanks-card', 'already-voted-card', 'closed-card', 'error-card'].forEach(cid => {
        const el = document.getElementById(cid);
        el.classList.toggle('visible', cid === id);
      });
      showPoll(false);
      showLoading(false);
    }

    function disableAllOptions() {
      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = true;
      });
    }

    // ── Build option buttons ───────────────────────────────────────
    function renderOptions(options) {
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      options.forEach((optText, i) => {
        const letter = LETTERS[i] || String(i + 1);
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.letter = letter;
        btn.innerHTML = `
          <span class="option-letter">${letter}</span>
          <span class="option-text-label">${optText}</span>
        `;
        btn.addEventListener('click', () => submitVote(letter, btn));
        container.appendChild(btn);
      });
    }

    // ── Submit vote ────────────────────────────────────────────────
    async function submitVote(letter, btnEl) {
      if (hasVoted) return;
      hasVoted = true;

      disableAllOptions();
      btnEl.classList.add('selected');

      try {
        const res = await fetch('/api/survey/' + SURVEY_ID + '/respond', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ response: letter })
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          if (data.error && data.error.toLowerCase().includes('closed')) {
            showCard('closed-card');
            return;
          }
          throw new Error(data.error || 'Failed to submit');
        }

        sessionStorage.setItem(SESSION_KEY, '1');
        showCard('thanks-card');

      } catch (err) {
        console.error(err);
        hasVoted = false;
        btnEl.classList.remove('selected');
        disableAllOptions();
        // Re-enable
        document.querySelectorAll('.option-btn').forEach(btn => {
          btn.disabled = false;
        });
      }
    }

    // ── Load survey ────────────────────────────────────────────────
    async function loadSurvey() {
      // Check if already voted
      if (sessionStorage.getItem(SESSION_KEY)) {
        showCard('already-voted-card');
        return;
      }

      try {
        const res = await fetch('/api/survey/' + SURVEY_ID);
        if (!res.ok) {
          if (res.status === 404) {
            document.getElementById('error-detail').textContent = 'This poll does not exist.';
          }
          showCard('error-card');
          return;
        }

        const data = await res.json();

        if (data.closed) {
          showCard('closed-card');
          return;
        }

        // Render question and options
        document.getElementById('question-text').textContent = data.question || 'Please select an option:';
        renderOptions(data.options || []);

        showLoading(false);
        showPoll(true);

        // Socket: listen for survey_closed
        initSocket();

      } catch (err) {
        console.error('loadSurvey error:', err);
        showCard('error-card');
      }
    }

    // ── Socket ─────────────────────────────────────────────────────
    function initSocket() {
      try {
        socket = io();
        socket.on('survey_closed', (data) => {
          if (data && data.survey_id && data.survey_id !== SURVEY_ID) return;
          if (!hasVoted) {
            disableAllOptions();
            showCard('closed-card');
          }
        });
      } catch(e) {
        console.warn('Socket unavailable:', e);
      }
    }

    // ── Boot ───────────────────────────────────────────────────────
    loadSurvey();
  </script>
</body>
</html>
