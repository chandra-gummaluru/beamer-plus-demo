<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory Model Diagram Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Patrick Hand', 'Segoe Print', cursive, sans-serif; }
  #toolbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    padding: 10px 12px; background: #f4f5f7; border-bottom: 1px solid #d5d7dc;
  }
  #toolbar button {
    padding: 6px 12px; font-size: 13px; border: 1px solid #b9bcc4; border-radius: 6px;
    background: #fff; cursor: pointer;
  }
  #toolbar button:hover { background: #eef2fb; }
  #toolbar button.active { background: #4a90d9; color: #fff; border-color: #3a7fc4; }
  .sep { width: 1px; height: 22px; background: #d5d7dc; margin: 0 4px; }
  #hint { font-size: 12px; color: #666; margin-left: 8px; }
  #wrapper {
    position: relative; overflow: auto;
    height: calc(100vh - 49px);
    background-color: #fafafa;
    background-image:
      linear-gradient(to right, #eee 1px, transparent 1px),
      linear-gradient(to bottom, #eee 1px, transparent 1px);
    background-size: 20px 20px;
  }
  svg { display: block; background: transparent; }
  #cellEditor {
    position: absolute; display: none; font: 20px "Patrick Hand", cursive;
    border: 2px solid #4a90d9; padding: 2px 4px; outline: none; resize: none;
    background: #fffef0;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btnFrame">+ Frame</button>
  <button id="btnObject">+ Object</button>
  <button id="btnStub">+ Stub</button>
  <span class="sep"></span>
  <button id="btnConnect">+ Arrow</button>
  <button id="btnDelete">Delete Selected</button>
  <span class="sep"></span>
  <button id="btnExportPng">Export PNG</button>
  <button id="btnExportJson">Save JSON</button>
  <button id="btnImportJson">Load JSON</button>
  <input type="file" id="fileInput" accept="application/json" style="display:none">
  <button id="btnClear">Clear All</button>
</div>

<div id="wrapper">
  <svg id="canvas" width="1800" height="1200" xmlns="http://www.w3.org/2000/svg"></svg>
  <textarea id="cellEditor"></textarea>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/rough.js/2.1.1/rough.umd.min.js"></script>
<script>
(function(){
  const svg = document.getElementById('canvas');
  const wrapper = document.getElementById('wrapper');
  const editor = document.getElementById('cellEditor');
  const NS = 'http://www.w3.org/2000/svg';
  const GRID = 20;
  function snap(v){ return Math.round(v / GRID) * GRID; }

  // RoughJS gives everything a hand-drawn look. Fall back to plain SVG shapes
  // if the library didn't load (e.g. offline).
  const rc = (typeof rough !== 'undefined') ? rough.svg(svg) : null;
  function roughRect(x, y, w, h, opts){
    if (rc) return rc.rectangle(x, y, w, h, opts);
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', x); r.setAttribute('y', y);
    r.setAttribute('width', w); r.setAttribute('height', h);
    r.setAttribute('fill', 'none');
    r.setAttribute('stroke', opts.stroke); r.setAttribute('stroke-width', opts.strokeWidth);
    return r;
  }
  function roughLine(x1, y1, x2, y2, opts){
    if (rc) return rc.line(x1, y1, x2, y2, opts);
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', opts.stroke); l.setAttribute('stroke-width', opts.strokeWidth);
    return l;
  }

  let state = { shapes: [], arrows: [], nextId: 1 };
  let selectedShapeId = null;
  let selectedArrowId = null;
  let connectMode = false;
  let pendingSource = null; // {shapeId, cellId}
  let drag = null;          // {shapeId, cellId, startX, startY, origX, origY, moved}
  let editingCellInfo = null; // {shapeId, cellId}

  function uid(prefix){ return prefix + (state.nextId++); }

  function addShape(type){
    const id = uid('s');
    const col = state.shapes.length % 6;
    const row = Math.floor(state.shapes.length / 6);
    const baseX = snap(40 + col * 60);
    const baseY = snap(40 + row * 60);
    const seed = Math.floor(Math.random() * 1000000);
    let shape;
    if (type === 'frame') {
      // two separate top slots with a real gap between them, sitting on one
      // wide body rectangle below, linked by a bridging line across the gap
      const gap = 30, h0w = 96, h1x = h0w + gap, h1w = 300 - h1x;
      shape = { id, type, x: baseX, y: baseY, w: 300, h: 160, seed, cells: [
        { id: 'h0', rx: 0,   ry: 0,  rw: h0w, rh: 70, text: '' },
        { id: 'h1', rx: h1x, ry: 0,  rw: h1w, rh: 70, text: '' },
        { id: 'body', rx: 0, ry: 70, rw: 300, rh: 90, text: '' }
      ]};
    } else if (type === 'object') {
      shape = { id, type, x: baseX, y: baseY, w: 100, h: 100, seed, cells: [
        { id: 'main', rx: 0, ry: 0, rw: 100, rh: 100, text: '' }
      ]};
    } else {
      // stub: a wider invisible hit/drag area, but it's drawn as a single line (see render())
      shape = { id, type, x: baseX, y: baseY, w: 64, h: 20, seed, cells: [
        { id: 'main', rx: 0, ry: 0, rw: 64, rh: 20, text: '' }
      ]};
    }
    state.shapes.push(shape);
    selectedShapeId = id;
    selectedArrowId = null;
    render(); save();
  }

  function getShape(id){ return state.shapes.find(s => s.id === id); }
  function getCell(shape, cellId){ return shape ? shape.cells.find(c => c.id === cellId) : null; }
  function absCellRect(shape, cell){ return { x: shape.x + cell.rx, y: shape.y + cell.ry, w: cell.rw, h: cell.rh }; }

  function anchorRect(anchor){
    const shape = getShape(anchor.shapeId);
    if (!shape) return null;
    if (anchor.cellId) {
      const cell = getCell(shape, anchor.cellId);
      if (cell) return absCellRect(shape, cell);
    }
    return { x: shape.x, y: shape.y, w: shape.w, h: shape.h };
  }

  function clipToRect(rect, tx, ty){
    const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
    const dx = tx - cx, dy = ty - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    const halfW = rect.w / 2, halfH = rect.h / 2;
    const scaleX = dx !== 0 ? halfW / Math.abs(dx) : Infinity;
    const scaleY = dy !== 0 ? halfH / Math.abs(dy) : Infinity;
    const scale = Math.min(scaleX, scaleY);
    return { x: cx + dx * scale, y: cy + dy * scale };
  }

  function clearSvg(){
    Array.from(svg.children).forEach(function(n){
      if (n.tagName.toLowerCase() !== 'defs') svg.removeChild(n);
    });
  }

  function render(){
    clearSvg();

    state.arrows.forEach(function(arrow){
      const rA = anchorRect(arrow.from);
      const rB = anchorRect(arrow.to);
      if (!rA || !rB) return;
      const cA = { x: rA.x + rA.w / 2, y: rA.y + rA.h / 2 };
      const cB = { x: rB.x + rB.w / 2, y: rB.y + rB.h / 2 };
      const p1 = clipToRect(rA, cB.x, cB.y);
      const p2 = clipToRect(rB, cA.x, cA.y);
      const isSel = arrow.id === selectedArrowId;

      // fat invisible line so the arrow is easy to click/select (and then delete)
      const hit = document.createElementNS(NS, 'line');
      hit.setAttribute('x1', p1.x); hit.setAttribute('y1', p1.y);
      hit.setAttribute('x2', p2.x); hit.setAttribute('y2', p2.y);
      hit.setAttribute('stroke', '#000');
      hit.setAttribute('stroke-opacity', '0');
      hit.setAttribute('stroke-width', '14');
      hit.setAttribute('data-arrow-id', arrow.id);
      hit.style.pointerEvents = 'stroke';
      hit.style.cursor = 'pointer';
      svg.appendChild(hit);

      const arrowSeed = arrow.seed || 1;
      const strokeColor = isSel ? '#e07b00' : '#333';
      const strokeW = isSel ? 3 : 2;
      const lineOpts = { stroke: strokeColor, strokeWidth: strokeW, roughness: 1.3, bowing: 1.2, seed: arrowSeed };

      const shaft = roughLine(p1.x, p1.y, p2.x, p2.y, lineOpts);
      shaft.style.pointerEvents = 'none';
      svg.appendChild(shaft);

      // hand-drawn arrowhead: two short strokes fanning back from the tip
      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const headLen = 12, headAngle = 0.5;
      [headAngle, -headAngle].forEach(function(a, i){
        const hx = p2.x - headLen * Math.cos(angle - a);
        const hy = p2.y - headLen * Math.sin(angle - a);
        const seg = roughLine(p2.x, p2.y, hx, hy, Object.assign({}, lineOpts, { seed: arrowSeed + i + 1 }));
        seg.style.pointerEvents = 'none';
        svg.appendChild(seg);
      });
    });

    state.shapes.forEach(function(shape){
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('data-shape-id', shape.id);
      const borderColor = shape.id === selectedShapeId ? '#e07b00' : '#222';
      const borderWidth = shape.id === selectedShapeId ? 2.5 : 1.5;
      const seed = shape.seed || 1;

      // fill the gap between the frame's top boxes so it isn't see-through
      if (shape.type === 'frame') {
        const bg = document.createElementNS(NS, 'rect');
        bg.setAttribute('x', shape.x);
        bg.setAttribute('y', shape.y);
        bg.setAttribute('width', shape.w);
        bg.setAttribute('height', shape.h);
        bg.setAttribute('fill', '#ffffff');
        bg.setAttribute('stroke', 'none');
        bg.setAttribute('data-shape-id', shape.id);
        bg.style.cursor = connectMode ? 'crosshair' : 'move';
        g.appendChild(bg);
      }

      shape.cells.forEach(function(cell, idx){
        const isPending = connectMode && pendingSource && pendingSource.shapeId === shape.id && pendingSource.cellId === cell.id;
        const x = shape.x + cell.rx, y = shape.y + cell.ry;

        // precise invisible rect: exact hit-area + background fill
        const rect = document.createElementNS(NS, 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', y);
        rect.setAttribute('width', cell.rw);
        rect.setAttribute('height', cell.rh);
        rect.setAttribute('fill', isPending ? '#d7f5d2' : '#ffffff');
        rect.setAttribute('stroke', 'none');
        rect.setAttribute('data-shape-id', shape.id);
        rect.setAttribute('data-cell-id', cell.id);
        rect.style.cursor = connectMode ? 'crosshair' : 'move';
        g.appendChild(rect);

        // hand-drawn decoration on top, purely visual (clicks pass through to the rect above).
        // Frame cells don't each get their own border - see the single outline + divider
        // lines drawn once for the whole frame, below.
        if (shape.type === 'stub') {
          // a stub is a pointer slot, not a box: draw it as a single hand-drawn line
          const midY = y + cell.rh / 2;
          const ln = roughLine(x, midY, x + cell.rw, midY, {
            stroke: borderColor, strokeWidth: borderWidth,
            roughness: 1.5, bowing: 1.3, seed: seed + idx
          });
          ln.style.pointerEvents = 'none';
          g.appendChild(ln);
        } else if (shape.type === 'object' || cell.id === 'h0' || cell.id === 'h1') {
          // object shapes, and the frame's two top slots, are each their own
          // little box. The frame's "body" cell is NOT boxed - it's just open
          // interior space inside the big outer box (drawn once, below).
          const border = roughRect(x, y, cell.rw, cell.rh, {
            stroke: borderColor, strokeWidth: borderWidth,
            roughness: 1.5, bowing: 1.3, seed: seed + idx
          });
          border.style.pointerEvents = 'none';
          g.appendChild(border);
        }

        const lines = (cell.text || '').split('\n');
        const lineHeight = 24;
        const text = document.createElementNS(NS, 'text');
        const cx = x + cell.rw / 2;
        const startY = (shape.type === 'stub')
          ? (y + cell.rh / 2) - 8 - (lines.length - 1) * lineHeight
          : y + cell.rh / 2 - (lines.length - 1) * lineHeight / 2 + 7;
        text.setAttribute('x', cx);
        text.setAttribute('y', startY);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '20');
        text.setAttribute('font-family', "'Patrick Hand', cursive");
        text.setAttribute('fill', '#111');
        text.style.pointerEvents = 'none';
        lines.forEach(function(ln, i){
          const tspan = document.createElementNS(NS, 'tspan');
          tspan.setAttribute('x', cx);
          tspan.setAttribute('dy', i === 0 ? 0 : lineHeight);
          tspan.textContent = ln;
          text.appendChild(tspan);
        });
        g.appendChild(text);
      });

      // the big outer box for a frame - drawn once, on its own, with nothing
      // else subdividing it (the two top slots are separate little boxes
      // drawn above; the rest is just open interior)
      if (shape.type === 'frame') {
        const outline = roughRect(shape.x, shape.y, shape.w, shape.h, {
          stroke: borderColor, strokeWidth: borderWidth, roughness: 1.5, bowing: 1.3, seed: seed
        });
        outline.style.pointerEvents = 'none';
        g.appendChild(outline);
      }

      svg.appendChild(g);
    });
  }

  function openEditor(shape, cell){
    editingCellInfo = { shapeId: shape.id, cellId: cell.id };
    editor.style.left = (shape.x + cell.rx) + 'px';
    editor.style.top = (shape.y + cell.ry) + 'px';
    editor.style.width = cell.rw + 'px';
    editor.style.height = cell.rh + 'px';
    editor.value = cell.text || '';
    editor.style.display = 'block';
    editor.focus();
    editor.select();
  }

  function closeEditor(commit){
    if (!editingCellInfo) return;
    if (commit) {
      const shape = getShape(editingCellInfo.shapeId);
      const cell = getCell(shape, editingCellInfo.cellId);
      if (cell) cell.text = editor.value;
    }
    editingCellInfo = null;
    editor.style.display = 'none';
    render(); save();
  }

  editor.addEventListener('blur', function(){ closeEditor(true); });
  editor.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); closeEditor(true); }
    if (e.key === 'Escape') { e.preventDefault(); closeEditor(false); }
    e.stopPropagation();
  });

  function svgPoint(e){
    const rect = svg.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function attr(el, name){
    return (el && el.getAttribute) ? el.getAttribute(name) : null;
  }

  svg.addEventListener('mousedown', function(e){
    if (editingCellInfo) closeEditor(true);
    const shapeId = attr(e.target, 'data-shape-id');
    const cellId = attr(e.target, 'data-cell-id');
    const arrowId = attr(e.target, 'data-arrow-id');

    if (connectMode) {
      if (shapeId) {
        if (!pendingSource) {
          pendingSource = { shapeId: shapeId, cellId: cellId };
          render();
        } else {
          const arrow = { id: uid('a'), from: pendingSource, to: { shapeId: shapeId, cellId: cellId }, seed: Math.floor(Math.random() * 1000000) };
          state.arrows.push(arrow);
          pendingSource = null;
          connectMode = false;
          updateConnectBtn();
          render(); save();
        }
      }
      return;
    }

    if (shapeId) {
      const shape = getShape(shapeId);
      const pt = svgPoint(e);
      drag = { shapeId: shapeId, cellId: cellId, startX: pt.x, startY: pt.y, origX: shape.x, origY: shape.y, moved: false };
      selectedShapeId = shapeId; selectedArrowId = null;
      render();
      e.preventDefault();
    } else if (arrowId) {
      selectedArrowId = arrowId; selectedShapeId = null;
      render();
    } else {
      selectedShapeId = null; selectedArrowId = null;
      render();
    }
  });

  window.addEventListener('mousemove', function(e){
    if (!drag) return;
    const pt = svgPoint(e);
    const dx = pt.x - drag.startX, dy = pt.y - drag.startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) drag.moved = true;
    if (drag.moved) {
      const shape = getShape(drag.shapeId);
      shape.x = snap(drag.origX + dx);
      shape.y = snap(drag.origY + dy);
      render();
    }
  });

  window.addEventListener('mouseup', function(){
    if (!drag) return;
    if (!drag.moved) {
      const shape = getShape(drag.shapeId);
      const cell = getCell(shape, drag.cellId) || (shape ? shape.cells[0] : null);
      if (shape && cell) openEditor(shape, cell);
    } else {
      save();
    }
    drag = null;
  });

  document.addEventListener('keydown', function(e){
    if (editingCellInfo) return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (selectedShapeId) {
        state.shapes = state.shapes.filter(function(s){ return s.id !== selectedShapeId; });
        state.arrows = state.arrows.filter(function(a){ return a.from.shapeId !== selectedShapeId && a.to.shapeId !== selectedShapeId; });
        selectedShapeId = null; render(); save();
      } else if (selectedArrowId) {
        state.arrows = state.arrows.filter(function(a){ return a.id !== selectedArrowId; });
        selectedArrowId = null; render(); save();
      }
    }
    if (e.key === 'Escape') {
      connectMode = false; pendingSource = null; updateConnectBtn(); render();
    }
  });

  function updateConnectBtn(){
    const b = document.getElementById('btnConnect');
    b.classList.toggle('active', connectMode);
    b.textContent = connectMode ? 'Click target… (Esc)' : '+ Arrow';
  }

  document.getElementById('btnFrame').onclick = function(){ addShape('frame'); };
  document.getElementById('btnObject').onclick = function(){ addShape('object'); };
  document.getElementById('btnStub').onclick = function(){ addShape('stub'); };
  document.getElementById('btnConnect').onclick = function(){
    connectMode = !connectMode; pendingSource = null; updateConnectBtn(); render();
  };
  document.getElementById('btnDelete').onclick = function(){
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Delete' }));
  };

  document.getElementById('btnExportPng').onclick = function(){
    const serializer = new XMLSerializer();
    const source = serializer.serializeToString(svg);
    const svgBlob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = function(){
      const canvasEl = document.createElement('canvas');
      canvasEl.width = svg.width.baseVal.value;
      canvasEl.height = svg.height.baseVal.value;
      const ctx = canvasEl.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      canvasEl.toBlob(function(blob){
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'memory-diagram.png';
        a.click();
      });
    };
    img.src = url;
  };

  document.getElementById('btnExportJson').onclick = function(){
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'memory-diagram.json';
    a.click();
  };
  document.getElementById('btnImportJson').onclick = function(){
    document.getElementById('fileInput').click();
  };
  document.getElementById('fileInput').addEventListener('change', function(e){
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try {
        const data = JSON.parse(reader.result);
        state = data;
        selectedShapeId = null; selectedArrowId = null;
        render(); save();
      } catch (err) {
        alert('Invalid file');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  document.getElementById('btnClear').onclick = function(){
    if (confirm('Clear the entire diagram?')) {
      state = { shapes: [], arrows: [], nextId: 1 };
      selectedShapeId = null; selectedArrowId = null;
      render(); save();
    }
  };

  function save(){
    try { localStorage.setItem('memoryDiagramState', JSON.stringify(state)); } catch (e) {}
  }
  function load(){
    try {
      const raw = localStorage.getItem('memoryDiagramState');
      if (raw) state = JSON.parse(raw);
    } catch (e) {}
  }

  load();
  render();
  updateConnectBtn();
})();
</script>
</body>
</html>
