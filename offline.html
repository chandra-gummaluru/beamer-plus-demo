<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Beamer+</title>
    <style>
        @font-face {
            font-family: "Computer Modern Sans";
            src: url("https://mirrors.ctan.org/fonts/cm-unicode/fonts/otf/cmunss.otf");
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Computer Modern Sans", sans-serif;
            background: #fcfcfc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .offline-container {
            max-width: 600px;
            text-align: center;
        }

        .offline-icon {
            font-size: 5rem;
            margin-bottom: 2rem;
            opacity: 0.5;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #666;
        }

        .retry-button {
            background: #333;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .retry-button:hover {
            background: #555;
        }

        .retry-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>
            It looks like you've lost your internet connection. 
            Some features of Beamer+ may not be available right now.
        </p>
        <p>
            Don't worry though – your cached presentations and basic features 
            are still accessible!
        </p>
        <button class="retry-button" onclick="location.reload()">
            Try Again
        </button>
    </div>
</body>
</html>
