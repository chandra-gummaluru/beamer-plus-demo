<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Beamer+ Viewer</title>
        <link rel="stylesheet" href="static/css/button.css" />
        <link rel="stylesheet" href="static/css/viewer.css" />

        <!-- Beamer+ Font -->
        <style>
            @font-face {
                font-family: "Computer Modern Sans";
                src: url("https://mirrors.ctan.org/fonts/cm-unicode/fonts/otf/cmunss.otf");
                font-display: swap;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #fcfcfc;
                font-family: "Computer Modern Sans", sans-serif;
            }

            /* Viewer container */
            #viewer-container {
                width: 100vw;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                inset: 0;
                z-index: 1;
                background: #fcfcfc;
                padding: 0;
            }

            #screen-display {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: none;
            }

            /* Waiting message */
            #waiting-message {
                text-align: center;
                color: #666;
            }

            #waiting-message h2 {
                font-size: 28px;
                margin-bottom: 20px;
                margin-top: 20px;
                font-weight: 700;
                color: #333;
            }

            #waiting-message p {
                font-size: 16px;
                color: #666;
            }

            /* Scribble animation matching Beamer+ modal style */
            .viewer-squiggle {
                width: 120px;
                height: 40px;
                display: block;
                margin: 0 auto;
            }

            .viewer-squiggle path {
                fill: none;
                stroke: #666;
                stroke-width: 3;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-dasharray: 150;
                stroke-dashoffset: 150;
                animation: draw-squiggle 1.6s ease-in-out infinite;
            }

            @keyframes draw-squiggle {
                0% {
                    stroke-dashoffset: 150;
                    opacity: 0.6;
                }
                40% {
                    stroke-dashoffset: 0;
                    opacity: 1;
                }
                100% {
                    stroke-dashoffset: -150;
                    opacity: 0.6;
                }
            }

            /* FPS counter in corner */
            #stream-info {
                position: fixed;
                top: 20px;
                right: 20px;
                font-size: 14px;
                font-weight: 600;
                color: #333;
                background: #eee;
                padding: 6px 12px;
                border-radius: 4px;
                border: 1px solid #999;
                opacity: 0.9;
                display: none;
            }
        </style>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    </head>
    <body>
        <span id="stream-info"></span>

        <div id="viewer-panel">
            <div class="viewer-left">
                <div id="switch-container"></div>
            </div>
            <div class="viewer-right">
                <!-- note: there's nothing in viewer-right rn. -->
            </div>
        </div>

        <div id="viewer-container">
            <div id="waiting-message">
                <svg
                    class="viewer-squiggle"
                    viewBox="0 0 120 40"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M 5,20 Q 15,5 25,20 T 45,20 Q 55,5 65,20 T 85,20 Q 95,5 105,20 T 115,20"
                    />
                </svg>
            </div>
            <img id="screen-display" alt="Presentation Screen" />
        </div>

        <div id="switch-presentation-container" class="hidden">
            <h1>Viewer's Presentation</h1>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
        <script type="module" src="/static/js/viewer.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    </body>
</html>
