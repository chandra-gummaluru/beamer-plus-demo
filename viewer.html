<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Beamer+ Viewer</title>
        <link rel="stylesheet" href="/static/css/shared.css">
        <link rel="stylesheet" href="/static/css/control-panel.css">
        <link rel="stylesheet" href="/static/css/button.css">
        <link rel="stylesheet" href="/static/css/selector.css">
        <link rel="stylesheet" href="/static/css/label.css">
        <link rel="stylesheet" href="/static/css/toggle.css">
        <link rel="stylesheet" href="/static/css/canvas.css">
        <link rel="stylesheet" href="/static/css/timer.css">
        <link rel="stylesheet" href="/static/css/modal.css">
        <link rel="stylesheet" href="/static/css/survey.css">
        <link rel="stylesheet" href="/static/css/splash.css">
        <link rel="stylesheet" href="static/css/viewer.css" />
        <link rel="stylesheet" href="static/css/viewer-panel.css">
        
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
        <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

</script>
    </head>
    <body>
        <span id="stream-info"></span>

        <div id="viewer-panel">
            <div id="viewer-left">
                <div id="switch-container"></div>
                <div id="viewer-prev-btn"></div>
                <div id="viewer-next-btn"></div>
            </div>
            <div id="viewer-right">
                <!-- note: there's nothing in viewer-right rn. -->
            </div>
        </div>

        <div id="viewer-slide-navigator"></div>

        <div id="viewer-container">
            <div id="waiting-message">
                <svg
                    class="viewer-squiggle"
                    viewBox="0 0 120 40"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M 5,20 Q 15,5 25,20 T 45,20 Q 55,5 65,20 T 85,20 Q 95,5 105,20 T 115,20"
                    />
                </svg>
            </div>
            <img id="screen-display" alt="Presentation Screen" />
        </div>

        <div id="switch-presentation-container" class="hidden">
            <div id="viewer-pdf-canvas"></div>
        </div>

        <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
        <script type="module" src="/static/js/viewer.js"></script>
    </body>
</html>
