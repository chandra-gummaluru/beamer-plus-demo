<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Open Survey",
  "category": "Audience Response",
  "fields": [
    { "key": "question",     "label": "Question",               "type": "textarea", "placeholder": "Enter survey question…", "rows": 3 },
    { "key": "autoStart",    "label": "Auto-start",             "type": "checkbox", "default": false },
    { "key": "minResponses", "label": "Min. responses to show", "type": "number",   "min": 1, "step": 1, "default": 1 },
    { "key": "numSummaries", "label": "AI summary count",       "type": "number",   "min": 0, "step": 1, "default": 3 }
  ]
}
</script>
<meta charset="utf-8">
<title>Survey — Beamer+</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap');

:root {
  --bg:         #ffffff;
  --bg-subtle:  #f9f9f8;
  --border:     #e9e9e6;
  --border-med: #d4d4cf;
  --text:       #1a1a18;
  --text-2:     #6b6b65;
  --text-3:     #aeaea5;
  --accent:     #52524e;
  --accent-bg:  #f0f0ee;
  --green:      #15803d;
  --radius:     6px;
  --font-mono:  'JetBrains Mono', ui-monospace, monospace;
  --font-ui:    'DM Sans', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: var(--font-ui); background: var(--bg); color: var(--text); font-size: 13px; }
#shell { display: flex; flex-direction: column; height: 100%; }

/* ── Toolbar ─────────────────────────────────────────── */
#toolbar {
  flex-shrink: 0; height: 42px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 14px; gap: 6px;
}
.toolbar-title { font-size: 13px; font-weight: 500; flex-shrink: 0; }
.sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
#resp-count { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); flex-shrink: 0; }
#resp-count strong { color: var(--text-2); font-weight: 500; }
.spacer { flex: 1; }
#close-btn {
  height: 28px; padding: 0 12px;
  border: 1px solid var(--text); border-radius: var(--radius);
  background: var(--text); color: #fff;
  font-family: var(--font-ui); font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap; display: none;
  transition: background 0.1s;
}
#close-btn:hover:not(:disabled) { background: #2d2d2a; }
#close-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── Collect view ────────────────────────────────────── */
#collect-view { flex: 1; display: none; flex-direction: column; overflow: hidden; }

#question-area {
  flex-shrink: 0; padding: 22px 32px 16px;
  border-bottom: 1px solid var(--border); text-align: center;
}
#question-text {
  font-size: clamp(16px, 3vw, 24px);
  font-weight: 500; line-height: 1.35; color: var(--text);
}

#qr-area {
  flex: 1; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 12px 24px 10%;
}
.scan-hint {
  font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-3); user-select: none;
}
#qrcode-wrap {
  padding: 10px; background: white;
  border: 1px solid var(--border); border-radius: var(--radius); line-height: 0;
}
#join-url {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
  text-align: center; max-width: 420px; word-break: break-all;
  cursor: pointer; padding: 3px 8px; border-radius: 4px;
  transition: color 0.1s, background 0.1s;
}
#join-url:hover { background: var(--bg-subtle); color: var(--text-2); }

/* ── Loading view ────────────────────────────────────── */
#loading-view {
  flex: 1; display: none;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
}
.spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-msg { font-size: 13px; color: var(--text-3); }

/* ── Results view ────────────────────────────────────── */
#results-view {
  flex: 1; display: none;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 24px; overflow-y: auto;
}
.summary-card {
  width: 100%; max-width: 580px;
  background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px 26px;
}
#summary-text { font-size: 14px; line-height: 1.75; color: var(--text-2); }
#summary-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); margin-top: 14px; }
.carousel-nav { display: flex; align-items: center; gap: 12px; }
#nav-counter { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
.nav-btn {
  width: 28px; height: 28px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text-2); font-size: 14px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
}
.nav-btn:hover:not(:disabled) { background: var(--bg-subtle); border-color: var(--border-med); color: var(--text); }
.nav-btn:disabled { opacity: 0.28; cursor: default; }

/* ── Responses view ─────────────────────────────────── */
#responses-view {
  flex: 1; display: none;
  flex-direction: column; overflow: hidden;
}
#responses-list {
  flex: 1; overflow-y: auto;
  padding: 16px 20px; display: flex; flex-direction: column; gap: 8px;
}
.resp-card {
  background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 11px 14px;
  font-size: 13px; line-height: 1.55; color: var(--text);
}
.resp-card .resp-meta {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-3); margin-top: 6px;
}
#responses-empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--text-3); font-size: 13px;
}

/* ── Mode pill ───────────────────────────────────────── */
.mode-btn {
  height: 26px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text-2);
  font-family: var(--font-ui); font-size: 11.5px; font-weight: 500;
  cursor: pointer; white-space: nowrap;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
}
.mode-btn.active {
  background: var(--text); color: #fff; border-color: var(--text);
}
</style>
</head>
<body>
<div id="shell">

  <div id="toolbar">
    <span class="toolbar-title">Survey</span>
    <div class="sep"></div>
    <span id="resp-count"><strong id="resp-n">0</strong> responses</span>
    <div class="sep"></div>
    <button class="mode-btn active" id="mode-responses" onclick="setMode('responses')">Responses</button>
    <button class="mode-btn"        id="mode-summary"   onclick="setMode('summary')">Summary</button>
    <div class="spacer"></div>
    <button id="close-btn" onclick="closeAndReview()">Close &amp; Review →</button>
  </div>

  <div id="collect-view">
    <div id="question-area"><div id="question-text"></div></div>
    <div id="qr-area">
      <div class="scan-hint">Scan to respond</div>
      <div id="qrcode-wrap"><div id="qrcode"></div></div>
      <div id="join-url" onclick="copyUrl()" title="Click to copy"></div>
    </div>
  </div>

  <div id="loading-view">
    <div class="spinner"></div>
    <div id="loading-msg">Loading…</div>
  </div>

  <div id="responses-view">
    <div id="responses-list"></div>
  </div>

  <div id="results-view">
    <div class="summary-card">
      <div id="summary-text"></div>
      <div id="summary-meta"></div>
    </div>
    <div class="carousel-nav">
      <button class="nav-btn" id="prev-btn" onclick="prevSummary()" disabled>‹</button>
      <span id="nav-counter"></span>
      <button class="nav-btn" id="next-btn" onclick="nextSummary()" disabled>›</button>
    </div>
  </div>

</div>
<script>
(function () {

let cfg = {}, socket = null, role = 'presenter';
let widgetId = 'survey', serverUrl = '', publicBaseUrl = '';
let currentSurvey = null, currentResults = null, currentIdx = 0;
let respCount = 0, phase = 'idle', minResponses = 1;
let surveyMode = 'responses'; // 'responses' | 'summary'

function deriveServer() {
  try { return window.parent.location.origin; } catch (_) { return window.location.origin; }
}

function setRespCount(n) {
  respCount = n;
  document.getElementById('resp-n').textContent = n;
  document.getElementById('close-btn').disabled = n < minResponses;
}

function showPhase(p) {
  phase = p;
  document.getElementById('collect-view').style.display    = p === 'collect'   ? 'flex' : 'none';
  document.getElementById('loading-view').style.display    = p === 'loading'   ? 'flex' : 'none';
  document.getElementById('responses-view').style.display  = p === 'responses' ? 'flex' : 'none';
  document.getElementById('results-view').style.display    = p === 'results'   ? 'flex' : 'none';
  const btn = document.getElementById('close-btn');
  btn.style.display = (p === 'collect' && role === 'presenter') ? 'block' : 'none';
}

function setMode(m) {
  surveyMode = m;
  document.getElementById('mode-responses').classList.toggle('active', m === 'responses');
  document.getElementById('mode-summary').classList.toggle('active', m === 'summary');
}

function showQR(url) {
  document.getElementById('join-url').textContent = url || '';
  const el = document.getElementById('qrcode'); el.innerHTML = '';
  if (url) new QRCode(el, { text: url, width: 180, height: 180, colorDark: '#1a1a18', colorLight: '#ffffff' });
}

function copyUrl() {
  navigator.clipboard?.writeText(document.getElementById('join-url').textContent).catch(() => {});
}

function emitState() {
  if (!socket || role !== 'presenter') return;
  const state = { phase, question: currentSurvey?.question, surveyMode };
  if (phase === 'collect') { state.surveyId = currentSurvey?.survey_id; state.url = document.getElementById('join-url').textContent; state.count = respCount; }
  else if (phase === 'responses') { state.surveyId = currentSurvey?.survey_id; }
  else if (phase === 'results') { state.results = currentResults; state.idx = currentIdx; }
  socket.emit('widget_state', { widgetId, state });
}

function applyState(s) {
  if (!s) return;
  if (s.surveyMode) setMode(s.surveyMode);
  if (s.phase === 'collect' && s.surveyId) {
    currentSurvey = { survey_id: s.surveyId, question: s.question };
    document.getElementById('question-text').textContent = s.question || '';
    setRespCount(s.count || 0); showQR(s.url); showPhase('collect');
  } else if (s.phase === 'responses' && s.surveyId) {
    currentSurvey = { ...(currentSurvey || {}), survey_id: s.surveyId, question: s.question };
    fetchAndShowResponses();
  } else if (s.phase === 'results' && s.results) {
    currentSurvey  = { ...(currentSurvey || {}), question: s.question };
    currentResults = s.results; currentIdx = s.idx || 0;
    renderSummary(); showPhase('results');
  }
}

function connectSocket() {
  if (socket) socket.disconnect();
  socket = io(serverUrl);
  socket.on('connect', () => { if (role === 'presenter') socket.emit('join_presenter'); });
  socket.on('widget_state', data => { if (role !== 'viewer' || data?.widgetId !== widgetId) return; applyState(data.state); });
  socket.on('survey_response', data => {
    if (!currentSurvey || data.survey_id !== currentSurvey.survey_id) return;
    setRespCount(data.total);
    // Live-append to responses view if it's open
    if (phase === 'responses' && data.response) appendResponseCard(data.response);
    emitState();
  });
}

async function doLaunch(question, model, n) {
  minResponses = n || 1;
  document.getElementById('loading-msg').textContent = 'Creating survey…';
  showPhase('loading');
  try {
    const res  = await fetch(`${serverUrl}/api/survey/create`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, model, num_summaries: n }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    currentSurvey = { ...data, question, model, num_summaries: n };
    setRespCount(0);
    document.getElementById('question-text').textContent = question;
    showQR((publicBaseUrl || serverUrl) + data.url);
    showPhase('collect'); emitState();
  } catch (e) { console.error('doLaunch:', e); }
}

async function closeAndReview() {
  if (!currentSurvey) return;
  await fetch(`${serverUrl}/api/survey/${currentSurvey.survey_id}/close`, { method: 'POST' }).catch(() => {});
  if (surveyMode === 'summary') {
    await summarize();
  } else {
    await fetchAndShowResponses();
  }
}

async function fetchAndShowResponses() {
  document.getElementById('loading-msg').textContent = 'Loading responses…';
  showPhase('loading');
  try {
    const res = await fetch(`${serverUrl}/api/survey/${currentSurvey.survey_id}/responses`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderResponsesList(data.responses || []);
    showPhase('responses'); emitState();
  } catch (e) {
    console.error('fetchAndShowResponses:', e);
    showPhase('collect');
  }
}

function renderResponsesList(responses) {
  const list = document.getElementById('responses-list');
  list.innerHTML = '';
  if (!responses.length) {
    list.innerHTML = '<div id="responses-empty">No responses yet.</div>';
    return;
  }
  for (const r of responses) appendResponseCard(r, list);
}

function appendResponseCard(r, list) {
  list = list || document.getElementById('responses-list');
  const empty = list.querySelector('#responses-empty');
  if (empty) empty.remove();
  const card = document.createElement('div');
  card.className = 'resp-card';
  const text = document.createElement('div');
  text.textContent = typeof r === 'string' ? r : (r.response || r.text || JSON.stringify(r));
  card.appendChild(text);
  if (r.timestamp) {
    const meta = document.createElement('div');
    meta.className = 'resp-meta';
    meta.textContent = new Date(r.timestamp * 1000).toLocaleTimeString();
    card.appendChild(meta);
  }
  list.appendChild(card);
}

async function summarize() {
  if (!currentSurvey) return;
  document.getElementById('loading-msg').textContent = 'Summarizing responses…';
  showPhase('loading');
  try {
    const res = await fetch(`${serverUrl}/api/survey/${currentSurvey.survey_id}/analyze`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
    });
    if (!res.ok) { const d = await res.json(); throw new Error(d.error); }
    currentResults = await res.json(); currentIdx = 0;
    renderSummary(); showPhase('results'); emitState();
  } catch (e) { console.error('summarize:', e); showPhase('collect'); }
}

function renderSummary() {
  if (!currentResults?.summaries?.length) return;
  const s = currentResults.summaries[currentIdx];
  const tot = currentResults.summaries.length;
  document.getElementById('summary-text').textContent = s.summary;
  document.getElementById('summary-meta').textContent =
    `${s.num_respondents} respondent${s.num_respondents !== 1 ? 's' : ''} · ${currentResults.num_responses} total responses`;
  document.getElementById('nav-counter').textContent = `${currentIdx + 1} / ${tot}`;
  document.getElementById('prev-btn').disabled = currentIdx === 0;
  document.getElementById('next-btn').disabled = currentIdx === tot - 1;
  emitState();
}

function prevSummary() { if (currentIdx > 0) { currentIdx--; renderSummary(); } }
function nextSummary() { if (currentResults && currentIdx < currentResults.summaries.length - 1) { currentIdx++; renderSummary(); } }

document.addEventListener('keydown', e => {
  if (phase !== 'results') return;
  if (e.key === 'ArrowLeft') prevSummary();
  if (e.key === 'ArrowRight') nextSummary();
});

async function updateConfig(c) {
  cfg = c || {}; role = cfg.role || 'presenter';
  widgetId = cfg.id || cfg.widgetId || widgetId;
  serverUrl = cfg.socketUrl || cfg.serverUrl || deriveServer();
  publicBaseUrl = cfg.publicBaseUrl || serverUrl;
  minResponses = parseInt(cfg.minResponses) || 1;
  if (cfg.mode) setMode(cfg.mode);
  connectSocket();
  if (role === 'viewer') { showPhase('loading'); return; }
  if (cfg.question && cfg.autoStart !== false) {
    await doLaunch(cfg.question, cfg.model || null, parseInt(cfg.numSummaries) || 3);
  }
}

window.addEventListener('message', e => {
  if (e.data?.type === 'widget-config')  updateConfig(e.data.config);
  if (e.data?.type === 'widget-cleanup') socket?.disconnect();
});
window.setMode      = setMode;
window.closeAndReview = closeAndReview;
window.prevSummary  = prevSummary;
window.nextSummary  = nextSummary;
window.copyUrl      = copyUrl;
})();
</script>
</body>
</html>
