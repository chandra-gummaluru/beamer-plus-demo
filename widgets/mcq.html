<!DOCTYPE html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Multiple Choice",
  "category": "Audience Response",
  "fields": [
    { "key": "question",      "label": "Question",                              "type": "textarea",        "placeholder": "Enter the question…", "rows": 3 },
    { "key": "options",       "label": "Answer options (one per line)",         "type": "textarea-lines",  "placeholder": "Option A\nOption B\nOption C", "rows": 4 },
    { "key": "correctAnswer", "label": "Correct option (1-based, blank=none)", "type": "number-nullable", "min": 1, "step": 1 }
  ]
}
</script>
<meta charset="utf-8">
<title>MCQ — Beamer+</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script src="/static/vendor/qrcode.min.js"></script>
<script src="/static/vendor/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap');

:root {
  --bg:         #ffffff;
  --bg-subtle:  #f9f9f8;
  --border:     #e9e9e6;
  --border-med: #d4d4cf;
  --text:       #1a1a18;
  --text-2:     #6b6b65;
  --text-3:     #aeaea5;
  --accent:     #52524e;
  --accent-bg:  #f0f0ee;
  --green:      #15803d;
  --red:        #dc2626;
  --radius:     6px;
  --font-mono:  'JetBrains Mono', ui-monospace, monospace;
  --font-ui:    'DM Sans', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: var(--font-ui); background: var(--bg); color: var(--text); font-size: 13px; }

#shell { display: flex; flex-direction: column; height: 100%; }

/* ── Toolbar ─────────────────────────────────────────── */
#toolbar {
  flex-shrink: 0; height: 42px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 14px; gap: 6px;
}
.toolbar-title { font-size: 13px; font-weight: 500; flex-shrink: 0; }
.sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
#resp-count {
  font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3);
  flex-shrink: 0;
}
#resp-count strong { color: var(--text-2); font-weight: 500; }
.spacer { flex: 1; }
#close-btn {
  height: 28px; padding: 0 12px;
  border: 1px solid var(--text); border-radius: var(--radius);
  background: var(--text); color: #fff;
  font-family: var(--font-ui); font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap; display: none;
  transition: background 0.1s;
}
#close-btn:hover { background: #2d2d2a; }

/* ── Collect view ────────────────────────────────────── */
#collect-view {
  flex: 1; display: none;
  flex-direction: column; overflow: hidden;
}

/* Question */
#question-area {
  flex-shrink: 0;
  padding: 22px 32px 16px;
  border-bottom: 1px solid var(--border);
  text-align: center;
}
#question-text {
  font-size: clamp(16px, 3vw, 24px);
  font-weight: 500; line-height: 1.35; color: var(--text);
}
#question-text p { margin: 0; }
#question-text .katex { font-size: 1em; }

/* Choices row */
#choices-row {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 14px 24px 0; flex-wrap: wrap;
}
.choice-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 14px 6px 8px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--bg-subtle); font-size: 12.5px; color: var(--text-2);
  line-height: 1.3;
}
.choice-pill .letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent-bg); border: 1px solid var(--border-med);
  color: var(--accent); font-size: 10.5px; font-weight: 700;
  font-family: var(--font-mono); flex-shrink: 0;
}
.choice-pill .choice-label { color: var(--text); }
.choice-pill .choice-label .katex { font-size: 1em; }
.choice-pill .choice-label p { margin: 0; display: inline; }

/* QR area — biased slightly above true centre */
#qr-area {
  flex: 1; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 12px 24px 10%;
}
.scan-hint {
  font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-3); user-select: none;
}
#qrcode-wrap {
  padding: 10px; background: white;
  border: 1px solid var(--border); border-radius: var(--radius); line-height: 0;
}
#join-url {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
  text-align: center; max-width: 420px; word-break: break-all;
  cursor: pointer; padding: 3px 8px; border-radius: 4px;
  transition: color 0.1s, background 0.1s;
}
#join-url:hover { background: var(--bg-subtle); color: var(--text-2); }

/* ── Results view ────────────────────────────────────── */
#results-view {
  flex: 1; display: none;
  flex-direction: column; padding: 18px 24px;
  gap: 4px; overflow-y: auto; justify-content: center;
}
.bar-row { display: grid; grid-template-columns: 28px 1fr 56px; align-items: center; gap: 8px; }
.bar-label { font-size: 11px; font-weight: 700; font-family: var(--font-mono); color: var(--text-2); text-align: center; }
.bar-label.correct { color: var(--green); }
.bar-track { height: 28px; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width 0.65s cubic-bezier(.22,1,.36,1); }
.bar-fill.correct { background: var(--green); }
.bar-meta { display: flex; flex-direction: column; align-items: flex-end; }
.bar-pct { font-size: 12px; font-weight: 600; font-family: var(--font-mono); color: var(--text); }
.bar-votes { font-size: 10px; color: var(--text-3); font-family: var(--font-mono); }
.bar-text-row { display: grid; grid-template-columns: 28px 1fr 56px; gap: 8px; margin-top: -2px; margin-bottom: 4px; }
.bar-option-text { grid-column: 2; font-size: 11px; color: var(--text-3); line-height: 1.3; }
.bar-option-text .katex { font-size: 1em; }
.bar-option-text p { margin: 0; }
</style>
</head>
<body>
<div id="shell">

  <div id="toolbar">
    <span class="toolbar-title">MCQ Poll</span>
    <div class="sep"></div>
    <span id="resp-count"><strong id="resp-n">0</strong> responses</span>
    <div class="spacer"></div>
    <button id="close-btn" onclick="closePoll()">Close &amp; Review →</button>
  </div>

  <div id="collect-view">
    <div id="question-area">
      <div id="question-text"></div>
    </div>
    <div id="choices-row"></div>
    <div id="qr-area">
      <div class="scan-hint">Scan to respond</div>
      <div id="qrcode-wrap"><div id="qrcode"></div></div>
      <div id="join-url" onclick="copyUrl()" title="Click to copy"></div>
    </div>
  </div>

  <div id="results-view"></div>

</div>
<script>
(function () {

const LETTERS = ['A','B','C','D','E','F','G','H'];
const letter  = i => LETTERS[i] || String(i + 1);

let cfg = {}, socket = null, role = 'presenter';
let widgetId = 'mcq', serverUrl = '', publicBaseUrl = '';
let surveyId = null, pollInterval = null, pollClosed = false, revealed = false;
let votes = {}, options = [], correctAnswer = null;

function setMd(el, src) {
  if (!src) { el.textContent = ''; return; }
  el.innerHTML = marked.parse(src, { breaks: false });
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$',  right: '$',  display: false },
        { left: '\\(', right: '\\)', display: false },
        { left: '\\[', right: '\\]', display: true },
      ], throwOnError: false,
    });
  }
}

function setRespCount(n) { document.getElementById('resp-n').textContent = n; }

function renderChoices() {
  const row = document.getElementById('choices-row');
  row.innerHTML = '';
  options.forEach((opt, i) => {
    const pill  = document.createElement('div');
    pill.className = 'choice-pill';
    const ls = document.createElement('span'); ls.className = 'letter'; ls.textContent = letter(i);
    const ts = document.createElement('span'); ts.className = 'choice-label md-content';
    pill.appendChild(ls); pill.appendChild(ts); row.appendChild(pill);
    setMd(ts, opt);
  });
}

function renderChart() {
  const view  = document.getElementById('results-view');
  const total = Object.values(votes).reduce((s, v) => s + v, 0);
  view.innerHTML = '';
  options.forEach((opt, i) => {
    const k   = letter(i);
    const n   = votes[k] || 0;
    const pct = total > 0 ? Math.round(n / total * 100) : 0;
    const ok  = revealed && correctAnswer === i;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <span class="bar-label${ok ? ' correct' : ''}">${k}</span>
      <div class="bar-track"><div class="bar-fill${ok ? ' correct' : ''}" data-pct="${pct}"></div></div>
      <div class="bar-meta"><span class="bar-pct">${pct}%</span><span class="bar-votes">${n}v</span></div>`;
    view.appendChild(row);
    const tr = document.createElement('div'); tr.className = 'bar-text-row';
    const te = document.createElement('span'); te.className = 'bar-option-text md-content';
    tr.appendChild(document.createElement('span'));
    tr.appendChild(te);
    tr.appendChild(document.createElement('span'));
    view.appendChild(tr); setMd(te, opt);
  });
  requestAnimationFrame(() => {
    view.querySelectorAll('.bar-fill').forEach(el => { el.style.width = el.dataset.pct + '%'; });
  });
}

function showPhase(p) {
  document.getElementById('collect-view').style.display = p === 'collect' ? 'flex' : 'none';
  document.getElementById('results-view').style.display = p === 'results' ? 'flex' : 'none';
  const btn = document.getElementById('close-btn');
  btn.style.display = (p === 'collect' && role === 'presenter') ? 'block' : 'none';
  if (p === 'collect') renderChoices();
  if (p === 'results') renderChart();
}

function showQR(sid) {
  const url = `${publicBaseUrl || serverUrl}/mcq/${sid}`;
  document.getElementById('join-url').textContent = url;
  const el = document.getElementById('qrcode');
  if (!el.innerHTML)
    new QRCode(el, { text: url, width: 180, height: 180, colorDark: '#1a1a18', colorLight: '#ffffff' });
}

function copyUrl() {
  navigator.clipboard?.writeText(document.getElementById('join-url').textContent).catch(() => {});
}

function emitState() {
  if (!socket || role !== 'presenter') return;
  socket.emit('widget_state', { widgetId,
    state: { question: cfg.question, options, votes, revealed, correctAnswer, surveyId, pollClosed } });
}

function applyState(s) {
  if (!s || !s.options?.length) return;
  options = s.options; votes = s.votes || {}; revealed = s.revealed || false;
  correctAnswer = s.correctAnswer ?? null; pollClosed = s.pollClosed || false;
  setMd(document.getElementById('question-text'), s.question || '');
  setRespCount(Object.values(votes).reduce((a, b) => a + b, 0));
  showPhase(pollClosed ? 'results' : 'collect');
  if (!pollClosed && s.surveyId) showQR(s.surveyId);
}

function initSocket() {
  const url = cfg.socketUrl || serverUrl;
  if (!url) return;
  socket = io(url);
  socket.on('connect', () => { if (role === 'presenter') socket.emit('join_presenter'); });
  socket.on('widget_state', data => {
    if (role !== 'viewer' || data?.widgetId !== widgetId) return;
    applyState(data.state);
  });
}

async function startPoll() {
  if (!cfg.question || !options.length) return;
  try {
    const res = await fetch(`${serverUrl}/api/survey/create`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: cfg.question, options, model: null, num_summaries: 0 }),
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    surveyId = data.survey_id; votes = {}; revealed = false; pollClosed = false;
    setRespCount(0);
    setMd(document.getElementById('question-text'), cfg.question);
    showQR(surveyId); showPhase('collect');
    pollInterval = setInterval(fetchVotes, 3000);
    emitState();
  } catch (e) { console.error('startPoll:', e); }
}

async function fetchVotes() {
  if (!surveyId) return;
  const res = await fetch(`${serverUrl}/api/survey/${surveyId}/responses`).catch(() => null);
  if (!res?.ok) return;
  const data = await res.json();
  const nv = {};
  (data.responses || []).forEach(r => { const k = (r.text || '').trim().toUpperCase(); if (k) nv[k] = (nv[k] || 0) + 1; });
  votes = nv;
  setRespCount(Object.values(votes).reduce((a, b) => a + b, 0));
  if (pollClosed) renderChart();
  emitState();
}

async function closePoll() {
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
  await fetchVotes(); pollClosed = true;
  if (surveyId) fetch(`${serverUrl}/api/survey/${surveyId}/close`, { method: 'POST' }).catch(() => {});
  showPhase('results'); emitState();
}

function init(c) {
  cfg = c || {}; role = cfg.role || 'presenter';
  widgetId = cfg.id || cfg.widgetId || widgetId;
  serverUrl = cfg.socketUrl || cfg.serverUrl || (() => { try { return window.parent.location.origin; } catch (_) { return window.location.origin; } })();
  publicBaseUrl = cfg.publicBaseUrl || serverUrl;
  options = cfg.options || []; correctAnswer = cfg.correctAnswer ?? null;
  if (cfg.question) setMd(document.getElementById('question-text'), cfg.question);
  initSocket();
  if (role !== 'viewer' && cfg.question && options.length) startPoll();
}

window.addEventListener('message', e => {
  if (e.data?.type === 'widget-config')  init(e.data.config);
  if (e.data?.type === 'widget-cleanup') { clearInterval(pollInterval); socket?.disconnect(); }
});
window.closePoll = closePoll;
window.copyUrl   = copyUrl;
})();
</script>
</body>
</html>
