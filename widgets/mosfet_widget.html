<!doctype html>

      "default": 0.55, "min": 0, "max": 1, "step": 0.05 },
    { "key": "vth", "label": "Threshold voltage (Vth)", "type": "number",
      "default": 0.25, "min": 0.1, "max": 0.9, "step": 0.05 }
  ]

<meta charset="utf-8"/>
<title>MOSFET — Beamer+</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>

  --high: #f59e0b;
  --mono: 'JetBrains Mono','Fira Code',ui-monospace,monospace;

}

html,body { height:100%; margin:0; }
body { font-family:var(--font-ui,var(--ui)); color:var(--text,#1a1a18);
       background:var(--bg,#fff); overflow:hidden; font-size:13px; }
.app { height:100%; display:flex; flex-direction:column; }

<body>
<div class="app">
  <div class="stage">
    <canvas id="c"></canvas>
  </div>
</div>

<script>
(function(){
'use strict';

// ═══ World geometry ═════════════════════════════════════════════════════════
// An n-channel MOSFET cross-section: p-type substrate (majority carrier:
// holes), two n+ diffusions (source/drain, majority carrier: electrons), and
// an insulated gate over the gap between them. Raising Vgs pushes the holes
// that live in the channel strip down into the bulk and pulls electrons in
// from the source/drain to take their place — a real physical migration, not
// just a color fade. Only once that migration reaches critical mass does the
// channel "snap" into a continuous conductive strip (a flash, then a steady
// glow) — and only THEN can current actually flow around the external loop.
const W=760, H=470;
const VMAX=1, TH=0.06;

const BODY = {x:130, y:268, w:500, h:150};                 // p-substrate
// source/drain share the SAME top edge as the substrate and the channel —
// they're all just the silicon surface. A separate, higher top edge for the
// substrate left a sliver of bare p-type material showing above source/drain,
// making the external leads look like they stopped short instead of landing
// directly on the diffusions.
const SOURCE_WIN = {x:160, y:BODY.y, w:130, h:106};         // n+ source
const DRAIN_WIN  = {x:470, y:BODY.y, w:130, h:106};         // n+ drain

const CH_X0 = SOURCE_WIN.x+SOURCE_WIN.w, CH_X1 = DRAIN_WIN.x;
const CHANNEL = {x:CH_X0, y:268, w:CH_X1-CH_X0, h:24};      // shallow surface strip
const GATE_STACK_GAP=2;  // oxide sits right at the silicon surface, just a hairline above it
const OXIDE   = {x:CH_X0-14, y:CHANNEL.y-6-GATE_STACK_GAP, w:(CH_X1-CH_X0)+28, h:6};  // thin insulator
const GATE    = {x:CH_X0-4,  y:OXIDE.y-26,  w:(CH_X1-CH_X0)+8,  h:26}; // sits directly on the oxide

const SOURCE_C = {x:SOURCE_WIN.x+SOURCE_WIN.w/2, y:SOURCE_WIN.y+SOURCE_WIN.h/2};
const DRAIN_C  = {x:DRAIN_WIN.x+DRAIN_WIN.w/2,  y:DRAIN_WIN.y+DRAIN_WIN.h/2};
// the loop path touches each pool near its TOP edge, right where the channel
// mouth and the external lead both actually sit — not the pool's center —
// so current moves in one smooth, consistent direction, no detours.
const SOURCE_TOP={x:SOURCE_C.x, y:SOURCE_WIN.y+14};
const DRAIN_TOP ={x:DRAIN_C.x,  y:DRAIN_WIN.y+14};
const CH_MID_Y = CHANNEL.y+CHANNEL.h/2;
const CH_ENTRANCE={x:CHANNEL.x+CHANNEL.w, y:CH_MID_Y};       // drain-side mouth
const CH_EXIT    ={x:CHANNEL.x,           y:CH_MID_Y};       // source-side mouth

// external drain-source loop: leads straight up off the top of each
// diffusion, over to a small fixed-EMF battery and a lamp — same cast as a
// simple flashlight circuit, with the channel standing in for the mechanical
// switch that circuit doesn't have. The channel IS the only switch here.
const WIRE_Y=58;
const LEAD_SOURCE_X=SOURCE_C.x, LEAD_DRAIN_X=DRAIN_C.x;
const BATTERY={x:255,y:WIRE_Y-16,w:60,h:32};
const BULB={x:460,y:WIRE_Y};

// gate control: a vertical slider — push it up for more voltage, same visual
// language as a level rising, rather than an angle sweeping around a dial.
// Connected by its own short lead that never joins the main loop — the gate
// is DC-isolated from the channel.
const GSLIDER={cx:(CH_X0+CH_X1)/2, y0:200, y1:132, trackW:10, knobW:26, knobH:12};
const GATE_LEAD_TOP={x:GSLIDER.cx, y:GSLIDER.y0+6};

function polySample(pts){ const cum=[0];
  for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  return {pts,cum,total:cum[cum.length-1]}; }
function pointAt(sm,frac){ const target=Math.max(0,Math.min(1,frac))*sm.total;
  let i=1; while(i<sm.cum.length-1 && sm.cum[i]<target) i++;
  const segLen=(sm.cum[i]-sm.cum[i-1])||1, lt=(target-sm.cum[i-1])/segLen;
  const p0=sm.pts[i-1], p1=sm.pts[i];
  return {x:p0[0]+(p1[0]-p0[0])*lt, y:p0[1]+(p1[1]-p0[1])*lt}; }

// the external wire AND the internal channel form one closed loop that a
// fixed population of electrons rides. Every particle advances at the same
// rate, uniform all the way around — but the channel span is off-limits to
// them entirely until the channel is genuinely lit (see litState below).
const LOOP_PTS=[
  [SOURCE_TOP.x,SOURCE_TOP.y],                        //0
  [LEAD_SOURCE_X,WIRE_Y],                              //1 lead, source side
  [BATTERY.x,WIRE_Y],                                  //2 battery –
  [BATTERY.x+BATTERY.w,WIRE_Y],                         //3 battery +
  [LEAD_DRAIN_X,WIRE_Y],                                //4 lead, drain side
  [DRAIN_TOP.x,DRAIN_TOP.y],                            //5 drain pool, near-top contact
  [CH_ENTRANCE.x,CH_ENTRANCE.y],                        //6 channel mouth, drain side
  [CH_EXIT.x,CH_EXIT.y],                                //7 channel mouth, source side
  [SOURCE_TOP.x,SOURCE_TOP.y]                          //8 close loop
];
// the raw path above is a sharp-cornered polyline — fine for drawing the
// wire (which rounds its own corners at render time via arcTo), but
// particles sampled straight off it would visibly snap direction at every
// turn. Round each interior corner into a short curve first, so anything
// gliding along the path takes a gentle bend instead of a pointy vertex.
function quadBezier(t1,curr,t2,segs){ const pts=[];
  for(let k=0;k<=segs;k++){ const s=k/segs, mt=1-s;
    pts.push([mt*mt*t1[0]+2*mt*s*curr[0]+s*s*t2[0], mt*mt*t1[1]+2*mt*s*curr[1]+s*s*t2[1]]); }
  return pts; }
function cornerTangents(prev,curr,next,r){
  const d1=Math.hypot(curr[0]-prev[0],curr[1]-prev[1])||1;
  const d2=Math.hypot(next[0]-curr[0],next[1]-curr[1])||1;
  const rr=Math.min(r,d1*0.45,d2*0.45);
  return {
    t1:[curr[0]+(prev[0]-curr[0])/d1*rr, curr[1]+(prev[1]-curr[1])/d1*rr],
    t2:[curr[0]+(next[0]-curr[0])/d2*rr, curr[1]+(next[1]-curr[1])/d2*rr]
  };
}
function roundPolyline(rawPts,r,segs){
  const n=rawPts.length;
  const dense=[rawPts[0]];
  const vertexIdx=[0]; // dense-array index nearest each original vertex, for landmark lookups
  for(let i=1;i<n-1;i++){
    const {t1,t2}=cornerTangents(rawPts[i-1],rawPts[i],rawPts[i+1],r);
    dense.push(t1);
    const baseLen=dense.length;
    quadBezier(t1,rawPts[i],t2,segs).forEach(p=>dense.push(p));
    vertexIdx.push(baseLen+Math.floor(segs/2));
    dense.push(t2);
  }
  dense.push(rawPts[n-1]);
  vertexIdx.push(dense.length-1);
  return {dense,vertexIdx};
}
const CORNER_R=10, CORNER_SEGS=8;
const {dense:LOOP_DENSE, vertexIdx:LOOP_VIDX}=roundPolyline(LOOP_PTS,CORNER_R,CORNER_SEGS);
const LOOP_S=polySample(LOOP_DENSE);
const IDX_LEAD_SOURCE=1, IDX_LEAD_DRAIN=4, IDX_CH_IN=6, IDX_CH_OUT=7;
const F_LEAD_SOURCE=LOOP_S.cum[LOOP_VIDX[IDX_LEAD_SOURCE]]/LOOP_S.total;
const F_LEAD_DRAIN =LOOP_S.cum[LOOP_VIDX[IDX_LEAD_DRAIN]]/LOOP_S.total;
const F_CH_IN=LOOP_S.cum[LOOP_VIDX[IDX_CH_IN]]/LOOP_S.total;
const F_CH_OUT=LOOP_S.cum[LOOP_VIDX[IDX_CH_OUT]]/LOOP_S.total;
const F_CH_MID=(F_CH_IN+F_CH_OUT)/2;
const K_LOOP=0.42;
const CH_EVAC_RATE=0.9; // how fast (loop-fraction/sec) any loop electron that strays into the
                        // channel span gets swept back out, whenever the channel isn't lit

// channel formation / critical mass
const CH_RAMP_WIDTH=0.3; // once Vgs clears Vth, the field builds up gradually over a
                          // wide span rather than snapping almost instantly — keeps the
                          // slider feeling proportional/controllable across a good chunk
                          // of its travel instead of being a hair-trigger right at Vth.
const CRIT_FILL=0.92, CRIT_FILL_LOW=0.80; // hysteresis band for the flash / lit state
const FLASH_DUR=0.4;
const N_MIGRATE=7;      // electrons that migrate in from each side to form the channel
const N_HOLES_CH=10;    // holes native to the channel strip, that sink away as it forms
const N_HOLES_BODY=28;  // decorative static holes scattered through the bulk p-type body
const HOLE_SINK=28;     // px the channel holes sink once the field is at full strength

function legRamp(u,u0,u1,edgeFrac){
  const lt=(u-u0)/(u1-u0), edge=Math.min(lt,1-lt);
  return Math.max(0,Math.min(1,edge/(edgeFrac||0.15)));
}
function smoothstep(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
function clamp01(v){ return Math.max(0,Math.min(1,v)); }

// ═══ State ══════════════════════════════════════════════════════════════════
const VTH=0.25;
const S={ vgs:0.55, glow:0 };
let channelG=0;        // instant field function of Vgs vs Vth (smoothstep knee)
let chFill=0;           // smoothed channel-formation progress (0=empty p-Si, 1=fully inverted)
let litState=false;    // has the channel actually crossed critical mass and snapped conductive?
let channelLit=0;       // smoothed 0..1 visual for the steady glow band / crossfade
let flashT=0;           // one-shot flash countdown, fired the instant litState flips on
let current=0, t=0;

// ═══ Canvas / DPR ═══════════════════════════════════════════════════════════
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
let scale=1, offx=0, offy=0, dpr=1;
function fit(){ dpr=Math.min(window.devicePixelRatio||1,2);
  const r=cvs.getBoundingClientRect();
  cvs.width=Math.max(1,Math.round(r.width*dpr)); cvs.height=Math.max(1,Math.round(r.height*dpr));
  scale=Math.min(r.width/W,r.height/H); offx=(r.width-W*scale)/2; offy=(r.height-H*scale)/2; }
new ResizeObserver(fit).observe(cvs); window.addEventListener('resize',fit); fit();

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function amberCol(){ return css('--high')||'#f59e0b'; }

// ═══ Particles ══════════════════════════════════════════════════════════════
const LOOP_N=110;
const loopParts=[];
for(let i=0;i<LOOP_N;i++) loopParts.push({
  u:(i+Math.random()*0.6)/LOOP_N, jphase:Math.random()*6.28, jr:0.9+Math.random()*0.9,
  wob:(Math.random()*2-1), wobV:(Math.random()<0.5?-1:1)*(0.5+Math.random()*0.7) });

function mkCloud(n,win){ const a=[]; for(let i=0;i<n;i++) a.push({
  x:win.x+4+Math.random()*(win.w-8), y:win.y+4+Math.random()*(win.h-8),
  vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, migrate:false }); return a; }
const SRC_MAX=64, DRN_MAX=64;
const srcParts=mkCloud(SRC_MAX,SOURCE_WIN), drnParts=mkCloud(DRN_MAX,DRAIN_WIN);
// designate a handful of each pool's electrons as the ones that physically
// migrate into the channel as it forms — the rest just idle in the pool.
for(let i=0;i<N_MIGRATE;i++){
  srcParts[i].migrate=true; srcParts[i].slot=i; srcParts[i].slotJit=(Math.random()*2-1)*3;
  drnParts[i].migrate=true; drnParts[i].slot=i; drnParts[i].slotJit=(Math.random()*2-1)*3;
}

// holes native to the channel strip — recede into the bulk as the field
// inverts the surface, making room for the migrating electrons above.
const CH_PAD=8;
const channelHoles=[]; for(let i=0;i<N_HOLES_CH;i++) channelHoles.push({
  x: CHANNEL.x+CH_PAD + (CHANNEL.w-CH_PAD*2)*(i+0.5)/N_HOLES_CH + (Math.random()*2-1)*4,
  phase: Math.random()*6.28 });

// decorative static holes scattered through the rest of the p-type bulk,
// showing that the substrate itself is hole-majority material — these don't
// react to Vgs, they're just what p-type silicon looks like.
function inAnyRect(x,y,rects){ return rects.some(r=>x>r.x-6&&x<r.x+r.w+6&&y>r.y-6&&y<r.y+r.h+6); }
const bodyHoles=[]; {
  const avoid=[SOURCE_WIN,DRAIN_WIN,CHANNEL,OXIDE];
  let guard=0;
  while(bodyHoles.length<N_HOLES_BODY && guard<4000){
    guard++;
    const x=BODY.x+10+Math.random()*(BODY.w-20), y=BODY.y+16+Math.random()*(BODY.h-26);
    if(inAnyRect(x,y,avoid)) continue;
    bodyHoles.push({x,y,phase:Math.random()*6.28});
  }
}

// ═══ Physics ════════════════════════════════════════════════════════════════
function step(dt){
  // channel conduction is a pure field effect: zero until Vgs clears Vth,
  // then ramps up smoothly. chFill is how far that inversion has actually
  // progressed — it lags channelG, because migrating real charge takes a
  // moment, unlike the field itself which is instantaneous.
  const margin=Math.max(0,Math.min(1,(S.vgs-VTH)/CH_RAMP_WIDTH));
  channelG=margin*margin*(3-2*margin);
  chFill+=(channelG-chFill)*Math.min(1,dt*2.2);

  // once fill crosses critical mass, the channel snaps conductive (a flash,
  // then a steady glow) — with a little hysteresis so it doesn't flicker
  // right at the boundary. THIS is the switch that lets current flow.
  if(!litState && chFill>=CRIT_FILL){ litState=true; flashT=FLASH_DUR; }
  else if(litState && chFill<CRIT_FILL_LOW){ litState=false; }
  channelLit+=((litState?1:0)-channelLit)*Math.min(1,dt*6);
  if(flashT>0) flashT=Math.max(0,flashT-dt);

  const currentTarget=litState?channelG:0;
  current+=(currentTarget-current)*Math.min(1,dt*3);

  const margin2=Math.max(0,current-TH)/(VMAX-TH);
  S.glow+=(margin2-S.glow)*Math.min(1,dt*5);

  loopParts.forEach(pt=>{
    let du=current*K_LOOP*dt;
    // loop electrons never occupy the channel span unless it's genuinely
    // lit — if one strays in (e.g. from initial placement) while the
    // channel is off, it's swept back out to whichever pool is nearer.
    if(pt.u>F_CH_IN && pt.u<F_CH_OUT && !litState){
      du+=(pt.u>=F_CH_MID?1:-1)*CH_EVAC_RATE*dt;
    }
    pt.u=(((pt.u+du)%1)+1)%1;
    const act=pt.u>F_CH_IN&&pt.u<F_CH_OUT ? channelLit : Math.min(1,current*2.2);
    if(act>0.01){
      pt.wob+=pt.wobV*dt*act;
      if(pt.wob>1){ pt.wob=1; pt.wobV=-Math.abs(pt.wobV); }
      else if(pt.wob<-1){ pt.wob=-1; pt.wobV=Math.abs(pt.wobV); }
      pt.wobV+=(Math.random()-0.5)*0.9*dt*act;
      if(Math.abs(pt.wobV)<0.4) pt.wobV+=(pt.wobV<0?-1:1)*0.5*dt*10;
      pt.wobV=Math.max(-1.6,Math.min(1.6,pt.wobV));
    }
  });

  // source: exit toward the channel (+x, right edge). drain: exit toward the
  // wire (-y, top edge). Every ambient electron in the pool runs this same
  // cycle once current is flowing: burst outward in a random direction right
  // after it (re)appears — anti-gravity — then that spray settles and a
  // steady pull takes over, dragging it the rest of the way to the exit edge
  // — gravity. The instant it reaches that edge it's swapped back to a fresh
  // spot near the entry side with a brand new outward burst, so the whole
  // population keeps visibly cycling through for as long as current flows.
  flowPool(srcParts,SOURCE_WIN,'x',+1,dt);
  flowPool(drnParts,DRAIN_WIN,'y',-1,dt);
}
function flowPool(arr,win,axis,sign,dt){
  const pull=current;
  arr.forEach(b=>{
    if(pull>0.04){
      const span=axis==='x'?win.w:win.h;
      const pos =axis==='x'?(b.x-win.x):(b.y-win.y);
      const proj=sign>0 ? pos/span : 1-pos/span;   // 0 at entry side, 1 at exit side
      if(proj>0.86){
        // reached the exit edge: recycle to the entry side with a fresh spray burst
        if(axis==='x'){
          b.x = sign>0 ? win.x+4+Math.random()*(win.w*0.22) : win.x+win.w-4-Math.random()*(win.w*0.22);
          b.y = win.y+4+Math.random()*(win.h-8);
        } else {
          b.y = sign>0 ? win.y+4+Math.random()*(win.h*0.22) : win.y+win.h-4-Math.random()*(win.h*0.22);
          b.x = win.x+4+Math.random()*(win.w-8);
        }
        const ang=Math.random()*6.28, mag=22+Math.random()*16;
        b.vx=Math.cos(ang)*mag; b.vy=Math.sin(ang)*mag;
      } else {
        // spray (anti-gravity) fades, exit-ward pull (gravity) grows, as proj climbs
        const t2=Math.min(1,proj/0.86);
        const speed=Math.max(14,Math.hypot(b.vx,b.vy));
        const tvx=axis==='x'?sign*speed:b.vx*0.4;
        const tvy=axis==='y'?sign*speed:b.vy*0.4;
        const k=Math.min(1,dt*(1.2+2.4*pull)*(0.25+0.75*t2));
        b.vx+=(tvx-b.vx)*k; b.vy+=(tvy-b.vy)*k;
      }
    }
    const agit=Math.min(1.4,current*2.6);
    b.x+=b.vx*(0.4+agit*0.4)*dt; b.y+=b.vy*(0.4+agit*0.4)*dt;
    if(pull<=0.04){
      if(b.x<win.x+3||b.x>win.x+win.w-3) b.vx*=-1;
      if(b.y<win.y+3||b.y>win.y+win.h-3) b.vy*=-1;
    } else if(axis==='x'){
      if(b.y<win.y+3||b.y>win.y+win.h-3) b.vy*=-1;
    } else {
      if(b.x<win.x+3||b.x>win.x+win.w-3) b.vx*=-1;
    }
    b.x=Math.max(win.x+3,Math.min(win.x+win.w-3,b.x));
    b.y=Math.max(win.y+3,Math.min(win.y+win.h-3,b.y));
  });
}

// ═══ Draw helpers ═══════════════════════════════════════════════════════════
function drawElectron(x,y,r,alpha){
  const a=alpha===undefined?1:alpha; if(a<=0) return;
  ctx.save(); ctx.globalAlpha*=a;
  ctx.fillStyle='#f7d525'; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(255,255,235,0.75)'; ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.3,r*0.4,0,6.28); ctx.fill();
  ctx.restore();
}
// a hole: the absence of an electron in the lattice — a small dark void with
// a faint rim, the visual opposite of the bright filled electron dot.
function drawHole(x,y,r,alpha){
  const a=alpha===undefined?1:alpha; if(a<=0) return;
  ctx.save(); ctx.globalAlpha*=a;
  ctx.fillStyle='#1a2126'; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill();
  ctx.strokeStyle='rgba(210,220,230,0.28)'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.stroke();
  ctx.restore();
}

// ── copper wire, stroked-tube style ─────────────────────────────────────────
function tracePath(pts,r){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length-1;i++) ctx.arcTo(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],r);
  const L=pts[pts.length-1]; ctx.lineTo(L[0],L[1]); }
function drawWire(pts){
  const r=10; ctx.lineCap='round'; ctx.lineJoin='round';
  tracePath(pts,r); ctx.lineWidth=13; ctx.strokeStyle='#5a3016'; ctx.stroke();
  tracePath(pts,r); ctx.lineWidth=9;  ctx.strokeStyle='#c97a3d'; ctx.stroke();
  tracePath(pts,r); ctx.lineWidth=3;  ctx.strokeStyle='rgba(255,215,170,0.6)'; ctx.stroke();
}

// ── loop population: wire electrons only (channel-span rendering is a
// separate, more deliberate pass once the channel is actually lit) ─────────
function drawWireLoopElectrons(){
  loopParts.forEach(pt=>{
    if(pt.u<F_LEAD_SOURCE||pt.u>F_LEAD_DRAIN) return;
    const p=pointAt(LOOP_S,pt.u);
    const jx=Math.sin(t*1.2+pt.jphase)*0.7, jy=Math.cos(t*1.0+pt.jphase*1.4)*0.7;
    drawElectron(p.x+jx, p.y+jy, pt.jr);
  });
}
// electrons arriving in a pool don't glide straight through it — the instant
// one crosses in, it kicks outward into a little spray of motion in every
// direction (anti-gravity), then as it nears the far side that spray settles
// back down and the particle coalesces onto the precise exit point (gravity),
// ready to shoot on up the wire / across the channel. Only happens once
// current is actually flowing — before the snap, nothing to spray.
function poolSprayOffset(pt,sprayAmt){
  if(sprayAmt<=0.001) return {dx:0,dy:0};
  const ang=pt.jphase*2.3 + t*1.7 + Math.sin(t*3.1+pt.jphase*4)*1.8;
  const wob=0.55+0.45*Math.sin(t*2.6+pt.jphase*6);
  const r=sprayAmt*(10+8*wob);
  return { dx:Math.cos(ang)*r, dy:Math.sin(ang)*r*0.75 };
}
function drawSourcePoolLoopElectrons(){
  ctx.save(); ctx.beginPath(); ctx.rect(SOURCE_WIN.x,SOURCE_WIN.y,SOURCE_WIN.w,SOURCE_WIN.h); ctx.clip();
  const flow=Math.min(1,current*1.8);
  loopParts.forEach(pt=>{
    if(pt.u<F_LEAD_SOURCE){
      const p=pointAt(LOOP_S,pt.u);
      if(p.x>=SOURCE_WIN.x) drawElectron(p.x, p.y, pt.jr);
    } else if(pt.u>F_CH_OUT){
      const p=pointAt(LOOP_S,pt.u);
      // tt=0 right as it crosses in from the channel, tt=1 as it reaches the
      // top contact and coalesces back onto the wire.
      const tt=Math.min(1,(pt.u-F_CH_OUT)/(1-F_CH_OUT));
      const sprayAmt=Math.pow(1-tt,1.6)*flow;
      const {dx,dy}=poolSprayOffset(pt,sprayAmt);
      drawElectron(p.x+dx, p.y+dy, pt.jr);
    }
  });
  ctx.restore();
}
function drawDrainPoolLoopElectrons(){
  ctx.save(); ctx.beginPath(); ctx.rect(DRAIN_WIN.x,DRAIN_WIN.y,DRAIN_WIN.w,DRAIN_WIN.h); ctx.clip();
  const flow=Math.min(1,current*1.8);
  loopParts.forEach(pt=>{
    if(pt.u>F_LEAD_DRAIN && pt.u<F_CH_IN){
      const p=pointAt(LOOP_S,pt.u);
      if(p.x<=DRAIN_WIN.x+DRAIN_WIN.w){
        // tt=0 right as it drops in from the wire, tt=1 as it reaches the
        // channel mouth and coalesces to shoot across.
        const tt=Math.min(1,Math.max(0,(pt.u-F_LEAD_DRAIN)/(F_CH_IN-F_LEAD_DRAIN)));
        const sprayAmt=Math.pow(1-tt,1.6)*flow;
        const {dx,dy}=poolSprayOffset(pt,sprayAmt);
        drawElectron(p.x+dx, p.y+dy, pt.jr);
      }
    }
  });
  ctx.restore();
}
// current-carrying electrons riding through the channel — only ever present
// once the channel is lit (loopParts are swept out of this span otherwise).
function drawChannelLoopElectrons(){
  const pad=3;
  ctx.save(); ctx.beginPath(); ctx.rect(CHANNEL.x+pad,CHANNEL.y+pad,CHANNEL.w-pad*2,CHANNEL.h-pad*2); ctx.clip();
  loopParts.forEach(pt=>{
    if(pt.u<=F_CH_IN||pt.u>=F_CH_OUT) return;
    const p=pointAt(LOOP_S,pt.u);
    const ramp=legRamp(pt.u,F_CH_IN,F_CH_OUT,0.2);
    drawElectron(p.x, p.y+pt.wob*3*ramp, pt.jr);
  });
  ctx.restore();
}

// ── bulb, glows with actual current ─────────────────────────────────────────
function drawBulb(){
  const tapX=BULB.x, tapY=BULB.y, R=16, glow=S.glow;
  const leadLen=10, sockH=6;
  const socketBottom=tapY-leadLen, cy=socketBottom-sockH-R;
  ctx.strokeStyle='#5a3016'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(tapX,tapY); ctx.lineTo(tapX,socketBottom); ctx.stroke();
  ctx.strokeStyle='#c97a3d'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(tapX,tapY); ctx.lineTo(tapX,socketBottom); ctx.stroke();
  if(glow>0.01){
    const g=ctx.createRadialGradient(tapX,cy,2,tapX,cy,R*2.4);
    g.addColorStop(0,`rgba(255,235,140,${0.55*glow})`);
    g.addColorStop(1,'rgba(255,235,140,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(tapX,cy,R*2.4,0,6.28); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(tapX,cy,R,0,6.28);
  ctx.fillStyle=`rgba(255,${250-40*(1-glow)},${210-90*(1-glow)},0.18)`; ctx.fill();
  ctx.strokeStyle='rgba(160,170,178,0.8)'; ctx.lineWidth=1.6; ctx.stroke();
  ctx.strokeStyle=glow>0.03?`rgba(255,${Math.round(210+30*glow)},${Math.round(90+80*glow)},${0.6+0.4*glow})`:'rgba(120,128,135,0.8)';
  ctx.lineWidth=1.6; ctx.beginPath();
  ctx.moveTo(tapX-6,cy+7); ctx.lineTo(tapX-3,cy-5); ctx.lineTo(tapX,cy+5); ctx.lineTo(tapX+3,cy-5); ctx.lineTo(tapX+6,cy+7);
  ctx.stroke();
  ctx.fillStyle='#8b939a'; ctx.fillRect(tapX-7,socketBottom-sockH,14,sockH);
  ctx.strokeStyle='#5b6369'; ctx.lineWidth=1;
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(tapX-7,socketBottom-sockH+1+i*2); ctx.lineTo(tapX+7,socketBottom-sockH+1+i*2); ctx.stroke(); }
}

// ── small fixed-EMF battery sitting inline in the external loop ────────────
function drawBattery(){
  const {x,y,w,h}=BATTERY;
  ctx.beginPath(); ctx.rect(x,y,w,h);
  const bg=ctx.createLinearGradient(x,0,x+w,0);
  bg.addColorStop(0,'#5f676d'); bg.addColorStop(0.15,'#9aa2a8'); bg.addColorStop(0.5,'#7d858c');
  bg.addColorStop(0.85,'#9aa2a8'); bg.addColorStop(1,'#4d545a');
  ctx.fillStyle=bg; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#454b50'; ctx.beginPath(); ctx.rect(x,y,w,h); ctx.stroke();

  // positive-terminal nub — the little raised button real batteries have on
  // the + end. Positive sits on the source side, negative on the drain side,
  // matching real polarity: electrons leave the – terminal, travel the
  // external loop, and return to the + terminal.
  const nubW=6, nubH=h*0.4;
  ctx.beginPath(); ctx.rect(x-nubW,y+h/2-nubH/2,nubW,nubH);
  const nubG=ctx.createLinearGradient(0,y+h/2-nubH/2,0,y+h/2+nubH/2);
  nubG.addColorStop(0,'#c7ccd0'); nubG.addColorStop(0.5,'#9aa2a8'); nubG.addColorStop(1,'#7d858c');
  ctx.fillStyle=nubG; ctx.fill();
  ctx.lineWidth=1.4; ctx.strokeStyle='#454b50';
  ctx.beginPath(); ctx.rect(x-nubW,y+h/2-nubH/2,nubW,nubH); ctx.stroke();

  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.font='700 13px var(--ui)'; ctx.textAlign='center';
  ctx.fillText('+', x+11, y+h/2+5);
  ctx.fillText('–', x+w-11, y+h/2+5);
  ctx.textAlign='start';
}

// ── substrate (p-type, holes throughout) ────────────────────────────────────
function drawSubstrate(){
  ctx.beginPath(); ctx.rect(BODY.x,BODY.y,BODY.w,BODY.h);
  const bg=ctx.createLinearGradient(0,BODY.y,0,BODY.y+BODY.h);
  bg.addColorStop(0,'#4a5a68'); bg.addColorStop(1,'#333f4a');
  ctx.fillStyle=bg; ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle='#252d34'; ctx.beginPath(); ctx.rect(BODY.x,BODY.y,BODY.w,BODY.h); ctx.stroke();
}
function drawBodyHoles(){
  ctx.save(); ctx.beginPath(); ctx.rect(BODY.x,BODY.y,BODY.w,BODY.h); ctx.clip();
  bodyHoles.forEach(h=>{
    const jx=Math.sin(t*0.3+h.phase)*0.6, jy=Math.cos(t*0.25+h.phase*1.3)*0.6;
    drawHole(h.x+jx, h.y+jy, 2.3, 0.8);
  });
  ctx.restore();
}

// ── source/drain: plain n+ material, not a glass window — electrons simply
// float directly on it, same as holes float directly on the p-type body ───
function regionFill(x0,y0,x1,y1){
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,'#7a5a34'); g.addColorStop(1,'#4f3a22'); return g;
}
function metalFill(x0,y0,x1,y1){
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,'#d8dde1'); g.addColorStop(0.45,'#9aa2a8'); g.addColorStop(1,'#5f676d');
  return g;
}
function drawRegionMaterial(win){
  ctx.beginPath(); ctx.rect(win.x,win.y,win.w,win.h);
  ctx.fillStyle=regionFill(0,win.y,0,win.y+win.h); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#2e2113'; ctx.beginPath(); ctx.rect(win.x,win.y,win.w,win.h); ctx.stroke();
}
function drawPoolElectrons(arr){
  arr.forEach(p=>{ if(!p.migrate) drawElectron(p.x,p.y,1.5); });
}

// oxide + gate: the insulator physically separates the metal gate from the
// silicon — no conduction path exists between them, ever. Only the field
// gets through.
function drawFieldGlow(){
  const v=Math.max(0,Math.min(1,S.vgs))*(1-channelLit*0.6);
  if(v<0.02) return;
  ctx.save(); ctx.beginPath(); ctx.rect(CHANNEL.x-6,CHANNEL.y-2,CHANNEL.w+12,CHANNEL.h+10); ctx.clip();
  const g=ctx.createLinearGradient(0,CHANNEL.y-2,0,CHANNEL.y+CHANNEL.h+8);
  g.addColorStop(0,`rgba(120,200,255,${0.3*v})`); g.addColorStop(1,'rgba(120,200,255,0)');
  ctx.fillStyle=g; ctx.fillRect(CHANNEL.x-6,CHANNEL.y-2,CHANNEL.w+12,CHANNEL.h+10);
  ctx.restore();
}
function drawChannelBase(){
  ctx.beginPath(); ctx.rect(CHANNEL.x,CHANNEL.y,CHANNEL.w,CHANNEL.h);
  ctx.fillStyle='#3a4652'; ctx.fill();
  ctx.lineWidth=1.4; ctx.strokeStyle='rgba(15,20,24,0.55)'; ctx.beginPath(); ctx.rect(CHANNEL.x,CHANNEL.y,CHANNEL.w,CHANNEL.h); ctx.stroke();
}
function drawChannelHoles(){
  ctx.save(); ctx.beginPath(); ctx.rect(CHANNEL.x,CHANNEL.y-2,CHANNEL.w,CHANNEL.h+HOLE_SINK+6); ctx.clip();
  const alpha=Math.max(0,1-chFill*1.15);
  if(alpha>0.01) channelHoles.forEach(h=>{
    const jy=Math.sin(t*0.8+h.phase)*1.2;
    drawHole(h.x, CH_MID_Y+HOLE_SINK*chFill+jy, 2.1, alpha);
  });
  ctx.restore();
}
// electrons physically migrating in from the source/drain side to form the
// channel — visible while forming, fading into the glow band once it snaps lit.
function drawMigratingElectrons(){
  const mp=smoothstep(chFill);
  const a=mp*(1-channelLit);
  if(a<=0.01) return;
  const pad=CH_PAD;
  const drawSide=(arr,fromRight)=>{
    arr.forEach(p=>{
      if(!p.migrate) return;
      const half=(CHANNEL.w-pad*2)/2;
      const slotX = fromRight
        ? CHANNEL.x+pad+half + half*(p.slot+0.5)/N_MIGRATE
        : CHANNEL.x+pad      + half*(p.slot+0.5)/N_MIGRATE;
      const slotY = CH_MID_Y + p.slotJit;
      const e=smoothstep(mp);
      const x=p.x+(slotX-p.x)*e, y=p.y+(slotY-p.y)*e;
      drawElectron(x,y,1.6,a);
    });
  };
  drawSide(srcParts,false);
  drawSide(drnParts,true);
}
// the channel once it's actually formed: a continuous glowing yellow band,
// plus a brief brighter flash the instant it snaps conductive.
function drawChannelGlow(){
  if(channelLit>0.01){
    ctx.save(); ctx.beginPath(); ctx.rect(CHANNEL.x,CHANNEL.y,CHANNEL.w,CHANNEL.h); ctx.clip();
    const g=ctx.createLinearGradient(0,CHANNEL.y,0,CHANNEL.y+CHANNEL.h);
    g.addColorStop(0,`rgba(255,225,120,0)`);
    g.addColorStop(0.5,`rgba(255,210,80,${0.85*channelLit})`);
    g.addColorStop(1,`rgba(255,225,120,0)`);
    ctx.fillStyle=g; ctx.fillRect(CHANNEL.x,CHANNEL.y,CHANNEL.w,CHANNEL.h);
    const glow=ctx.createRadialGradient(CHANNEL.x+CHANNEL.w/2,CH_MID_Y,2,CHANNEL.x+CHANNEL.w/2,CH_MID_Y,CHANNEL.w*0.6);
    glow.addColorStop(0,`rgba(255,210,80,${0.35*channelLit})`); glow.addColorStop(1,'rgba(255,210,80,0)');
    ctx.fillStyle=glow; ctx.fillRect(CHANNEL.x-20,CHANNEL.y-20,CHANNEL.w+40,CHANNEL.h+40);
    ctx.restore();
  }
  if(flashT>0){
    const a=(flashT/FLASH_DUR);
    ctx.save(); ctx.beginPath(); ctx.rect(CHANNEL.x-4,CHANNEL.y-4,CHANNEL.w+8,CHANNEL.h+8); ctx.clip();
    ctx.fillStyle=`rgba(255,250,225,${0.85*a})`;
    ctx.fillRect(CHANNEL.x-4,CHANNEL.y-4,CHANNEL.w+8,CHANNEL.h+8);
    ctx.restore();
  }
}
function drawOxideAndGate(){
  ctx.beginPath(); ctx.rect(OXIDE.x,OXIDE.y,OXIDE.w,OXIDE.h);
  ctx.fillStyle='#e8e2cf'; ctx.fill();
  ctx.lineWidth=1.2; ctx.strokeStyle='#b8b19a'; ctx.beginPath(); ctx.rect(OXIDE.x,OXIDE.y,OXIDE.w,OXIDE.h); ctx.stroke();

  ctx.beginPath(); ctx.rect(GATE.x,GATE.y,GATE.w,GATE.h);
  const gg=ctx.createLinearGradient(0,GATE.y,0,GATE.y+GATE.h);
  gg.addColorStop(0,'#aab2b8'); gg.addColorStop(1,'#7d858c');
  ctx.fillStyle=gg; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#565d63'; ctx.beginPath(); ctx.rect(GATE.x,GATE.y,GATE.w,GATE.h); ctx.stroke();

  // gate lead: deliberately thin and isolated, stops short of the main loop.
  ctx.strokeStyle='#8b939a'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(GSLIDER.cx,GATE.y); ctx.lineTo(GSLIDER.cx,GATE_LEAD_TOP.y); ctx.stroke();
}

// ── gate-voltage slider: a small metal-housed slide control — push the
// chrome carriage up for more voltage, a rising fill reads as "more" far
// more directly than an angle sweeping around a dial ───────────────────────
function drawVgsSlider(hot){
  const {cx,y0,y1,trackW,knobW,knobH}=GSLIDER;
  const yV=y0+(y1-y0)*S.vgs, yTh=y0+(y1-y0)*VTH;
  const trackH=y0-y1;
  const bez=5; // metal housing margin around the machined slot

  // metal housing behind the slot
  ctx.beginPath(); ctx.rect(cx-trackW/2-bez,y1-bez,trackW+bez*2,trackH+bez*2);
  ctx.fillStyle=metalFill(cx-trackW/2-bez,0,cx+trackW/2+bez,0); ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle='#454b50';
  ctx.beginPath(); ctx.rect(cx-trackW/2-bez,y1-bez,trackW+bez*2,trackH+bez*2); ctx.stroke();
  // a thin sheen along the housing's edge, like light catching brushed metal
  ctx.save(); ctx.beginPath(); ctx.rect(cx-trackW/2-bez,y1-bez,trackW+bez*2,trackH+bez*2); ctx.clip();
  const sheen=ctx.createLinearGradient(cx-trackW/2-bez,0,cx+trackW/2+bez,0);
  sheen.addColorStop(0,'rgba(255,255,255,0.4)'); sheen.addColorStop(0.5,'rgba(255,255,255,0.05)'); sheen.addColorStop(1,'rgba(255,255,255,0.32)');
  ctx.fillStyle=sheen; ctx.fillRect(cx-trackW/2-bez,y1-bez,trackW+bez*2,3);
  ctx.restore();

  // recessed slot machined into the housing
  ctx.beginPath(); ctx.rect(cx-trackW/2,y1,trackW,trackH);
  ctx.fillStyle='#181d21'; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(cx-trackW/2,y1,trackW,trackH); ctx.clip();
  const inset=ctx.createLinearGradient(cx-trackW/2,0,cx+trackW/2,0);
  inset.addColorStop(0,'rgba(0,0,0,0.55)'); inset.addColorStop(0.5,'rgba(0,0,0,0.12)'); inset.addColorStop(1,'rgba(255,255,255,0.1)');
  ctx.fillStyle=inset; ctx.fillRect(cx-trackW/2,y1,trackW,trackH);
  // amber fill rising from the bottom — the higher it climbs, the more voltage
  ctx.fillStyle=amberCol(); ctx.globalAlpha=0.6;
  ctx.fillRect(cx-trackW/2,yV,trackW,y0-yV);
  ctx.globalAlpha=1;
  ctx.restore();

  // threshold tick
  ctx.strokeStyle='#e8e2cf'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx-trackW/2-bez-3,yTh); ctx.lineTo(cx+trackW/2+bez+3,yTh); ctx.stroke();

  // scale ticks
  ctx.strokeStyle='rgba(69,75,80,0.7)'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const yy=y0+(y1-y0)*i/4;
    ctx.beginPath(); ctx.moveTo(cx-trackW/2-bez-2,yy); ctx.lineTo(cx+trackW/2+bez+2,yy); ctx.stroke(); }

  // carriage: a chrome slider block riding the slot, with a soft contact
  // shadow and a couple of grip grooves
  ctx.beginPath(); ctx.ellipse(cx,yV+knobH*0.5+2,knobW*0.55,2.6,0,0,6.28);
  ctx.fillStyle='rgba(20,20,18,0.28)'; ctx.fill();
  ctx.beginPath(); ctx.rect(cx-knobW/2,yV-knobH/2,knobW,knobH);
  ctx.fillStyle=metalFill(cx-knobW/2,0,cx+knobW/2,0); ctx.fill();
  ctx.lineWidth=1.4; ctx.strokeStyle=hot?amberCol():'#454b50';
  ctx.beginPath(); ctx.rect(cx-knobW/2,yV-knobH/2,knobW,knobH); ctx.stroke();
  ctx.strokeStyle=hot?amberCol():'rgba(69,75,80,0.65)'; ctx.lineWidth=1;
  for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(cx-knobW/2+4,yV+i*3); ctx.lineTo(cx+knobW/2-4,yV+i*3); ctx.stroke(); }
}

// ═══ Frame ══════════════════════════════════════════════════════════════════
let hoverSlider=false;
function frameDraw(){
  const r=cvs.getBoundingClientRect();
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,offx*dpr,offy*dpr);

  // external loop wire
  drawWire([[LEAD_SOURCE_X,SOURCE_TOP.y],[LEAD_SOURCE_X,WIRE_Y],[BATTERY.x,WIRE_Y]]);
  drawWire([[BATTERY.x+BATTERY.w,WIRE_Y],[LEAD_DRAIN_X,WIRE_Y],[LEAD_DRAIN_X,DRAIN_TOP.y]]);
  drawWireLoopElectrons();

  drawSubstrate();
  drawBodyHoles();
  drawRegionMaterial(SOURCE_WIN); drawRegionMaterial(DRAIN_WIN);
  drawChannelBase();
  drawFieldGlow();

  drawChannelHoles();
  drawPoolElectrons(srcParts); drawSourcePoolLoopElectrons();
  drawPoolElectrons(drnParts); drawDrainPoolLoopElectrons();
  drawMigratingElectrons();
  drawChannelLoopElectrons();
  drawChannelGlow();

  drawOxideAndGate();

  drawBattery();
  drawBulb();
  drawVgsSlider(hoverSlider);
}
let last=performance.now();
function tick(now){ let dt=(now-last)/1000; last=now; dt=Math.max(0,Math.min(dt,0.05)); step(dt); t+=dt; frameDraw(); }
function loop(now){ tick(now); requestAnimationFrame(loop); }
tick(performance.now()); requestAnimationFrame(loop);
setInterval(()=>{ if(document.hidden) tick(performance.now()); }, 120);
try{ if(location.hash==='#dev'){
  window.__tick=tick; window.__S=S;
  window.__dev={
    get loopParts(){ return loopParts; },
    get F_CH_IN(){ return F_CH_IN; }, get F_CH_OUT(){ return F_CH_OUT; },
    get chFill(){ return chFill; }, get channelG(){ return channelG; }, get current(){ return current; },
    get litState(){ return litState; }, get channelLit(){ return channelLit; }, get flashT(){ return flashT; },
    get srcParts(){ return srcParts; }, get drnParts(){ return drnParts; }, get channelHoles(){ return channelHoles; },
    pointAtFrac(u){ return pointAt(LOOP_S,u); }
  };
} }catch(e){}

// ═══ Interaction ════════════════════════════════════════════════════════════
function toWorld(e){ const r=cvs.getBoundingClientRect();
  return { x:(e.clientX-r.left-offx)/scale, y:(e.clientY-r.top-offy)/scale }; }
function onSlider(p){
  const {cx,y0,y1,knobW,knobH}=GSLIDER;
  return p.x>cx-knobW/2-6 && p.x<cx+knobW/2+6 && p.y>y1-knobH/2-6 && p.y<y0+knobH/2+6;
}
function setVgs(p){
  const {y0,y1}=GSLIDER;
  const frac=(y0-p.y)/(y0-y1);
  S.vgs=Math.max(0,Math.min(1,frac));
}
let drag=null;
cvs.addEventListener('pointermove',e=>{ const p=toWorld(e);
  if(drag==='slider'){ setVgs(p); }
  else { hoverSlider=onSlider(p);
    cvs.style.cursor=hoverSlider?'grab':'default'; }
});
cvs.addEventListener('pointerdown',e=>{ const p=toWorld(e); cvs.setPointerCapture(e.pointerId);
  if(onSlider(p)){ drag='slider'; setVgs(p); }
});
window.addEventListener('pointerup',()=>{ drag=null; });

// ═══ Reset / Beamer+ integration ════════════════════════════════════════════
function doReset(all){ if(all!==false){ S.vgs=0.55; }
  S.glow=0; chFill=0; litState=false; channelLit=0; flashT=0; current=0;
  loopParts.forEach((pt,i)=>{ pt.u=(i+Math.random()*0.6)/LOOP_N; });
}
function applyConfig(cfg){ if(!cfg) return;
  if(typeof cfg.vgs==='number') S.vgs=cfg.vgs;
  doReset(false);
}
applyConfig(window.WIDGET_CONFIG);
window.addEventListener('message',e=>{ const d=e.data; if(!d) return;
  const wid=(window.WIDGET_CONFIG&&window.WIDGET_CONFIG.id)||'mosfet-widget';
  if(d.type==='widget-config') applyConfig(d.config);
  else if(d.type==='widget-get-state')
    window.parent.postMessage({type:'widget-state',widgetId:wid,state:{vgs:S.vgs}},'*');
  else if(d.type==='widget-set-state'&&d.state){ const s=d.state;
    if(typeof s.vgs==='number')S.vgs=s.vgs;
  }
});
})();
</script>
</body>
</html>
