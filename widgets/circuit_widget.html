<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Circuit Simulator — Beamer+</title>
<script id="widget-schema" type="application/json">
{
  "label": "Circuit Simulator",
  "category": "Engineering",
  "fields": [
    { "key": "circuit", "label": "Starting circuit", "type": "textarea", "rows": 4,
      "placeholder": "{\"components\":[…],\"wires\":[…]}",
      "note": "paste an exported circuit" },
    { "key": "parts",   "label": "Palette parts", "type": "textarea", "rows": 4,
      "placeholder": "[{\"name\":\"Majority\",\"equation\":\"Y = A B + B C + A C\"}]",
      "note": "this deck only" },
    { "key": "hop",     "label": "Seconds per hop", "type": "select", "default": 1,
      "options": [ {"v": 0.25, "l": "¼s"}, {"v": 0.5, "l": "½s"}, {"v": 1, "l": "1s"}, {"v": 2, "l": "2s"} ] },
    { "key": "running", "label": "Start running", "type": "checkbox", "default": true }
  ]
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #ffffff;
  --panel:     #fbfbfa;
  --panel-2:   #f4f4f2;
  --panel-3:   #ecebe8;
  --border:    #e7e7e3;
  --border-md: #d5d4ce;
  --border-hi: #b9b8b0;
  --ink:       #1a1a18;
  --ink-2:     #64645e;
  --ink-3:     #a3a39a;
  --grid:      #e6e6e1;
  --grid-major:#dbdad3;
  --high:      #f59e0b;
  --high-2:    #d97706;
  --high-soft: #fef3c7;
  --low:       #cfcec9;
  --low-p:     #8a897f;
  /* Selection, focus and the wire-in-progress all share one accent. It's a
     warm graphite rather than a colour, so the only real hue on the board is
     the amber of a HIGH signal — the thing actually worth looking at. */
  --accent:      #55554d;
  --accent-2:    #35352f;
  --accent-soft: #e6e5e0;
  --danger:      #dc2626;
  --danger-soft: #fef2f2;
  --ok:          #4b7a5e;
  --shadow-xs:   0 1px 2px rgba(26,26,24,.06);
  --shadow:      0 1px 0 rgba(26,26,24,.04), 0 6px 20px -8px rgba(26,26,24,.16);
  --shadow-lg:   0 2px 4px rgba(26,26,24,.05), 0 18px 44px -14px rgba(26,26,24,.26);
  --r-sm:      4px;
  --r:         6px;
  --r-lg:      10px;
  --r-xl:      14px;
  --mono:      'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --ui:        'DM Sans',system-ui,-apple-system,sans-serif;
  --h-top:     46px;
}
*,*::before,*::after { box-sizing: border-box; }
html,body,#root { height:100%; margin:0; }
body {
  font-family:var(--ui); color:var(--ink); background:var(--panel); overflow:hidden; font-size:13px;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none; -moz-user-select:none; user-select:none;
}
input, textarea { -webkit-user-select:text; -moz-user-select:text; user-select:text; }
button { font-family:inherit; }

.app  { height:100%; display:flex; flex-direction:column; background:var(--panel); }
.main { flex:1; display:flex; min-height:0; }

/* ───────────────────────── top bar ───────────────────────── */
.topbar {
  height:var(--h-top); flex:0 0 auto;
  display:flex; align-items:center; gap:10px; padding:0 10px;
  background:var(--panel);
  border-bottom:1px solid var(--border-md);
  position:relative; z-index:30;
}
.tb-sep { width:1px; height:22px; background:var(--border); flex:0 0 auto; }
.tb-group { display:flex; align-items:center; gap:3px; }
.tb-spacer { flex:1; }

.tb-btn {
  height:28px; min-width:28px; padding:0 7px; border-radius:var(--r);
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  background:transparent; border:1px solid transparent; color:var(--ink-2);
  cursor:pointer; font-size:12px; font-weight:500;
  transition:background .12s, color .12s, border-color .12s, box-shadow .12s;
}
.tb-btn:hover:not(:disabled) { background:var(--panel-2); color:var(--ink); border-color:var(--border); }
.tb-btn:active:not(:disabled) { background:var(--panel-3); }
.tb-btn:disabled { opacity:.32; cursor:default; }
.tb-btn.on { background:var(--accent-soft); border-color:var(--border-md); color:var(--accent-2); }
.tb-btn.danger:hover:not(:disabled) { background:var(--danger-soft); border-color:#fecaca; color:var(--danger); }
.tb-btn svg { display:block; flex:0 0 auto; }

.seg { display:flex; background:var(--panel-2); border:1px solid var(--border); border-radius:var(--r); padding:2px; gap:2px; }
.seg-btn {
  height:22px; padding:0 8px; border:none; background:transparent; border-radius:var(--r-sm);
  font-family:var(--mono); font-size:10.5px; color:var(--ink-2); cursor:pointer;
  transition:background .12s, color .12s, box-shadow .12s;
}
.seg-btn:hover { color:var(--ink); }
.seg-btn.on { background:var(--bg); color:var(--ink); box-shadow:var(--shadow-xs); font-weight:600; }

.zoom-val { font-family:var(--mono); font-size:11px; color:var(--ink-2); min-width:42px; text-align:center; }

/* ───────────────────────── palette ───────────────────────── */
.palette {
  width:196px; flex:0 0 auto; background:var(--panel);
  border-right:1px solid var(--border-md);
  display:flex; flex-direction:column; min-height:0;
}
.pal-search { padding:9px 9px 6px; position:relative; flex:0 0 auto; }
.pal-search input {
  width:100%; height:27px; padding:0 8px 0 26px; font:inherit; font-size:12px;
  border:1px solid var(--border); border-radius:var(--r); background:var(--bg);
  color:var(--ink); outline:none; transition:border-color .12s, box-shadow .12s;
}
.pal-search input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.pal-search svg { position:absolute; left:17px; top:16px; color:var(--ink-3); pointer-events:none; }
.pal-scroll { flex:1; overflow-y:auto; padding:2px 9px 18px; scrollbar-width:thin; scrollbar-color:var(--border-md) transparent; }
.pal-scroll::-webkit-scrollbar { width:5px; }
.pal-scroll::-webkit-scrollbar-thumb { background:var(--border-md); border-radius:4px; }
.pal-group { margin-top:12px; }
.pal-group:first-child { margin-top:4px; }
.pal-group-head {
  width:100%; display:flex; align-items:center; gap:5px; padding:3px 2px 6px;
  background:none; border:none; cursor:pointer; color:var(--ink-3);
  font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
}
.pal-group-head:hover { color:var(--ink-2); }
.pal-group-head .chev { transition:transform .15s; }
.pal-group-head.closed .chev { transform:rotate(-90deg); }
.pal-group-count { font-family:var(--mono); font-weight:500; letter-spacing:0; opacity:.75; margin-left:auto; }
.pal-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.pal-item {
  position:relative; background:var(--bg); border:1px solid var(--border); border-radius:var(--r);
  padding:6px 3px 4px; display:flex; flex-direction:column; align-items:center; gap:2px;
  cursor:grab; font:inherit; color:inherit;
  transition:background .1s, border-color .1s, transform .1s, box-shadow .1s;
}
.pal-item:hover { background:#fff; border-color:var(--border-hi); transform:translateY(-1px); box-shadow:var(--shadow); }
.pal-item:active { cursor:grabbing; transform:none; box-shadow:none; }
.pal-label { font-size:9.5px; font-family:var(--mono); color:var(--ink-2); letter-spacing:-.01em; }
.pal-empty { font-size:11px; color:var(--ink-3); padding:4px 2px 2px; }
.pal-del-btn {
  position:absolute; top:-5px; right:-5px; z-index:1;
  width:15px; height:15px; border-radius:50%; padding:0;
  background:var(--bg); border:1px solid var(--border-md); color:var(--ink-2);
  display:flex; align-items:center; justify-content:center; cursor:pointer; line-height:1;
  opacity:0; transition:opacity .12s, background .1s, border-color .1s, color .1s;
}
.pal-item:hover .pal-del-btn { opacity:1; }
.pal-del-btn:hover { background:var(--danger); border-color:var(--danger); color:#fff; }
.pal-del-btn svg { display:block; pointer-events:none; }

/* ───────────────────────── canvas ───────────────────────── */
.canvas-wrap { flex:1; position:relative; min-width:0; background:var(--bg); }
.canvas-wrap::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(26,26,24,.05), inset 0 0 60px rgba(26,26,24,.02);
}
.canvas { display:block; }
.wiring-badge {
  position:absolute; left:50%; transform:translateX(-50%); top:10px; z-index:22;
  display:flex; align-items:center; gap:8px; pointer-events:none;
  background:rgba(26,26,24,.9); color:#fff; padding:5px 11px; border-radius:999px;
  font-size:11.5px; font-weight:500; box-shadow:var(--shadow-lg);
}
.wiring-badge kbd {
  font-family:var(--mono); font-size:9.5px; background:rgba(255,255,255,.16);
  padding:1px 4px; border-radius:3px; border:1px solid rgba(255,255,255,.18);
}
/* With no status bar to narrate into, a refused connection says its piece
   right where the eye is — over the board, then fades out. */
.wiring-badge.warn { background:var(--danger); top:46px; animation:toastIn .14s ease-out; }
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(-5px); } }
.empty-hint {
  position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
}
.empty-card {
  text-align:center; color:var(--ink-3); max-width:280px;
}
.empty-card h3 { margin:0 0 4px; font-size:13.5px; font-weight:600; color:var(--ink-2); }
.empty-card p  { margin:0; font-size:11.5px; line-height:1.5; }

/* ───────────────────── selection card ─────────────────────
   Properties live on a small card that hangs off whatever is selected,
   rather than a permanent side panel: the settings appear where the eye
   already is, and the board gets the whole window when nothing's selected.
   Every part has at most one thing worth editing, so the card is always a
   single row — a label field, or a rate slider. */
.sel-card {
  position:absolute; z-index:21; transform:translateX(-50%);
  display:flex; align-items:center; gap:7px; padding:7px 8px;
  background:var(--bg); border:1px solid var(--border-md); border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg); font-size:11.5px;
  animation:cardIn .12s ease-out;
}
@keyframes cardIn { from { opacity:0; transform:translateX(-50%) translateY(-4px); } }
.sel-card::before {
  content:''; position:absolute; top:-5px; left:50%; margin-left:-5px;
  width:9px; height:9px; background:var(--bg);
  border-left:1px solid var(--border-md); border-top:1px solid var(--border-md);
  transform:rotate(45deg);
}
.sel-close {
  width:19px; height:19px; border-radius:5px; padding:0; flex:0 0 auto;
  display:grid; place-items:center; background:transparent; border:1px solid transparent;
  color:var(--ink-3); cursor:pointer; transition:background .1s, color .1s, border-color .1s;
}
.sel-close:hover { background:var(--panel-2); border-color:var(--border); color:var(--ink); }
.sel-key {
  font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); flex:0 0 auto;
}
.sel-note { font-size:10.5px; color:var(--ink-3); line-height:1.4; margin:8px 0 0; }
.prop-input {
  width:118px; height:26px; padding:0 8px; border-radius:var(--r); border:1px solid var(--border);
  font:inherit; font-size:12px; background:var(--bg); color:var(--ink); outline:none;
  transition:border-color .12s, box-shadow .12s;
}
.prop-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.mini-btn {
  height:24px; padding:0 8px; border:1px solid var(--border); background:var(--bg);
  border-radius:var(--r-sm); color:var(--ink-2); cursor:pointer; font-size:11px;
  display:inline-flex; align-items:center; gap:5px;
  transition:background .12s, border-color .12s, color .12s;
}
.mini-btn:hover { background:var(--panel-2); border-color:var(--border-hi); color:var(--ink); }
.mini-btn.warn:hover { background:var(--danger-soft); border-color:#fecaca; color:var(--danger); }
.hint-list { margin:0; padding:0; list-style:none; }
.hint-list li { display:flex; align-items:baseline; gap:8px; padding:4px 0; font-size:12px; color:var(--ink-2); line-height:1.45; }
.hint-cols { display:grid; grid-template-columns:1fr 1fr; gap:0 22px; }
kbd.key {
  font-family:var(--mono); font-size:9.5px; font-weight:500; color:var(--ink);
  background:linear-gradient(#fff,#f2f2ef); border:1px solid var(--border-md);
  border-bottom-width:2px; border-radius:4px; padding:1px 4px; flex:0 0 auto;
  min-width:16px; text-align:center; white-space:nowrap;
}
.st-mono { font-family:var(--mono); font-size:10.5px; color:var(--ink-2); white-space:nowrap; }
.tb-clock {
  font-family:var(--mono); font-size:10.5px; color:var(--ink-2);
  background:var(--panel-2); border:1px solid var(--border); border-radius:var(--r);
  height:26px; padding:0 9px; display:inline-flex; align-items:center; gap:6px;
  cursor:pointer; transition:background .12s, border-color .12s, color .12s;
}
.tb-clock:hover { background:var(--bg); border-color:var(--border-hi); color:var(--ink); }
.tb-clock.paused { background:var(--high-soft); border-color:#f3d590; color:#7c4a03; }
.tb-clock b { font-weight:500; color:inherit; font-variant-numeric:tabular-nums; }
/* Neutral while it ticks, amber when it's stopped — so amber always means
   "something is happening here", on the board and in the chrome alike. */
.tb-clock i { width:5px; height:5px; border-radius:50%; background:var(--ink-3); flex:0 0 auto; }
.tb-clock.paused i { background:var(--high); }

/* ───────────────────────── modal ───────────────────────── */
.modal-bg { position:fixed; inset:0; background:rgba(26,26,24,.34); backdrop-filter:blur(3px); display:grid; place-items:center; z-index:100; }
.modal { background:var(--bg); border-radius:var(--r-xl); padding:18px 20px 20px; width:420px; max-width:calc(100vw - 32px); box-shadow:var(--shadow-lg); border:1px solid var(--border-md); }
.modal-title { font-size:15px; font-weight:600; margin-bottom:3px; }
.modal-sub { font-size:11.5px; color:var(--ink-2); margin-bottom:14px; }
.dialog-section-title { font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin:14px 0 6px; }
.dialog-section-title:first-of-type { margin-top:0; }
.file-btn { display:inline-flex; align-items:center; justify-content:center; width:100%; margin-top:8px; }
.import-error { font-size:11.5px; color:var(--danger); margin-top:9px; white-space:pre-line; background:var(--danger-soft); border:1px solid #fecaca; border-radius:var(--r); padding:7px 9px; }
.text-input { width:100%; padding:8px 10px; border-radius:var(--r); border:1px solid var(--border); font:inherit; font-size:13px; background:var(--bg); color:var(--ink); outline:none; transition:border-color .12s, box-shadow .12s; }
.text-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.json-input { font-family:var(--mono); font-size:12px; resize:vertical; }
.dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.btn { font-family:var(--ui); font-size:12.5px; font-weight:500; height:30px; padding:0 13px; border-radius:var(--r); border:1px solid var(--border-md); cursor:pointer; transition:background .12s, border-color .12s, color .12s; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.btn.ghost   { background:var(--bg); color:var(--ink); }
.btn.ghost:hover:not(:disabled) { background:var(--panel-2); border-color:var(--border-hi); }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.primary:hover:not(:disabled) { background:var(--accent-2); border-color:var(--accent-2); }
.btn.subtle  { background:var(--bg); color:var(--ink-2); flex:1; }
.btn.subtle:hover { background:var(--panel-2); color:var(--ink); border-color:var(--border-hi); }
.btn.warn    { background:var(--bg); color:var(--danger); border-color:#fecaca; flex:1; }
.btn.warn:hover { background:var(--danger-soft); border-color:var(--danger); }

.import-choices { display:flex; flex-direction:column; gap:8px; }
.import-choice {
  text-align:left; background:var(--bg); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:12px 14px; cursor:pointer; font:inherit; color:inherit;
  transition:background .12s, border-color .12s, transform .12s, box-shadow .12s;
}
.import-choice:hover { background:var(--panel); border-color:var(--border-hi); transform:translateY(-1px); box-shadow:var(--shadow); }
.import-choice-title { font-weight:600; font-size:13px; }
.import-choice-sub { font-size:11.5px; color:var(--ink-2); margin-top:2px; }

/* ───────────────────────── narrow layouts ─────────────────────────
   Widgets get embedded at all sorts of sizes, so the chrome sheds its
   least essential parts before anything starts overlapping. */
@media (max-width: 1080px) {
  .tb-clock { display:none; }
}
@media (max-width: 920px) {
  .brand > div { display:none; }
  .tb-btn.play span, .tb-btn.play { font-size:0; padding:0 9px; }
  .tb-btn.play svg { margin:0; }
  .palette { width:168px; }
}
@media (max-width: 760px) {
  .palette { width:150px; }
  .pal-grid { grid-template-columns:1fr; }
}

/* ───────────────────────── canvas handles ───────────────────────── */
.rotate-handle circle { fill:var(--bg); stroke:var(--border-hi); transition:fill .1s, stroke .1s; }
.rotate-handle:hover circle { fill:var(--ink); stroke:var(--ink); }
.rotate-handle path { stroke:var(--ink-2); transition:stroke .1s; }
.rotate-handle:hover path { stroke:#fff; }
.kill-handle circle { fill:var(--bg); stroke:var(--border-hi); transition:fill .1s, stroke .1s; }
.kill-handle:hover circle { fill:var(--danger); stroke:var(--danger); }
.kill-handle path { stroke:var(--ink-2); transition:stroke .1s; }
.kill-handle:hover path { stroke:#fff; }
</style>

<script>
/* ═══ MESSAGE BUFFER ════════════════════════════════════════════════════════
   Beamer+ posts widget-config and widget-set-state the instant the iframe
   fires `load`. This widget renders through ReactDOM.createRoot(), which
   commits asynchronously — so at that moment the app's own message listener
   usually doesn't exist yet, and a saved circuit would be dropped on the
   floor. Worse, the now-empty board is what the *next* save reports back,
   quietly overwriting the good state in the deck.

   So this tiny listener is registered during parse, long before React, and
   parks any protocol message it sees. App drains the queue on mount, in
   order, and then takes over. Nothing else in the widget depends on it, so
   there's no load-order requirement beyond "before the app". */
(function () {
  var KINDS = { 'widget-config':1, 'widget-set-state':1, 'widget-get-state':1 };
  window.__widgetInbox = [];
  window.__widgetAppReady = false;
  window.addEventListener('message', function (e) {
    if (!e.data || !KINDS[e.data.type]) return;
    if (window.__widgetAppReady) return;   // the app is listening for itself now
    window.__widgetInbox.push(e.data);
  });
})();
</script>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script>
/* ═══ MODULES ═══════════════════════════════════════════════════════════════
   Minimal in-browser module registry. Each section calls
   defineModule(name, deps, factory) exactly once; deps are resolved eagerly
   against modules that already registered, so a missing/out-of-order
   <script> tag fails loudly instead of silently handing back `undefined`. */
window.Modules = {};
window.defineModule = function defineModule(name, deps, factory) {
  const resolved = deps.map(dep => {
    if (!(dep in window.Modules)) {
      throw new Error(`module "${name}" depends on "${dep}", which hasn't loaded yet`);
    }
    return window.Modules[dep];
  });
  window.Modules[name] = factory(...resolved);
};
</script>

<script>
/* ═══ STATE ════════════════════════════════════════════════════════════════
   Central cross-section state. `now` is *simulation* time, not wall time:
   the App's rAF loop only advances it while the sim is running, so pausing
   freezes propagation, clocks and every wire animation together instead of
   letting the visuals drift out of step with the logic. */
defineModule('state', [], () => {
  const widgetState = {
    hopMs: 1000,          // fixed propagation time for one gate-to-gate hop
    particleDensity: 3,
    running: true,
    now: 0,               // simulation clock (ms)
    circuit: null,
  };
  return { widgetState };
});
</script>

<script>
/* ═══ ENGINE ═══════════════════════════════════════════════════════════════

   TIMING MODEL — "one hop, one delay"
   ───────────────────────────────────
   A signal's travel time depends only on how many gate-to-gate hops it
   takes, never on how the wires happen to be drawn. The unit of delay is
   the *net*: one driving output pin plus every wire and branch fed from it.
   Whatever shape that tree has — one straight wire, five branches, a
   detour around the canvas — every sink on it sees the new value exactly
   `hopMs` after the value left the driving pin.

       S ── G1 ── O           2 nets  → 2 × hopMs
       S ── G1 ── G2 ── O     3 nets  → 3 × hopMs
       S ── G1 ── G2 ── G3 ── O  4 nets → 4 × hopMs

   Every timestamp handed downstream is the *exact scheduled* instant
   (cause + delay), never "the animation frame that happened to notice".
   Discovery-time timestamps would compound: each hop would silently add
   up to a frame of lag, and a 4-hop path would land visibly later than
   4 × hopMs. The only genuinely fresh timestamps in the whole chain are a
   CLOCK's analytically-computed phase start and a manual INPUT toggle. */
defineModule('engine', ['state'], (state) => {
  'use strict';

  const GATE_DEFS = {
    INPUT:  { kind:'INPUT',  label:'IN',    inputs:0, outputs:1, family:'io',
              compute:(i,s) => [s.value?1:0] },
    OUTPUT: { kind:'OUTPUT', label:'OUT',   inputs:1, outputs:0, family:'io',
              compute:()=>[] },
    CLOCK:  { kind:'CLOCK',  label:'CLK',   inputs:0, outputs:1, family:'io',
              compute:(i,s) => [s.value?1:0] },
    SEVEN:  { kind:'SEVEN',  label:'7SEG',  inputs:7, outputs:0, family:'io',
              compute:()=>[] },
    AND:    { kind:'AND',  label:'AND',   inputs:2, outputs:1, family:'and',  compute:([a,b])=>[(a&b)&1] },
    OR:     { kind:'OR',   label:'OR',    inputs:2, outputs:1, family:'or',   compute:([a,b])=>[(a|b)&1] },
    NOT:    { kind:'NOT',  label:'NOT',   inputs:1, outputs:1, family:'not',  compute:([a])=>[a?0:1] },
    NAND:   { kind:'NAND', label:'NAND',  inputs:2, outputs:1, family:'and',  compute:([a,b])=>[(a&b)?0:1] },
    NOR:    { kind:'NOR',  label:'NOR',   inputs:2, outputs:1, family:'or',   compute:([a,b])=>[(a|b)?0:1] },
    XOR:    { kind:'XOR',  label:'XOR',   inputs:2, outputs:1, family:'xor',  compute:([a,b])=>[(a^b)&1] },
    XNOR:   { kind:'XNOR', label:'XNOR',  inputs:2, outputs:1, family:'xor',  compute:([a,b])=>[(a^b)?0:1] },
    MUX:    { kind:'MUX',  label:'MUX',   inputs:3, outputs:1, family:'mux',  compute:([a,b,c])=>[c?b:a] },
    DFF:    { kind:'DFF',  label:'D-FF',  inputs:2, outputs:1, family:'seq',
              compute:([d,clk],s)=>{ const r=clk&&!s.lastClk; s.lastClk=clk; if(r)s.q=d?1:0; return[s.q||0]; } },
    TFF:    { kind:'TFF',  label:'T-FF',  inputs:2, outputs:1, family:'seq',
              compute:([t,clk],s)=>{ const r=clk&&!s.lastClk; s.lastClk=clk; if(r&&t)s.q=s.q?0:1; return[s.q||0]; } },
    JKFF:   { kind:'JKFF', label:'JK-FF', inputs:3, outputs:1, family:'seq',
              compute:([j,k,clk],s)=>{ const r=clk&&!s.lastClk; s.lastClk=clk; if(r){if(j&&k)s.q=s.q?0:1; else if(j)s.q=1; else if(k)s.q=0;} return[s.q||0]; } },
    SRFF:   { kind:'SRFF', label:'SR-FF', inputs:2, outputs:1, family:'seq',
              compute:([s2,r],s)=>{ if(s2&&!r)s.q=1; else if(r&&!s2)s.q=0; return[s.q||0]; } },
  };

  const GRID = 20;
  const snapGridVal = (v) => Math.round(v/GRID)*GRID;

  /* ── A shared timing grid ────────────────────────────────────────────────
     Every "root" event (anything not derived by adding a fixed delay to an
     already-exact time) snaps to this, so an ad-hoc user toggle lands on the
     same grid as a running clock instead of marching to its own arbitrary
     offset. 6.25ms is the GCD of every fixed interval in the app: the
     fastest clock half-period (1/16s → 31.25ms) and every selectable hop
     time (250/500/1000/2000ms). Anything built by adding those intervals to
     an already-snapped time lands back on the grid automatically. */
  const GLOBAL_TICK_MS = 6.25;
  const snapToGlobalTick = (t) => Math.round(t / GLOBAL_TICK_MS) * GLOBAL_TICK_MS;

  /* ── Pin geometry ────────────────────────────────────────────────────── */
  const FACE_ROT = { right:0, down:90, left:180, up:270 };

  // Rotate a unit direction into the component's frame. 'left' is a
  // horizontal mirror (not a 180° turn) so gate art stays right-side up,
  // which matches how GateBody draws itself.
  function rotDir(d, facing) {
    if (facing === 'left') return { x:-d.x, y:d.y };
    if (facing === 'up')   return { x:d.y,  y:-d.x };
    if (facing === 'down') return { x:-d.y, y:d.x };
    return { x:d.x, y:d.y };
  }
  const PIN_DIR_VEC = { left:{x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1} };

  function visOf(kind) { return window.Modules.gates.GATE_VIS[kind]; }

  function pinAbs(comp, kind, idx) {
    const vis = visOf(comp.kind);
    const p = (kind === 'in' ? vis.inputs[idx] : vis.outputs[idx]) || {x:0,y:0};
    const cx = vis.w/2, cy = vis.h/2;
    if (comp.facing === 'left') return { x: comp.x + (vis.w - p.x), y: comp.y + p.y };
    const rad = (FACE_ROT[comp.facing] || 0) * Math.PI/180;
    const dx = p.x - cx, dy = p.y - cy;
    return {
      x: comp.x + cx + (dx*Math.cos(rad) - dy*Math.sin(rad)),
      y: comp.y + cy + (dx*Math.sin(rad) + dy*Math.cos(rad)),
    };
  }

  // Unit vector pointing *out* of the component at this pin — the direction
  // a wire should leave (outputs) or arrive from (inputs). Auto-routing uses
  // it so wires always meet a pin head-on instead of clipping the body.
  function pinOutDir(comp, kind, idx) {
    const vis = visOf(comp.kind);
    const p = (kind === 'in' ? vis.inputs[idx] : vis.outputs[idx]) || {};
    const base = PIN_DIR_VEC[p.dir || (kind === 'in' ? 'left' : 'right')];
    return rotDir(base, comp.facing || 'right');
  }

  /* ── Polyline helpers ───────────────────────────────────────────────── */
  function resolveWire(x1,y1,x2,y2,pts=[]) {
    const knots = [{x:x1,y:y1},...pts,{x:x2,y:y2}];
    const out = [knots[0]];
    for (let i=1;i<knots.length;i++) {
      const a = out[out.length-1], b = knots[i];
      if (a.x===b.x || a.y===b.y) out.push(b);
      else out.push({x:b.x,y:a.y}, b);
    }
    // Collapse zero-length steps (so arc-length maths never divides by 0)
    // and merge collinear runs, which keeps hit-testing, midpoint labels and
    // pulse sampling working off the simplest possible polyline.
    const dedup = out.filter((p,i)=> i===0 || p.x!==out[i-1].x || p.y!==out[i-1].y);
    const simple = [];
    for (let i=0;i<dedup.length;i++) {
      const prev = simple[simple.length-1], next = dedup[i+1];
      if (prev && next &&
          ((prev.x===dedup[i].x && dedup[i].x===next.x) ||
           (prev.y===dedup[i].y && dedup[i].y===next.y))) continue;
      simple.push(dedup[i]);
    }
    return simple;
  }
  function pathD(p) { return p.map((v,i)=>(i?'L ':'M ')+v.x+' '+v.y).join(''); }
  function polyLength(p) {
    let t=0; for (let i=1;i<p.length;i++) t += Math.hypot(p[i].x-p[i-1].x, p[i].y-p[i-1].y);
    return t;
  }
  function samplePoly(p, t) {
    if (p.length===1) return [p[0].x,p[0].y];
    const total = polyLength(p);
    let d = Math.max(0,Math.min(1,t)) * total;
    for (let i=1;i<p.length;i++) {
      const l = Math.hypot(p[i].x-p[i-1].x, p[i].y-p[i-1].y);
      if (d <= l || i===p.length-1) {
        const f = l>0 ? Math.min(1,d/l) : 0;
        return [p[i-1].x+(p[i].x-p[i-1].x)*f, p[i-1].y+(p[i].y-p[i-1].y)*f];
      }
      d -= l;
    }
    return [p[p.length-1].x, p[p.length-1].y];
  }
  function distToSeg(px,py,ax,ay,bx,by) {
    const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
    if (l2===0) return Math.hypot(px-ax,py-ay);
    const t = Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));
    return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
  }
  // Nearest point on a polyline, plus how far along it that point sits.
  function projectOnPoly(p, x, y) {
    let best = { d:Infinity, point:p[0]||{x,y}, index:0, along:0 };
    let acc = 0;
    for (let i=1;i<p.length;i++) {
      const a=p[i-1], b=p[i];
      const dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy, len=Math.hypot(dx,dy);
      const t = l2===0 ? 0 : Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/l2));
      const q = { x:a.x+t*dx, y:a.y+t*dy };
      const d = Math.hypot(q.x-x, q.y-y);
      if (d < best.d) best = { d, point:q, index:i-1, along:acc + t*len };
      acc += len;
    }
    return best;
  }

  /* ── Auto-routing ────────────────────────────────────────────────────────
     Wires with no manual bends route themselves: leave the source pin along
     its outward direction, approach the target pin head-on, and elbow
     between the two. Because this is recomputed from live pin positions,
     dragging a component keeps every attached wire tidy instead of leaving
     the diagonal spaghetti a stored-points-only model produces. */
  const STUB = 20;
  function autoRoute(a, adir, b, bdir) {
    const a1 = { x: snapGridVal(a.x + adir.x*STUB), y: snapGridVal(a.y + adir.y*STUB) };
    const b1 = { x: snapGridVal(b.x + bdir.x*STUB), y: snapGridVal(b.y + bdir.y*STUB) };
    const pts = [];
    const aH = adir.y === 0, bH = bdir.y === 0;
    if (Math.abs(a1.x-a.x) > 0.5 || Math.abs(a1.y-a.y) > 0.5) pts.push(a1);
    if (aH && bH) {
      if (Math.abs(a1.y - b1.y) > 0.5) {
        const mid = snapGridVal((a1.x + b1.x)/2);
        // Target sits behind the source: hop out and around rather than
        // doubling back through the gate body.
        const x = (b1.x - a1.x) * adir.x > 0 ? mid : a1.x;
        pts.push({x, y:a1.y}, {x, y:b1.y});
      }
    } else if (!aH && !bH) {
      if (Math.abs(a1.x - b1.x) > 0.5) {
        const mid = snapGridVal((a1.y + b1.y)/2);
        const y = (b1.y - a1.y) * adir.y > 0 ? mid : a1.y;
        pts.push({x:a1.x, y}, {x:b1.x, y});
      }
    } else if (aH) {
      pts.push({x:b1.x, y:a1.y});
    } else {
      pts.push({x:a1.x, y:b1.y});
    }
    if (Math.abs(b1.x-b.x) > 0.5 || Math.abs(b1.y-b.y) > 0.5) pts.push(b1);
    return pts;
  }

  /* ══ CIRCUIT ═══════════════════════════════════════════════════════════ */
  function createCircuit() {
    let nextId = 1, nextIoId = 1;
    const components = new Map();
    const ioComponents = new Map();
    const wires = new Map();
    // One entry per driving output pin that has at least one wire on it.
    // Key: "compId:pin". This is the unit of propagation delay.
    const signals = new Map();

    const isPin = (t) => !!t && typeof t.compId === 'string' && typeof t.pin === 'number';
    const isTap = (t) => !!t && typeof t.wireId === 'string';
    const sigKey = (compId, pin) => compId + ':' + pin;

    /* ── geometry ─────────────────────────────────────────────────────── */
    // Absolute coordinates of a wire endpoint. A tap keeps its stored point
    // projected back onto its parent's *current* path, so branches stay
    // welded to the wire they tap even as components move around.
    function terminalCoords(term, depth = 0) {
      if (!term) return { x:0, y:0 };
      if (isPin(term)) {
        const comp = components.get(term.compId);
        if (!comp) return { x:term.x||0, y:term.y||0 };
        return pinAbs(comp, term.type === 'in' ? 'in' : 'out', term.pin);
      }
      if (isTap(term) && depth < 12) {
        const parent = wires.get(term.wireId);
        if (parent) {
          const p = wirePoints(parent, depth+1);
          if (p.length) return projectOnPoly(p, term.x, term.y).point;
        }
      }
      return { x:term.x||0, y:term.y||0 };
    }
    function terminalDir(term, depth = 0) {
      if (isPin(term)) {
        const comp = components.get(term.compId);
        if (comp) return pinOutDir(comp, term.type === 'in' ? 'in' : 'out', term.pin);
      }
      if (isTap(term)) {
        // Leave a tap perpendicular to the wire it branches off.
        const parent = wires.get(term.wireId);
        if (parent && depth < 12) {
          const p = wirePoints(parent, depth+1);
          const pr = projectOnPoly(p, term.x, term.y);
          const a = p[pr.index], b = p[pr.index+1] || a;
          if (a && b) {
            const horiz = Math.abs(b.x-a.x) >= Math.abs(b.y-a.y);
            return horiz ? {x:0,y:1} : {x:1,y:0};
          }
        }
      }
      return { x:1, y:0 };
    }
    // Full resolved polyline for a wire: manual bends if it has any,
    // otherwise a freshly auto-routed path.
    function wirePoints(wire, depth = 0) {
      const a = terminalCoords(wire.from, depth);
      const b = terminalCoords(wire.to, depth);
      const mids = (wire.points && wire.points.length)
        ? wire.points
        : autoRoute(a, terminalDir(wire.from, depth), b, terminalDir(wire.to, depth));
      return resolveWire(a.x, a.y, b.x, b.y, mids);
    }

    /* ── topology ─────────────────────────────────────────────────────── */
    // Which signal (driving output pin) does this wire ultimately belong to?
    // Taps chain back through their parents until a real output pin is hit.
    function rootSignalOf(wire, depth = 0) {
      if (!wire || depth > 24) return null;
      if (isPin(wire.from)) return sigKey(wire.from.compId, wire.from.pin);
      if (isTap(wire.from)) return rootSignalOf(wires.get(wire.from.wireId), depth+1);
      return null;
    }
    // Rebuilt every step (cheap; topology is small) and shared by the
    // compute / propagate / refresh stages below.
    function topology() {
      const rootOf = new Map();            // wireId  -> signal key
      const members = new Map();           // signal key -> [wire, …]
      const driversOf = new Map();         // compId -> [signal key per input pin]
      for (const w of wires.values()) {
        const root = rootSignalOf(w);
        if (!root) continue;
        rootOf.set(w.id, root);
        if (!members.has(root)) members.set(root, []);
        members.get(root).push(w);
      }
      for (const w of wires.values()) {
        const root = rootOf.get(w.id);
        if (!root || !isPin(w.to)) continue;
        const def = GATE_DEFS[components.get(w.to.compId)?.kind];
        if (!def) continue;
        if (!driversOf.has(w.to.compId)) driversOf.set(w.to.compId, new Array(def.inputs).fill(null));
        const arr = driversOf.get(w.to.compId);
        if (w.to.pin < arr.length) arr[w.to.pin] = root;
      }
      // Keep the signal table in sync with live topology.
      for (const key of members.keys()) {
        if (!signals.has(key)) signals.set(key, { value:0, lastChange:0, queue:[] });
      }
      for (const key of [...signals.keys()]) if (!members.has(key)) signals.delete(key);
      return { rootOf, members, driversOf };
    }

    /* ── mutation ─────────────────────────────────────────────────────── */
    function addComponent(kind, x, y, facing = 'right', delay = 0, label = 'none') {
      const def = GATE_DEFS[kind];
      if (!def) throw new Error('unknown component kind: ' + kind);
      const id = 'c' + (nextId++);
      const ioId = (kind==='INPUT' || kind==='OUTPUT') ? 'io'+(nextIoId++) : '';
      const comp = {
        id, ioId, kind, x, y,
        state: kind==='INPUT' ? { value:0 }
             : kind==='CLOCK' ? { value:0, period:1000, paused:false }
             : kind==='DFF'   ? { q:0, lastClk:0 } : {},
        inputVals:  new Array(def.inputs).fill(0),
        outputVals: new Array(def.outputs).fill(0),
        outputChangeTime: new Array(def.outputs).fill(0),
        pendingOutputVals: [], pendingOutputStart: [],
        label: label === 'none'
          ? (ioId ? String.fromCharCode(Number(ioId.slice(2)) + 64) : def.label)
          : label,
        lastChange: 0, facing, delay,
      };
      components.set(id, comp);
      if (ioId) ioComponents.set(ioId, comp);
      return comp;
    }

    function removeComponent(id) {
      const comp = components.get(id);
      if (!comp) return;
      components.delete(id);
      if (comp.ioId) ioComponents.delete(comp.ioId);
      for (const [wid,w] of [...wires]) {
        if (w.from.compId === id || w.to.compId === id) removeWire(wid);
      }
    }

    // Deleting a wire takes its branches with it — a tap has no meaning
    // without the wire it taps.
    function removeWire(id) {
      if (!wires.has(id)) return;
      wires.delete(id);
      for (const [wid,w] of [...wires]) if (isTap(w.from) && w.from.wireId === id) removeWire(wid);
      // The signal table itself is reconciled against live topology on the
      // next step(), so there's nothing to clean up here.
    }

    // What an input pin is currently driven by, if anything.
    function wireIntoInput(compId, pin) {
      for (const w of wires.values()) {
        if (isPin(w.to) && w.to.compId === compId && w.to.pin === pin) return w;
      }
      return null;
    }

    // Is this a legal connection? Returns a reason string when it isn't, so
    // the canvas can say *why* a target is rejected rather than just
    // refusing to snap to it.
    function connectionProblem(from, to) {
      if (!from || !to) return 'incomplete';
      if (!isPin(to) || to.type !== 'in') return 'a wire has to end on an input pin';
      if (isPin(from)) {
        if (from.type !== 'out') return 'a wire has to start at an output pin';
        if (from.compId === to.compId) return "can't wire a component to itself";
        for (const w of wires.values()) {
          if (isPin(w.from) && w.from.compId===from.compId && w.from.pin===from.pin &&
              isPin(w.to) && w.to.compId===to.compId && w.to.pin===to.pin) return 'already connected';
        }
      } else if (isTap(from)) {
        const parent = wires.get(from.wireId);
        if (!parent) return 'that wire no longer exists';
        if (isPin(parent.to) && parent.to.compId === to.compId && parent.to.pin === to.pin) return 'already connected';
      } else return 'unsupported source';
      return null;
    }

    function addWire(from, to, points) {
      if (connectionProblem(from, to)) return null;
      // One driver per input: a new connection replaces the old one rather
      // than silently OR-ing two sources together.
      const existing = wireIntoInput(to.compId, to.pin);
      if (existing) removeWire(existing.id);
      const id = 'w' + (nextId++);
      const wire = { id, from, to, points: points || [], label:'' };
      wires.set(id, wire);
      return wire;
    }

    /* ── simulation ───────────────────────────────────────────────────── */
    function tickClocks(now) {
      // Computed from absolute time, not incrementally, so every clock is
      // phase-locked to the same origin regardless of when it was placed or
      // how long it sat paused. phaseStart is the *exact* instant the phase
      // began — the seed that makes everything downstream exact.
      for (const c of components.values()) {
        if (c.kind === 'CLOCK' && !c.state.paused) {
          const half = Math.max(1, c.state.period / 2);
          const phase = Math.floor(now / half) % 2;
          if (c.state.value !== phase) {
            c.state.value = phase;
            c.state.phaseStart = snapToGlobalTick(Math.floor(now / half) * half);
          }
        }
      }
    }

    function computeOutputs(now, driversOf, instant) {
      let changed = false;
      for (const c of components.values()) {
        const def = GATE_DEFS[c.kind];
        if (!def) continue;
        const outs = def.compute(c.inputVals, c.state) || [];
        for (let i=0;i<outs.length;i++) {
          if (outs[i] !== c.pendingOutputVals[i]) {
            if (outs[i] === c.outputVals[i]) {
              // Input reverted before the pending change landed — drop the
              // in-flight change instead of letting it commit as a stale
              // glitch when the old timer expires.
              c.pendingOutputVals[i] = undefined;
              c.pendingOutputStart[i] = undefined;
            } else {
              let cause = snapToGlobalTick(now);
              if (c.kind === 'CLOCK') {
                if (typeof c.state.phaseStart === 'number') cause = c.state.phaseStart;
              } else {
                const drv = driversOf.get(c.id);
                if (drv) {
                  // The most recent input arrival is what triggered this new
                  // result, so that's the exact instant to count from.
                  let t = null;
                  for (const key of drv) {
                    if (!key) continue;
                    const s = signals.get(key);
                    if (s && (t === null || s.lastChange > t)) t = s.lastChange;
                  }
                  if (t !== null) cause = t;
                }
              }
              c.pendingOutputVals[i] = outs[i];
              c.pendingOutputStart[i] = cause;
            }
          }
          const pend = c.pendingOutputVals[i];
          if (pend !== undefined && (instant || now - (c.pendingOutputStart[i]||0) >= (c.delay||0))) {
            if (c.outputVals[i] !== pend) {
              c.outputVals[i] = pend;
              c.lastChange = now;
              // Exact scheduled commit time (cause + delay), never `now`.
              c.outputChangeTime[i] = instant ? now : (c.pendingOutputStart[i]||0) + (c.delay||0);
              changed = true;
            }
            c.pendingOutputVals[i] = undefined;
            c.pendingOutputStart[i] = undefined;
          }
        }
      }
      return changed;
    }

    // Queue every distinct transition (compared against the last value
    // already queued, not the committed one) so a source that flips faster
    // than one hop puts a train of pulses on the net instead of losing the
    // reverting edge. Each still commits exactly hopMs after it departed, so
    // the output frequency always matches the source's — just phase-shifted.
    function pumpSignals(now, hopMs, instant) {
      let changed = false;
      for (const [key, sig] of signals) {
        const [cid, pinStr] = key.split(':');
        const comp = components.get(cid);
        if (!comp) continue;
        const pin = Number(pinStr);
        const val = comp.outputVals[pin] || 0;
        const lastQueued = sig.queue.length ? sig.queue[sig.queue.length-1].value : sig.value;
        if (val !== lastQueued) {
          const t = comp.outputChangeTime[pin];
          sig.queue.push({ value: val, time: typeof t === 'number' ? t : snapToGlobalTick(now) });
          changed = true;
        }
      }
      for (const sig of signals.values()) {
        while (sig.queue.length && (instant || now - sig.queue[0].time >= hopMs)) {
          const ev = sig.queue.shift();
          if (sig.value !== ev.value) {
            sig.value = ev.value;
            // Exact scheduled arrival, not the frame that noticed it.
            sig.lastChange = instant ? now : ev.time + hopMs;
            changed = true;
          }
        }
      }
      return changed;
    }

    function refreshInputs(rootOf) {
      const acc = new Map();
      for (const c of components.values()) {
        const def = GATE_DEFS[c.kind];
        acc.set(c.id, new Array(def ? def.inputs : 0).fill(0));
      }
      for (const w of wires.values()) {
        if (!isPin(w.to)) continue;
        const a = acc.get(w.to.compId);
        const sig = signals.get(rootOf.get(w.id));
        if (a && sig && w.to.pin < a.length) a[w.to.pin] = a[w.to.pin] || (sig.value || 0);
      }
      let changed = false;
      for (const c of components.values()) {
        const next = acc.get(c.id);
        if (c.inputVals.length !== next.length || next.some((v,i)=>v!==c.inputVals[i])) changed = true;
        c.inputVals = next;
      }
      return changed;
    }

    // Looping the whole cycle a bounded number of times per instant lets a
    // chain settle within one frame where possible. Signal commits stay
    // gated on elapsed time, so extra passes can never make a value arrive
    // before its hop is up.
    const SETTLE_PASSES = 8;
    function step(now, hopMs, instant) {
      tickClocks(now);
      const { rootOf, driversOf } = topology();
      for (let pass=0; pass<SETTLE_PASSES; pass++) {
        const a = computeOutputs(now, driversOf, instant);
        const b = pumpSignals(now, hopMs, instant);
        const c = refreshInputs(rootOf);
        if (!a && !b && !c) break;
      }
    }

    // Wipe every in-flight signal and latch back to a cold start, keeping
    // the layout. Used by the toolbar's Reset.
    function resetSim() {
      for (const c of components.values()) {
        const def = GATE_DEFS[c.kind];
        c.inputVals = new Array(def.inputs).fill(0);
        c.outputVals = new Array(def.outputs).fill(0);
        c.outputChangeTime = new Array(def.outputs).fill(0);
        c.pendingOutputVals = []; c.pendingOutputStart = [];
        if (c.kind === 'CLOCK') { c.state.value = 0; delete c.state.phaseStart; }
        if ('q' in c.state) c.state.q = 0;
        if ('lastClk' in c.state) c.state.lastClk = 0;
        if (c.state.sub) delete c.state.sub;
      }
      signals.clear();
    }

    /* ── persistence ──────────────────────────────────────────────────── */
    function serialize() {
      return {
        version: 2,
        components: [...components.values()].map(c=>({
          id:c.id, ioId:c.ioId, kind:c.kind, x:c.x, y:c.y, facing:c.facing, delay:c.delay, label:c.label,
          state: c.kind==='INPUT' ? { value:c.state.value }
               : c.kind==='CLOCK' ? { period:c.state.period, paused:c.state.paused } : {},
        })),
        wires: [...wires.values()].map(w=>({ id:w.id, from:w.from, to:w.to, points:w.points||[], label:w.label||'' })),
        nextId, nextIoId,
      };
    }

    // v1 files could contain wires with free-floating endpoints and a
    // separate junction registry. Those are converted to taps where a
    // matching junction exists, and dropped otherwise — the current model
    // has no representation for a wire that ends in mid-air.
    function migrateWires(data) {
      const junctions = data.junctions || [];
      const near = (a,b) => Math.abs(a-b) < 1e-6;
      const out = [];
      for (const wd of data.wires || []) {
        let from = wd.from, to = wd.to;
        if (from && typeof from.x === 'number' && !from.compId && !from.wireId) {
          const j = junctions.find(j => near(j.x, from.x) && near(j.y, from.y));
          if (!j) continue;
          from = { wireId: j.sourceWireId, x: j.x, y: j.y };
        }
        if (!to || typeof to.pin !== 'number' || typeof to.compId !== 'string') continue;
        out.push({ ...wd, from, to:{ ...to, type:'in' } });
      }
      return out;
    }

    function load(data) {
      components.clear(); ioComponents.clear(); wires.clear(); signals.clear();
      if (!data) return;
      // Two passes: addComponent mints throwaway sequential ids as a side
      // effect, and those can collide with another entry's *saved* id when
      // the original circuit had gaps from deletions. Mint everything first,
      // then assign the real ids and populate the maps once.
      const built = [];
      for (const cd of data.components || []) {
        if (!GATE_DEFS[cd.kind]) continue;
        const c = addComponent(cd.kind, cd.x, cd.y, cd.facing, cd.delay);
        components.delete(c.id); if (c.ioId) ioComponents.delete(c.ioId);
        if (cd.label !== undefined) c.label = cd.label;
        if (cd.state) Object.assign(c.state, cd.state);
        built.push({ c, cd });
      }
      for (const { c, cd } of built) {
        c.id = cd.id || c.id; c.ioId = cd.ioId || '';
        components.set(c.id, c);
        if (c.ioId) ioComponents.set(c.ioId, c);
      }
      for (const wd of migrateWires(data)) {
        const from = wd.from && wd.from.compId ? { ...wd.from, type:'out' } : wd.from;
        wires.set(wd.id, { id:wd.id, from, to:wd.to, points:wd.points||[], label:wd.label||'' });
      }
      nextId = Math.max(data.nextId || 1, nextId);
      nextIoId = Math.max(data.nextIoId || 1, nextIoId);
    }

    return {
      components, wires, ioComponents, signals,
      isPin, isTap, sigKey,
      terminalCoords, terminalDir, wirePoints, rootSignalOf, topology, wireIntoInput,
      connectionProblem,
      addComponent, removeComponent, addWire, removeWire,
      step, resetSim, serialize, load,
      signalOfWire(wire) { return signals.get(rootSignalOf(wire)); },
      toggleInput(id){ const c=components.get(id); if(c&&c.kind==='INPUT') c.state.value=c.state.value?0:1; },
      setInput(id,v){ const c=components.get(id); if(c&&c.kind==='INPUT') c.state.value=v?1:0; },
      toggleClock(id){ const c=components.get(id); if(c&&c.kind==='CLOCK') c.state.paused=!c.state.paused; },
      setClockPeriod(id,p){ const c=components.get(id); if(c&&c.kind==='CLOCK') c.state.period=p; },
      setLabel(id,l){ const c=components.get(id); if(c) c.label=l; },
      setFacing(id,f){ const c=components.get(id); if(c) c.facing=f; },
      setWireLabel(id,l){ const w=wires.get(id); if(w) w.label=l; },
    };
  }

  return {
    GATE_DEFS, GRID, snapGridVal, GLOBAL_TICK_MS, snapToGlobalTick,
    pinAbs, pinOutDir, rotDir, FACE_ROT,
    resolveWire, pathD, polyLength, samplePoly, distToSeg, projectOnPoly, autoRoute,
    createCircuit,
  };
});
</script>

<script type="text/babel">
/* ═══ GATES ════════════════════════════════════════════════════════════════ */
defineModule('gates', ['state', 'engine'], (state, engine) => {
  'use strict';
  const { GATE_DEFS } = engine;

  const FAMILY_FILL = {
    and:'#fff7e0', or:'#e8f8ee', not:'#f0ecfd', xor:'#e6f0fe',
    mux:'#fff0e2', seq:'#fdeaf3', io:'#fffbe8', custom:'#ffffff',
  };
  const FAMILY_EDGE = {
    and:'#e0b64a', or:'#4fa877', not:'#7c6ce0', xor:'#4a86d8',
    mux:'#dd8b45', seq:'#d4589a', io:'#c9a227', custom:'#b9b8b0',
  };
  const VIS = {};
  const W=80,H=80,BX=12,YT=20,YB=60,YO=40,BT=8,BB=72;
  const STROKE = 2;

  // Fills left-to-right while a pending output counts down a component's own
  // extra delay, so the bar reads as a progress meter for the value about to
  // land. Most components have delay 0 and never show it.
  function PendingBar({ pendingStart, delay, value }) {
    const now = state.widgetState.now;
    const t = delay > 0 ? Math.min(1, (now-(pendingStart||now))/delay) : 1;
    return <g>
      <rect x="20" y="-7" width="40" height="5" rx="2.5" fill="var(--panel-3)"/>
      <rect x="20" y="-7" width={40*t} height="5" rx="2.5" fill={value ? 'var(--high)' : 'var(--low-p)'}/>
    </g>;
  }
  function pendingBar(comp) {
    return comp.pendingOutputVals && comp.pendingOutputVals[0] !== undefined && (comp.delay||0) > 0 &&
      <PendingBar pendingStart={comp.pendingOutputStart[0]} delay={comp.delay||0} value={comp.pendingOutputVals[0]}/>;
  }
  // Every gate body shares the same ink: a soft inner highlight for a bit of
  // dimensionality, then the family fill and a family-tinted outline.
  function shape(d, f, edge, extra) {
    return <g>
      <path d={d} fill={f} stroke={edge} strokeWidth={STROKE} strokeLinejoin="round"/>
      {extra}
    </g>;
  }

  const dAND  = `M ${BX} ${BT} H ${W*.5} a ${(BB-BT)/2} ${(BB-BT)/2} 0 0 1 0 ${BB-BT} H ${BX} Z`;
  const dNAND = `M ${BX} ${BT} H ${W*.45} a ${(BB-BT)/2} ${(BB-BT)/2} 0 0 1 0 ${BB-BT} H ${BX} Z`;
  const dOR   = `M ${BX} ${BT} Q ${BX+15} ${YO}, ${BX} ${BB} Q ${W*.5} ${BB}, ${W-3} ${YO} Q ${W*.5} ${BT}, ${BX} ${BT} Z`;
  const dNOR  = `M ${BX} ${BT} Q ${BX+15} ${YO}, ${BX} ${BB} Q ${W*.45} ${BB}, ${W-13} ${YO} Q ${W*.45} ${BT}, ${BX} ${BT} Z`;
  const xorArc= `M ${BX-6} ${BT} Q ${BX+9} ${YO}, ${BX-6} ${BB}`;
  const bubble= (cx,edge,f)=><circle cx={cx} cy={YO} r="5" fill={f} stroke={edge} strokeWidth={STROKE}/>;

  VIS.AND  = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f,comp,edge)=><g>{pendingBar(comp)}{shape(dAND,f,edge)}</g> };
  VIS.OR   = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f,comp,edge)=><g>{pendingBar(comp)}{shape(dOR,f,edge)}</g> };
  VIS.NOT  = { w:W,h:H, inputs:[{x:0,y:YO}], outputs:[{x:W,y:YO}],
    body:(f,comp,edge)=><g>{pendingBar(comp)}{shape('M 12 22 L 60 40 L 12 58 Z',f,edge)}{bubble(66,edge,f)}</g> };
  VIS.NAND = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f,comp,edge)=><g>{pendingBar(comp)}{shape(dNAND,f,edge)}{bubble(W-7,edge,f)}</g> };
  VIS.NOR  = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f,comp,edge)=><g>{pendingBar(comp)}{shape(dNOR,f,edge)}{bubble(W-7,edge,f)}</g> };
  VIS.XOR  = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f,comp,edge)=><g>{pendingBar(comp)}
      <path d={xorArc} fill="none" stroke={edge} strokeWidth={STROKE}/>{shape(dOR,f,edge)}</g> };
  VIS.XNOR = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB}], outputs:[{x:W,y:YO}],
    body:(f,comp,edge)=><g>{pendingBar(comp)}
      <path d={xorArc} fill="none" stroke={edge} strokeWidth={STROKE}/>{shape(dNOR,f,edge)}{bubble(W-7,edge,f)}</g> };
  VIS.MUX  = { w:W,h:H, inputs:[{x:0,y:YT},{x:0,y:YB},{x:W*.5,y:0,dir:'up'}], outputs:[{x:W,y:YO}],
    body:(f,comp,edge)=><g>{pendingBar(comp)}
      {shape(`M ${BX} ${BT} L ${W-BX} ${BT+BB*.25} V ${BB*.75} L ${BX} ${BB} Z`,f,edge)}
      <text x={BX+7} y={YT+4} fontFamily="var(--mono)" fontSize="8" fill="var(--ink)" opacity=".4">0</text>
      <text x={BX+7} y={YB+4} fontFamily="var(--mono)" fontSize="8" fill="var(--ink)" opacity=".4">1</text>
    </g> };

  /* ── in-place controls ────────────────────────────────────────────────
     Some components carry a control that's worth clicking on its own: a
     switch's knob, a clock's run/halt pad. Those get their own hit region so
     operating the part and selecting the part are different gestures. The
     rest of the body still selects, drags and renames as usual.

     Coordinates are local and un-rotated — the canvas renders the hit target
     inside the same transform as the artwork, so it follows a rotated or
     mirrored component for free. */
  const TOGGLE_HIT = {
    INPUT: (comp)=>({
      action:'input', title:'Flip this switch',
      shape:{ type:'circle', cx: comp.state.value ? 60 : 20, cy:20, r:12 },
    }),
    CLOCK: (comp)=>({
      action:'clock', title: comp.state.paused ? 'Run this clock' : 'Halt this clock',
      shape:{ type:'rect', x:7, y:8, w:24, h:24, rx:8 },
    }),
  };
  function toggleHit(comp) {
    const f = TOGGLE_HIT[comp.kind];
    return f ? f(comp) : null;
  }

  VIS.INPUT = { w:80, h:40, inputs:[], outputs:[{x:80,y:20}],
    body:(f,comp)=>{
      const on = comp.state.value;
      return <g>
        <rect x="4" y="4" width="72" height="32" rx="16"
              fill={on?'var(--high-soft)':'var(--panel-2)'} stroke={on?'var(--high-2)':'var(--border-hi)'} strokeWidth="2"/>
        <circle cx={on?60:20} cy="20" r="11.5" fill="var(--bg)" stroke={on?'var(--high-2)':'var(--border-hi)'} strokeWidth="1.5"/>
        <text x={on?60:20} y="24" fontFamily="var(--mono)" fontSize="11" fontWeight="600"
              textAnchor="middle" fill={on?'var(--high-2)':'var(--ink-3)'}>{on?'1':'0'}</text>
        <text x="-13" y="26" fontFamily="var(--mono)" fontSize="15" fontWeight="600"
              textAnchor="end" fill="var(--ink)" opacity=".85">{comp.label}</text>
      </g>;
    } };

  // Split in two, like the switch: a run/halt pad on the left that reads as
  // pressable, and the waveform on the right that's just a read-out. The pad
  // shows the action it will perform, not the state it's in — the waveform
  // and the fill already say whether it's ticking.
  VIS.CLOCK = { w:80, h:40, inputs:[], outputs:[{x:80,y:20}],
    body:(f,comp)=>{
      const on = comp.state.value, paused = comp.state.paused;
      const edge = paused ? 'var(--border-hi)' : 'var(--high-2)';
      return <g>
        <rect x="4" y="4" width="72" height="32" rx="9"
              fill={paused?'var(--panel-2)':'#fffdf0'} stroke={edge} strokeWidth="2"/>
        {/* A square pad centred on (19,20), with both glyphs optically
            centred on the same point — a right-pointing triangle sits heavy
            on its base, so it's set back a third of its width. Rounded joins
            and caps keep them from looking chiselled at this size. */}
        <rect x="7" y="8" width="24" height="24" rx="8"
              fill="var(--bg)" stroke={edge} strokeWidth="1.2" opacity=".85"/>
        {paused
          ? <path d="M16.4 15.2 L24.3 20 L16.4 24.8 Z"
                  fill="var(--ink-2)" stroke="var(--ink-2)" strokeWidth="1.7"
                  strokeLinejoin="round" strokeLinecap="round"/>
          : <g stroke="var(--ink-2)" strokeWidth="3" strokeLinecap="round">
              <line x1="16.2" y1="15.6" x2="16.2" y2="24.4"/>
              <line x1="21.8" y1="15.6" x2="21.8" y2="24.4"/>
            </g>}
        <path d="M 36 26 L 42 26 L 42 14 L 51 14 L 51 26 L 60 26 L 60 14 L 68 14"
              fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"
              stroke={paused ? 'var(--border-hi)' : (on ? 'var(--high)' : 'var(--low)')}/>
        {!paused && <circle cx={on?51:42} cy={on?14:26} r="2.6" fill={on?'var(--high-2)':'var(--ink-3)'}/>}
      </g>;
    } };

  VIS.OUTPUT = { w:40, h:40, inputs:[{x:0,y:20}], outputs:[],
    body:(f,comp)=>{
      const on = comp.inputVals[0];
      return <g>
        {on ? <circle cx="22" cy="20" r="19" fill="var(--high)" opacity=".16"/> : null}
        <circle cx="22" cy="20" r="13" fill={on?'#fde68a':'var(--panel-2)'}
                stroke={on?'var(--high-2)':'var(--border-hi)'} strokeWidth="2"/>
        <path d="M 17 25.5 L 17 30 L 27 30 L 27 25.5" fill="none" stroke="var(--ink-2)" strokeWidth="1.5" strokeLinecap="round"/>
        <text x="52" y="26" fontFamily="var(--mono)" fontSize="15" fontWeight="600"
              textAnchor="start" fill="var(--ink)" opacity=".85">{comp.label}</text>
        {on ? <g stroke="var(--high-2)" strokeWidth="1.6" strokeLinecap="round">
          <line x1="22" y1="2" x2="22" y2="5.5"/><line x1="38" y1="20" x2="41.5" y2="20"/>
          <line x1="2.5" y1="20" x2="6" y2="20"/><line x1="33.5" y1="8.5" x2="36" y2="6"/>
          <line x1="10.5" y1="8.5" x2="8" y2="6"/>
        </g> : null}
      </g>;
    } };

  /* Seven-segment display. Light-themed like the rest of the board, and lit
     in the same amber as every other high signal rather than a red LED — the
     colour means "high" here exactly as it does on a wire. Pin *indices* keep
     their historical segment mapping (0=g, 1=f, 2=a, 3=b, 4=e, 5=d, 6=c) and
     their slot positions, so circuits saved against the old artwork still
     light up the segments they used to. */
  const S7 = { w:60, h:80 };
  VIS.SEVEN = { w:S7.w, h:S7.h,
    inputs:[{x:S7.w*0.2,y:0,dir:'up'},{x:S7.w*0.4,y:0,dir:'up'},{x:S7.w*0.6,y:0,dir:'up'},{x:S7.w*0.8,y:0,dir:'up'},
            {x:S7.w*0.2,y:S7.h,dir:'down'},{x:S7.w*0.4,y:S7.h,dir:'down'},{x:S7.w*0.6,y:S7.h,dir:'down'}],
    outputs:[],
    body:(f,comp)=>{
      const lit = (i)=>!!comp.inputVals[i];
      const T = 4.6, R = 2.3;                       // segment thickness, radius
      const L = 18.4, Rt = 41.6, Mid = 40;          // left / right / middle
      const Top = 19, Bot = 61;
      const bar = (i, x, y, w, h)=><rect key={i} x={x} y={y} width={w} height={h} rx={R}
        fill={lit(i) ? 'var(--high)' : 'var(--border-md)'} opacity={lit(i) ? 1 : .5}/>;
      const hBar = (i, y)=>bar(i, L + T*0.6, y - T/2, (Rt - L) - T*1.2, T);
      const vBar = (i, y0, y1)=>bar(i, L - T/2, y0 + T*0.6, T, (y1 - y0) - T*1.2);
      const vBarR = (i, y0, y1)=>bar(i, Rt - T/2, y0 + T*0.6, T, (y1 - y0) - T*1.2);
      return <g>
        <rect x="3" y="9" width={S7.w-6} height={S7.h-18} rx="8"
              fill="var(--panel-2)" stroke="var(--border-hi)" strokeWidth="2"/>
        {hBar(2, Top)}{hBar(0, Mid)}{hBar(5, Bot)}
        {vBar(1, Top, Mid)}{vBar(4, Mid, Bot)}
        {vBarR(3, Top, Mid)}{vBarR(6, Mid, Bot)}
      </g>;
    } };

  function ffRect(f,h,edge){
    return <rect x="6" y="6" width="68" height={h-12} rx="8" fill={f} stroke={edge} strokeWidth="2"/>;
  }
  const ffTxt = (x,y,t)=><text x={x} y={y} fontFamily="var(--mono)" fontSize="12" fontWeight="500" fill="var(--ink)" opacity=".8">{t}</text>;
  const ffSub = (t,y)=><text x="40" y={y} fontFamily="var(--ui)" fontSize="9" fontWeight="600" textAnchor="middle" fill="var(--ink)" opacity=".3">{t}</text>;

  VIS.DFF  = { w:80,h:80, inputs:[{x:0,y:20},{x:0,y:60}], outputs:[{x:80,y:40}],
    body:(f,comp,e)=><g>{pendingBar(comp)}{ffRect(f,80,e)}{ffTxt(14,25,'D')}{ffTxt(14,65,'▷')}{ffTxt(64,45,'Q')}{ffSub('D',74)}</g> };
  VIS.TFF  = { w:80,h:80, inputs:[{x:0,y:20},{x:0,y:60}], outputs:[{x:80,y:40}],
    body:(f,comp,e)=><g>{pendingBar(comp)}{ffRect(f,80,e)}{ffTxt(14,25,'T')}{ffTxt(14,65,'▷')}{ffTxt(64,45,'Q')}{ffSub('T',74)}</g> };
  VIS.SRFF = { w:80,h:80, inputs:[{x:0,y:20},{x:0,y:60}], outputs:[{x:80,y:40}],
    body:(f,comp,e)=><g>{pendingBar(comp)}{ffRect(f,80,e)}{ffTxt(14,25,'S')}{ffTxt(14,65,'R')}{ffTxt(64,45,'Q')}{ffSub('SR',74)}</g> };
  VIS.JKFF = { w:80,h:120, inputs:[{x:0,y:20},{x:0,y:60},{x:0,y:100}], outputs:[{x:80,y:40}],
    body:(f,comp,e)=><g>{pendingBar(comp)}{ffRect(f,120,e)}{ffTxt(14,25,'J')}{ffTxt(14,65,'K')}{ffTxt(14,105,'▷')}{ffTxt(64,45,'Q')}{ffSub('JK',114)}</g> };

  /* ── pin stubs ─────────────────────────────────────────────────────────
     Each stub normally points 'left' (inputs) or 'right' (outputs) toward
     the body, but a pin can override with its own `dir` to poke out another
     side — e.g. a mux select facing 'up' — independent of gate facing. */
  const PIN_DIR_VEC = { left:[-1,0], right:[1,0], up:[0,-1], down:[0,1] };
  function pinStub(p, defaultDir) {
    const [dx,dy] = PIN_DIR_VEC[p.dir || defaultDir];
    return { x1:p.x-dx*12, y1:p.y-dy*12, x2:p.x, y2:p.y };
  }

  function GateBody({ comp, ghost }) {
    const def = GATE_DEFS[comp.kind], vis = VIS[comp.kind];
    if (!vis || !def) return null;
    const fill = FAMILY_FILL[def.family] || '#fff';
    const edge = ghost ? 'var(--border-hi)' : (FAMILY_EDGE[def.family] || 'var(--ink)');
    const label = def.label;
    return <g transform={comp.facing==='left'
              ? `translate(${vis.w} 0) scale(-1 1)`
              : `rotate(${comp.facing==='up'?270:comp.facing==='down'?90:0} ${vis.w/2} ${vis.h/2})`}>
      {vis.inputs.map((p,i)=>{ const s=pinStub(p,'left');
        return <line key={'i'+i} {...s} stroke="var(--ink-2)" strokeWidth="2" strokeLinecap="round"/>; })}
      {vis.outputs.map((p,i)=>{ const s=pinStub(p,'right');
        return <line key={'o'+i} {...s} stroke="var(--ink-2)" strokeWidth="2" strokeLinecap="round"/>; })}
      {vis.body(fill, comp, edge)}
      {['AND','OR','NAND','NOR','XOR','XNOR','MUX'].includes(comp.kind) &&
        <text x={vis.w/2+2} y={vis.h/2+4} textAnchor="middle" fontFamily="var(--mono)"
              fontSize="9.5" fontWeight="600" fill="var(--ink)" opacity=".38" pointerEvents="none"
              transform={comp.facing==='left' ? `translate(${vis.w/2+2} 0) scale(-1 1) translate(${-(vis.w/2+2)} 0)` : undefined}>{label}</text>}
    </g>;
  }

  /* ── custom gates ──────────────────────────────────────────────────────
     Registers a saved circuit as a placeable component: a white box sized to
     fit its inputs (left) / outputs (right), simulated as a black box by
     settling a private nested circuit on every compute(). */
  const CUSTOM_PIN_MARGIN = 20, CUSTOM_PIN_GAP = 30;
  const snap20 = (v)=>Math.round(v/20)*20;
  function customPinYs(n, h) {
    if (n <= 1) return [snap20(h/2)];
    const usable = h - CUSTOM_PIN_MARGIN*2;
    return Array.from({length:n}, (_,i)=>snap20(CUSTOM_PIN_MARGIN + usable*i/(n-1)));
  }
  // Greedy word-wrap for the box label at ~6px/char, hard-breaking any single
  // word too long for the line so it can't overflow the box.
  function wrapLabel(text, maxChars) {
    const words = String(text).split(/\s+/).filter(Boolean);
    const lines = []; let cur = '';
    for (const w of words) {
      const test = cur ? cur+' '+w : w;
      if (test.length > maxChars && cur) { lines.push(cur); cur = w; } else cur = test;
    }
    if (cur) lines.push(cur);
    return lines.flatMap(line => {
      if (line.length <= maxChars) return [line];
      const chunks = [];
      for (let i=0;i<line.length;i+=maxChars) chunks.push(line.slice(i,i+maxChars));
      return chunks;
    });
  }
  function registerCustomGate(name, data) {
    const kindKey = 'CUSTOM:' + name;
    const tmp = engine.createCircuit();
    tmp.load(data);
    // Ordered by y so the box's pin stack matches how the IO was laid out
    // top-to-bottom in the saved circuit, not creation order.
    const ins  = [...tmp.ioComponents.values()].filter(c=>c.kind==='INPUT').sort((a,b)=>a.y-b.y);
    const outs = [...tmp.ioComponents.values()].filter(c=>c.kind==='OUTPUT').sort((a,b)=>a.y-b.y);
    const inIds=ins.map(c=>c.ioId), outIds=outs.map(c=>c.ioId);
    const inLabels=ins.map(c=>c.label), outLabels=outs.map(c=>c.label);

    const h = Math.ceil(Math.max(H, CUSTOM_PIN_MARGIN*2 + (Math.max(inIds.length,outIds.length,1)-1)*CUSTOM_PIN_GAP)/40)*40;
    const inYs = customPinYs(inIds.length, h), outYs = customPinYs(outIds.length, h);
    const nameLines = wrapLabel(name, Math.max(3, Math.floor((W-18)/6)));
    const nameLineH = 12;
    const nameStartY = h/2 - (nameLines.length-1)*nameLineH/2 + 4;

    GATE_DEFS[kindKey] = {
      kind:kindKey, label:name, inputs:inIds.length, outputs:outIds.length, family:'custom',
      compute(inputVals, st) {
        if (!st.sub) { st.sub = engine.createCircuit(); st.sub.load(data); }
        const sub = st.sub;
        inIds.forEach((ioId,i)=>{ const c=sub.ioComponents.get(ioId); if (c) c.state.value = inputVals[i]?1:0; });
        // A custom gate is one hop from the outside, so its interior settles
        // instantly rather than adding its own internal hop count.
        for (let i=0;i<8;i++) sub.step(state.widgetState.now, 0, true);
        return outIds.map(ioId=>{ const c=sub.ioComponents.get(ioId); return c ? (c.inputVals[0]||0) : 0; });
      },
    };

    VIS[kindKey] = {
      w:W, h,
      inputs: inYs.map(y=>({x:0,y})),
      outputs: outYs.map(y=>({x:W,y})),
      body:(f,comp,edge)=><g>
        <rect x="0" y="0" width={W} height={h} rx="8" fill="var(--bg)" stroke={edge} strokeWidth="2"/>
        <text x={W/2} textAnchor="middle" fontFamily="var(--mono)" fontSize="10" fontWeight="600" fill="var(--ink)" opacity=".7">
          {nameLines.map((line,i)=><tspan key={i} x={W/2} y={nameStartY+i*nameLineH}>{line}</tspan>)}
        </text>
        {inLabels.map((lbl,i)=><text key={'i'+i} x="8" y={inYs[i]+3.5} fontFamily="var(--mono)" fontSize="9" fill="var(--ink)" opacity=".6">{lbl}</text>)}
        {outLabels.map((lbl,i)=><text key={'o'+i} x={W-8} y={outYs[i]+3.5} textAnchor="end" fontFamily="var(--mono)" fontSize="9" fill="var(--ink)" opacity=".6">{lbl}</text>)}
      </g>,
    };
    return kindKey;
  }

  return { GATE_VIS: VIS, FAMILY_FILL, FAMILY_EDGE, GateBody, registerCustomGate, toggleHit };
});
</script>

<script type="text/babel">
/* ═══ CANVAS ═══════════════════════════════════════════════════════════════

   WIRING MODEL
   ────────────
   One gesture, two ways to perform it — press-drag-release for a quick
   connection, or click-move-click for a considered one. Both run through the
   same state machine, so there's no mode to learn and no way to end up
   holding the mouse button wrong.

     · Press or click any pin       → start a wire (either end works; the
                                      engine sorts out which is the driver)
     · Click empty canvas           → drop a corner and keep going
     · Click / release on a pin     → connect
     · Backspace                    → undo the last corner
     · Esc or right-click           → cancel
     · Drag off an existing wire    → branch from it (a junction tap)

   Wires can't be left dangling in mid-air: every wire runs pin-to-pin, which
   is what makes "one net = one hop" a well-defined unit of delay. */
defineModule('canvas', ['state', 'engine', 'gates'], (state, engine, gates) => {
'use strict';
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const { GATE_VIS, GateBody, toggleHit } = gates;
const {
  GATE_DEFS, GRID, resolveWire, pathD, polyLength, samplePoly,
  projectOnPoly, autoRoute, pinAbs, pinOutDir,
} = engine;

const snap = (v, on=true) => on ? Math.round(v/GRID)*GRID : v;
const DRAG_SLOP = 4;

// Clock periods are powers of two in seconds, slowest → fastest.
const CLOCK_PERIODS = [8000,4000,2000,1000,500,250,125,62.5];
const CLOCK_PERIOD_LABELS = ['8s','4s','2s','1s','1/2s','1/4s','1/8s','1/16s'];
function nearestClockPeriodIndex(ms) {
  let best=0, bestDiff=Infinity;
  CLOCK_PERIODS.forEach((p,i)=>{ const d=Math.abs(p-ms); if (d<bestDiff) { bestDiff=d; best=i; } });
  return best;
}

/* ── net geometry ────────────────────────────────────────────────────────
   A net's pulse animation is laid out by *distance travelled through the
   tree*, not per wire: every wire knows how far along the net it starts
   (`d0`) and how long it is, and the net's longest path sets the pace. A
   branch therefore lights up when the pulse actually reaches its junction,
   and every sink on the net still lands at exactly one hop. */
function buildNetGeometry(circuit) {
  const paths = new Map();   // wireId -> resolved polyline
  const geom  = new Map();   // wireId -> {d0, len, root}
  const nets  = new Map();   // signal key -> {total, wireIds:[]}
  const wires = [...circuit.wires.values()];
  for (const w of wires) paths.set(w.id, circuit.wirePoints(w));

  const childrenOf = new Map();
  const roots = [];
  for (const w of wires) {
    if (circuit.isTap(w.from)) {
      if (!childrenOf.has(w.from.wireId)) childrenOf.set(w.from.wireId, []);
      childrenOf.get(w.from.wireId).push(w);
    } else if (circuit.isPin(w.from)) roots.push(w);
  }
  const walk = (w, d0, rootKey, net, depth) => {
    if (geom.has(w.id) || depth > 24) return;
    const len = polyLength(paths.get(w.id) || []);
    geom.set(w.id, { d0, len, root: rootKey });
    net.wireIds.push(w.id);
    net.total = Math.max(net.total, d0 + len);
    for (const child of (childrenOf.get(w.id) || [])) {
      const along = projectOnPoly(paths.get(w.id) || [], child.from.x, child.from.y).along;
      walk(child, d0 + along, rootKey, net, depth+1);
    }
  };
  for (const w of roots) {
    const key = circuit.sigKey(w.from.compId, w.from.pin);
    if (!nets.has(key)) nets.set(key, { total:0, wireIds:[] });
    walk(w, 0, key, nets.get(key), 0);
  }
  return { paths, geom, nets };
}

function Canvas({
  circuit, selection, onSelect, paletteDrag, onClearPaletteDrag,
  onChange, onCommit, viewApi, onViewChange,
}) {
  const svgRef = useRef(null);
  const [view, setView] = useState({x:40,y:40,zoom:1});
  const [wiring, setWiring] = useState(null);   // {from, bends:[], hoverKey}
  const [cursor, setCursor] = useState({x:0,y:0});
  const [hover, setHover] = useState({ pin:null, wire:null, comp:null, knob:null });
  const [isPanning, setIsPanning] = useState(false);
  const [flash, setFlash] = useState(null);     // transient rejection reason

  // Drag state lives in refs so the global listeners never see a stale closure.
  const panRef      = useRef(null);
  const compDragRef = useRef(null);
  const bendDragRef = useRef(null);
  const tapPendRef  = useRef(null);
  const wiringRef   = useRef(null);
  const viewRef     = useRef(view);
  const hoverRef    = useRef(hover);
  const cbRef       = useRef({});
  cbRef.current = { onChange, onCommit, onSelect, onClearPaletteDrag, paletteDrag };
  useEffect(()=>{ viewRef.current = view; onViewChange?.(view); },[view]);
  useEffect(()=>{ wiringRef.current = wiring; },[wiring]);
  useEffect(()=>{ hoverRef.current = hover; },[hover]);

  // One repaint per frame keeps the simulation display live.
  const [, tick] = useState(0);
  useEffect(()=>{
    let r; const loop=()=>{ tick(n=>(n+1)%1e6); r=requestAnimationFrame(loop); };
    r=requestAnimationFrame(loop); return ()=>cancelAnimationFrame(r);
  },[]);

  const screenToWorld = useCallback((sx,sy)=>{
    const r = svgRef.current.getBoundingClientRect(), v = viewRef.current;
    return { x:(sx-r.left)/v.zoom - v.x, y:(sy-r.top)/v.zoom - v.y };
  },[]);

  /* ── imperative view controls for the toolbar ───────────────────────── */
  useEffect(()=>{
    if (!viewApi) return;
    viewApi.current = {
      zoomBy(f) {
        const el = svgRef.current; if (!el) return;
        const r = el.getBoundingClientRect(), v = viewRef.current;
        const cx = r.width/2/v.zoom - v.x, cy = r.height/2/v.zoom - v.y;
        const nz = Math.max(.25, Math.min(3, v.zoom*f));
        setView({ x:r.width/2/nz - cx, y:r.height/2/nz - cy, zoom:nz });
      },
      reset() { setView({x:40,y:40,zoom:1}); },
      // Where to drop something the user clicked (rather than dragged) in.
      centerWorld() {
        const el = svgRef.current, v = viewRef.current;
        if (!el) return { x:120, y:120 };
        const r = el.getBoundingClientRect();
        return { x: r.width/2/v.zoom - v.x, y: r.height/2/v.zoom - v.y };
      },
      fit() {
        const el = svgRef.current; if (!el) return;
        const comps = [...circuit.components.values()];
        if (!comps.length) { setView({x:40,y:40,zoom:1}); return; }
        let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
        for (const c of comps) {
          const vis = GATE_VIS[c.kind]; if (!vis) continue;
          const rot = c.facing==='up'||c.facing==='down';
          const w = rot?vis.h:vis.w, h = rot?vis.w:vis.h;
          const cx = c.x+vis.w/2, cy = c.y+vis.h/2;
          x0=Math.min(x0,cx-w/2); y0=Math.min(y0,cy-h/2);
          x1=Math.max(x1,cx+w/2); y1=Math.max(y1,cy+h/2);
        }
        const pad = 60;
        const r = el.getBoundingClientRect();
        const nz = Math.max(.25, Math.min(2, Math.min(r.width/(x1-x0+pad*2), r.height/(y1-y0+pad*2))));
        setView({ x: -x0 + (r.width/nz-(x1-x0))/2, y: -y0 + (r.height/nz-(y1-y0))/2, zoom:nz });
      },
    };
  },[circuit, viewApi]);

  /* ── wiring helpers ─────────────────────────────────────────────────── */
  const pinKey = (compId, kind, idx) => compId+'/'+kind+'/'+idx;
  const termOf = (comp, kind, idx) => ({ compId:comp.id, pin:idx, type: kind==='in'?'in':'out' });

  // Would connecting the in-progress wire to this pin work? Returns null when
  // it would, or the reason it wouldn't — the canvas dims rejected pins and
  // the status bar explains why on a failed click.
  const problemWith = useCallback((from, term) => {
    if (!from) return 'no wire in progress';
    if (circuit.isPin(from) && from.type === 'in') {
      if (term.type !== 'out') return 'that end needs an output pin';
      return circuit.connectionProblem(term, from);
    }
    return circuit.connectionProblem(from, term);
  },[circuit]);

  const cancelWiring = useCallback(()=>{ wiringRef.current=null; setWiring(null); },[]);

  const reject = useCallback((reason)=>{
    setFlash({ reason, at: performance.now() });
  },[]);
  useEffect(()=>{
    if (!flash) return;
    const t = setTimeout(()=>setFlash(null), 2200);
    return ()=>clearTimeout(t);
  },[flash]);

  const finishWire = useCallback((term)=>{
    const wf = wiringRef.current;
    if (!wf) return false;
    const problem = problemWith(wf.from, term);
    if (problem) { reject(problem); return false; }
    const reversed = circuit.isPin(wf.from) && wf.from.type === 'in';
    const from = reversed ? term : wf.from;
    const to   = reversed ? wf.from : term;
    const bends = reversed ? [...wf.bends].reverse() : wf.bends;
    // No manual corners → leave `points` empty so the wire keeps
    // auto-routing itself as components move.
    const w = circuit.addWire(from, to, bends.length ? bends.map(p=>({...p})) : []);
    cancelWiring();
    if (w) { cbRef.current.onCommit?.('connect'); cbRef.current.onSelect?.(w.id); }
    return !!w;
  },[circuit, problemWith, reject, cancelWiring]);

  /* ── global mouse handling ──────────────────────────────────────────── */
  useEffect(()=>{
    const onMove = (e)=>{
      const w = screenToWorld(e.clientX, e.clientY);
      setCursor(w);
      if (panRef.current) {
        const p = panRef.current;
        setView(v=>({ ...v, x:p.vx+(e.clientX-p.sx)/v.zoom, y:p.vy+(e.clientY-p.sy)/v.zoom }));
      }
      if (compDragRef.current) {
        const d = compDragRef.current;
        if (Math.hypot(e.clientX-d.sx, e.clientY-d.sy) > DRAG_SLOP) {
          d.moved = true;
          const c = circuit.components.get(d.id);
          if (c) { c.x = snap(w.x-d.ox); c.y = snap(w.y-d.oy); cbRef.current.onChange?.(); }
        }
      }
      if (bendDragRef.current) {
        const d = bendDragRef.current, wire = circuit.wires.get(d.wireId);
        if (wire?.points?.[d.idx]) {
          d.moved = true;
          wire.points[d.idx] = { x:snap(w.x+d.ox), y:snap(w.y+d.oy) };
          cbRef.current.onChange?.();
        }
      }
      // A press on a wire only becomes a branch once it actually moves;
      // otherwise it's just a click that selects the wire.
      if (tapPendRef.current && Math.hypot(e.clientX-tapPendRef.current.sx, e.clientY-tapPendRef.current.sy) > DRAG_SLOP) {
        const t = tapPendRef.current; tapPendRef.current = null;
        const wf = { from:{ wireId:t.wireId, x:t.x, y:t.y }, bends:[], live:true };
        wiringRef.current = wf; setWiring(wf);
      }
    };

    const onUp = (e)=>{
      // A palette part only lands if the gesture actually finished over the
      // board. Releasing back on the palette is a plain click, which the
      // palette itself turns into a drop at the centre of the view — doing
      // both here would place two copies.
      const overBoard = !!(e.target && e.target.closest && e.target.closest('.canvas-wrap'));
      if (cbRef.current.paletteDrag && overBoard) {
        const pd = cbRef.current.paletteDrag;
        const wp = screenToWorld(e.clientX, e.clientY);
        const vis = GATE_VIS[pd.kind];
        if (vis) {
          const c = circuit.addComponent(pd.kind, snap(wp.x-vis.w/2), snap(wp.y-vis.h/2));
          cbRef.current.onCommit?.('add '+pd.kind);
          cbRef.current.onSelect?.(c.id);
        }
      }
      if (cbRef.current.paletteDrag) cbRef.current.onClearPaletteDrag?.();
      if (compDragRef.current) {
        const d = compDragRef.current;
        if (!d.moved) {
          // Operating a control is a transient act, not an edit — it doesn't
          // push an undo snapshot, the way flipping a real switch wouldn't
          // change the wiring diagram.
          if (d.action === 'input') { circuit.toggleInput(d.id); cbRef.current.onChange?.(); }
          if (d.action === 'clock') { circuit.toggleClock(d.id); cbRef.current.onChange?.(); }
        } else cbRef.current.onCommit?.('move');
        compDragRef.current = null;
      }
      if (bendDragRef.current) {
        if (bendDragRef.current.moved) cbRef.current.onCommit?.('reshape wire');
        bendDragRef.current = null;
      }
