<!doctype html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Newton's Cradle",
  "category": "Engineering",
  "fields": [
    { "key": "gap", "label": "Gap between balls", "type": "number",
      "default": 0.3, "min": 0, "max": 1, "step": 0.05 }
  ]
}
</script>
<meta charset="utf-8"/>
<title>Newton's Cradle — Beamer+</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root {
  --high: #f59e0b;
  --mono: 'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --ui:   'DM Sans',system-ui,-apple-system,sans-serif;
}
*,*::before,*::after { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { font-family:var(--font-ui,var(--ui)); color:var(--text,#1a1a18);
       background:var(--bg,#fff); overflow:hidden; font-size:13px; }
.app { height:100%; display:flex; flex-direction:column; }
.stage { flex:1; position:relative; min-height:0; }
#c { display:block; width:100%; height:100%; touch-action:none; }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="c"></canvas>
  </div>
</div>

<script>
(function(){
'use strict';

// ═══ World geometry ═════════════════════════════════════════════════════════
// A plain, real Newton's cradle: every ball is always a genuine pendulum,
// integrated continuously (gravity restoring force + a little air damping).
// Adjacent balls collide with a restitution coefficient just under 1 — a
// little energy is always lost to heat/friction at every hit, real or
// grazing. Whether a swing actually reaches the next ball is never scripted:
// it just falls out of real position/velocity math, so widening the gap
// naturally makes far hits harder without any special-cased "did it cross"
// logic. The gap dial spreads all four ball-to-ball gaps evenly.
const W=760, H=325;
const L=140, R_BALL=22, BALL_D=R_BALL*2;
const THETA_MAX=55*Math.PI/180;      // how far ball 0 can be dragged back
const GAP_MAX=55;                    // max extra spacing added per junction, at full gap dial
const TOP_Y=55, BASE_Y=265;
const LEFT_POST=35, RIGHT_POST=730;
const CENTER_X=(LEFT_POST+RIGHT_POST)/2;
// the gap control lives INSIDE the top rail itself — a machined slot with a
// sliding carriage — rather than a separate UI control floating above it.
const SLIDER={cx:CENTER_X, cy:TOP_Y-10, w:220, trackH:6, knobW:18, knobH:16};

const G_EFF=3000;                    // tuned "gravity" restoring constant (not real-world units)
const AIR_DAMP=0.55;                 // fraction of angular velocity retained per second (idle drift)
const COLLISION_REST=0.96;           // restitution per collision — <1 means a bit of heat/friction loss
const GAP_LERP_RATE=4;               // how fast rest positions chase the gap dial (per second) —
                                      // always live, but smoothed so positions never pop

function clamp01(v){ return Math.max(0,Math.min(1,v)); }

// rest x-position of ball i (0-indexed), all evenly spread by the gap dial and
// always re-centered on the frame as a whole group — widening the gap pushes
// the outer balls outward symmetrically rather than shifting the whole row.
function restX(i,gapFrac){
  const step=BALL_D+GAP_MAX*gapFrac, span=4*step;
  return CENTER_X-span/2+i*step;
}
// single sign convention for every ball: positive angle = swung right.
// x(theta) = restX + L sin(theta), so dx/dt = L cos(theta) * omega exactly —
// used both to integrate physics and to resolve collisions consistently.
function ballPos(i,angle,gapFrac){
  return { x:restX(i,gapFrac)+L*Math.sin(angle), y:TOP_Y+L*Math.cos(angle) };
}

// ═══ Canvas / DPR ═══════════════════════════════════════════════════════════
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
let scale=1, offx=0, offy=0, dpr=1;
function fit(){ dpr=Math.min(window.devicePixelRatio||1,2);
  const r=cvs.getBoundingClientRect();
  cvs.width=Math.max(1,Math.round(r.width*dpr)); cvs.height=Math.max(1,Math.round(r.height*dpr));
  scale=Math.min(r.width/W,r.height/H); offx=(r.width-W*scale)/2; offy=(r.height-H*scale)/2; }
new ResizeObserver(fit).observe(cvs); window.addEventListener('resize',fit); fit();

// ═══ State ══════════════════════════════════════════════════════════════════
let gapDialFrac=0.3;   // live raw dial value — can be turned any time
let gapFrac=0.3;       // value actually used everywhere (physics, drawing, hit-testing);
                       // smoothly chases gapDialFrac every frame (see GAP_LERP_RATE) so the
                       // dial always feels responsive but rest positions never pop/jump.
let angle=[0,0,0,0,0];
let omega=[0,0,0,0,0];
let heatPuffs=[];      // [{x,y,age,size}] a small puff of heat lost at every collision
let dragIdx=null;      // which ball (if any) is currently pointer-controlled — only ball 0

function triggerHeat(x,y,strength){ heatPuffs.push({x,y,age:0,size:6+clamp01(strength)*26}); }

// ═══ Physics step ═══════════════════════════════════════════════════════════
function step(dt){
  gapFrac+=(gapDialFrac-gapFrac)*Math.min(1,GAP_LERP_RATE*dt);

  // integrate every ball as a real pendulum (semi-implicit Euler), except the
  // one currently pinned under the pointer.
  const damp=Math.pow(AIR_DAMP,dt);
  for(let i=0;i<5;i++){
    if(i===dragIdx) continue;
    const angAcc=-(G_EFF/L)*Math.sin(angle[i]);
    omega[i]+=angAcc*dt;
    omega[i]*=damp;
    angle[i]+=omega[i]*dt;
  }

  // resolve each of the 4 junctions independently and identically: two balls
  // only exchange anything if they are actually overlapping AND closing on
  // each other. A small positional correction prevents any lingering overlap
  // regardless of direction, so balls never visually pass through each other.
  for(let j=0;j<4;j++){
    const i=j;
    const xi=restX(i,gapFrac)+L*Math.sin(angle[i]);
    const xi1=restX(i+1,gapFrac)+L*Math.sin(angle[i+1]);
    const dx=xi1-xi;
    if(dx>=2*R_BALL) continue;
    const vi=L*Math.cos(angle[i])*omega[i];
    const vi1=L*Math.cos(angle[i+1])*omega[i+1];
    const closing=vi-vi1;
    if(closing>0){
      const e=COLLISION_REST;
      const newVi = vi*(1-e)/2 + vi1*(1+e)/2;
      const newVi1= vi*(1+e)/2 + vi1*(1-e)/2;
      omega[i]  = newVi /(L*Math.cos(angle[i]));
      omega[i+1]= newVi1/(L*Math.cos(angle[i+1]));
      const midX=(xi+xi1)/2, midY=TOP_Y+L*(Math.cos(angle[i])+Math.cos(angle[i+1]))/2;
      triggerHeat(midX,midY,Math.abs(closing)/260);
    }
    const overlap=2*R_BALL-dx;
    if(overlap>0){
      const corr=overlap/2;
      angle[i]  -=corr/(L*Math.cos(angle[i]));
      angle[i+1]+=corr/(L*Math.cos(angle[i+1]));
    }
  }

  for(let k=heatPuffs.length-1;k>=0;k--){ heatPuffs[k].age+=dt*1.3; if(heatPuffs[k].age>1) heatPuffs.splice(k,1); }
}

// ═══ Draw helpers ═══════════════════════════════════════════════════════════
function roundRectPath(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function metalFill(x0,y0,x1,y1){
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,'#c3cad0'); g.addColorStop(0.45,'#9aa2a8'); g.addColorStop(1,'#6d757c'); return g;
}
function drawGroundShadow(){
  const cx=CENTER_X, cy=BASE_Y+14, rx=(RIGHT_POST-LEFT_POST)/2+30, ry=15;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rx);
  g.addColorStop(0,'rgba(20,20,18,0.28)'); g.addColorStop(1,'rgba(20,20,18,0)');
  ctx.save();
  ctx.translate(cx,cy); ctx.scale(1,ry/rx); ctx.translate(-cx,-cy);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,rx,0,6.28); ctx.fill();
  ctx.restore();
}

function drawFrame(){
  const postTop=TOP_Y-8, postBottom=BASE_Y;
  [LEFT_POST,RIGHT_POST].forEach(px=>{
    roundRectPath(px-9,postTop,18,postBottom-postTop,5);
    ctx.fillStyle=metalFill(px-9,0,px+9,0); ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#565d63'; roundRectPath(px-9,postTop,18,postBottom-postTop,5); ctx.stroke();
    // small foot cap where the post meets the ground
    roundRectPath(px-14,postBottom-6,28,10,4);
    ctx.fillStyle=metalFill(px-14,0,px+14,0); ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='#565d63'; roundRectPath(px-14,postBottom-6,28,10,4); ctx.stroke();
  });
  roundRectPath(LEFT_POST-16,TOP_Y-20,(RIGHT_POST-LEFT_POST)+32,20,7);
  ctx.fillStyle=metalFill(0,TOP_Y-20,0,TOP_Y);ctx.fill();
  ctx.save(); roundRectPath(LEFT_POST-16,TOP_Y-20,(RIGHT_POST-LEFT_POST)+32,20,7); ctx.clip();
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(LEFT_POST-16,TOP_Y-20,(RIGHT_POST-LEFT_POST)+32,4);
  ctx.restore();
  ctx.lineWidth=2; ctx.strokeStyle='#565d63'; roundRectPath(LEFT_POST-16,TOP_Y-20,(RIGHT_POST-LEFT_POST)+32,20,7); ctx.stroke();
}

function drawString(pivotX,pos){
  ctx.strokeStyle='#9aa2a8'; ctx.lineWidth=1.3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(pivotX-4,TOP_Y); ctx.lineTo(pos.x-2,pos.y-R_BALL*0.9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pivotX+4,TOP_Y); ctx.lineTo(pos.x+2,pos.y-R_BALL*0.9); ctx.stroke();
  ctx.fillStyle='#3d4448'; ctx.beginPath(); ctx.arc(pivotX,TOP_Y,3.4,0,6.28); ctx.fill();
}

function drawBall(x,y,rad){
  const g=ctx.createRadialGradient(x-rad*0.35,y-rad*0.42,rad*0.1,x,y,rad*1.1);
  g.addColorStop(0,'#fbfcfd'); g.addColorStop(0.32,'#d6dade');
  g.addColorStop(0.62,'#9199a0'); g.addColorStop(0.85,'#616973');
  g.addColorStop(1,'#3f454d');
  ctx.beginPath(); ctx.arc(x,y,rad,0,6.28); ctx.fillStyle=g; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,rad,0,6.28); ctx.clip();
  const rim=ctx.createRadialGradient(x,y+rad*0.7,0,x,y+rad*0.7,rad*0.9);
  rim.addColorStop(0,'rgba(150,90,40,0.16)'); rim.addColorStop(1,'rgba(150,90,40,0)');
  ctx.fillStyle=rim; ctx.fillRect(x-rad,y-rad,rad*2,rad*2);
  ctx.restore();
  ctx.lineWidth=1.4; ctx.strokeStyle='#40464e'; ctx.beginPath(); ctx.arc(x,y,rad,0,6.28); ctx.stroke();
  ctx.beginPath(); ctx.arc(x-rad*0.36,y-rad*0.42,rad*0.24,0,6.28);
  ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.fill();
}

// a small, dim, rising puff at every collision — heat always bleeds off a hit.
function drawHeatPuffs(){
  heatPuffs.forEach(h=>{
    const a=Math.max(0,1-h.age);
    const y=h.y-h.age*10;
    const g=ctx.createRadialGradient(h.x,y,0,h.x,y,h.size*(0.5+0.5*h.age));
    g.addColorStop(0,`rgba(255,120,60,${0.35*a})`);
    g.addColorStop(1,'rgba(255,120,60,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(h.x,y,h.size*(0.5+0.5*h.age),0,6.28); ctx.fill();
  });
}

// ── gap control: a machined slot in the top rail with a sliding carriage —
// styled as a real part of the frame's hardware, not a UI widget laid over it.
function drawGapSlider(hot){
  const {cx,cy,w,trackH,knobW,knobH}=SLIDER;
  const x0=cx-w/2, x1=cx+w/2;
  const hx=x0+w*gapDialFrac;

  // the slot: a dark recess cut into the rail, shaded like it's carved in
  // (dark on top where the rail's own light doesn't reach, a thin bright lip
  // along the bottom edge where light catches the machined edge)
  roundRectPath(x0,cy-trackH/2,w,trackH,trackH/2);
  ctx.fillStyle='#2a2f33'; ctx.fill();
  ctx.save(); roundRectPath(x0,cy-trackH/2,w,trackH,trackH/2); ctx.clip();
  const inset=ctx.createLinearGradient(0,cy-trackH/2,0,cy+trackH/2);
  inset.addColorStop(0,'rgba(0,0,0,0.45)'); inset.addColorStop(0.7,'rgba(0,0,0,0.1)'); inset.addColorStop(1,'rgba(255,255,255,0.18)');
  ctx.fillStyle=inset; ctx.fillRect(x0,cy-trackH/2,w,trackH);
  // a brushed-steel inlay tracks how far the gap is opened, recessed in the same slot
  ctx.fillStyle='#aab1b7'; ctx.globalAlpha=0.7;
  ctx.fillRect(x0,cy-trackH/2+1,Math.max(0,hx-x0),trackH-2);
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.lineWidth=1; ctx.strokeStyle='rgba(0,0,0,0.5)'; roundRectPath(x0,cy-trackH/2,w,trackH,trackH/2); ctx.stroke();

  // end-stop ticks, machined into the rail like a scale
  ctx.strokeStyle='rgba(60,66,71,0.6)'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const tx=x0+w*i/4;
    ctx.beginPath(); ctx.moveTo(tx,cy-trackH/2-4); ctx.lineTo(tx,cy-trackH/2-1); ctx.stroke(); }

  // the carriage: a small metal block riding the slot, same material as the
  // posts/rail, with a soft contact shadow and a plain steel grip pin on its face
  ctx.beginPath(); ctx.ellipse(hx,cy+knobH*0.5+2,knobW*0.55,3,0,0,6.28);
  ctx.fillStyle='rgba(20,20,18,0.28)'; ctx.fill();
  roundRectPath(hx-knobW/2,cy-knobH/2,knobW,knobH,4);
  ctx.fillStyle=metalFill(hx-knobW/2,cy-knobH/2,hx-knobW/2,cy+knobH/2); ctx.fill();
  ctx.lineWidth=1.4; ctx.strokeStyle=hot?'#c9ced2':'#565d63';
  roundRectPath(hx-knobW/2,cy-knobH/2,knobW,knobH,4); ctx.stroke();
  ctx.fillStyle=hot?'#eef1f3':'#8b939a';
  roundRectPath(hx-1.4,cy-knobH/2+3,2.8,knobH-6,1.4); ctx.fill();

  // a small engraved plate label, cut into the rail itself
  ctx.font='600 8.5px var(--mono)';
  ctx.textAlign='right'; ctx.fillStyle=hot?'rgba(20,20,18,0.75)':'rgba(20,20,18,0.55)';
  ctx.fillText('GAP', x0-16, cy+3);
  ctx.textAlign='start';
}

// ═══ Frame ══════════════════════════════════════════════════════════════════
let hoverBall0=false, hoverSlider=false;
function frameDraw(){
  const r=cvs.getBoundingClientRect();
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,offx*dpr,offy*dpr);

  drawGroundShadow();
  drawFrame();

  for(let i=0;i<5;i++){
    const pos=ballPos(i,angle[i],gapFrac);
    drawString(restX(i,gapFrac),pos);
  }
  drawHeatPuffs();
  for(let i=0;i<5;i++){
    const pos=ballPos(i,angle[i],gapFrac);
    drawBall(pos.x,pos.y,R_BALL);
  }

  drawGapSlider(hoverSlider);
}
let last=performance.now();
function tick(now){ let dt=(now-last)/1000; last=now; dt=Math.max(0,Math.min(dt,0.05)); step(dt); frameDraw(); }
function loop(now){ tick(now); requestAnimationFrame(loop); }
tick(performance.now()); requestAnimationFrame(loop);
setInterval(()=>{ if(document.hidden) tick(performance.now()); }, 120);
try{ if(location.hash==='#dev'){
  window.__tick=tick;
  window.__api={
    get angle(){ return angle; },
    get omega(){ return omega; },
    get gapFrac(){ return gapFrac; },
    get gapDialFrac(){ return gapDialFrac; }, set gapDialFrac(v){ gapDialFrac=v; },
    startDrag(a){ dragIdx=0; angle[0]=Math.max(-THETA_MAX,Math.min(0,a)); omega[0]=0; },
    release(){ dragIdx=null; }
  };
} }catch(e){}

// ═══ Interaction ════════════════════════════════════════════════════════════
function toWorld(e){ const r=cvs.getBoundingClientRect();
  return { x:(e.clientX-r.left-offx)/scale, y:(e.clientY-r.top-offy)/scale }; }
function onBall0(p){
  const pos=ballPos(0,angle[0],gapFrac);
  return Math.hypot(p.x-pos.x,p.y-pos.y)<R_BALL+12;
}
function onSlider(p){
  const {cx,cy,w,knobW,knobH}=SLIDER;
  return p.x>=cx-w/2-knobW/2-8 && p.x<=cx+w/2+knobW/2+8 && Math.abs(p.y-cy)<knobH/2+10;
}
function setBall0FromPointer(p){
  const dx=p.x-restX(0,gapFrac), dy=p.y-TOP_Y;
  let a=Math.atan2(dx,dy);
  a=Math.max(-THETA_MAX,Math.min(0,a));
  angle[0]=a; omega[0]=0;
}
function setGapFromPointer(p){
  const {cx,w}=SLIDER;
  gapDialFrac=clamp01((p.x-(cx-w/2))/w);
}
let drag=null;
cvs.addEventListener('pointermove',e=>{ const p=toWorld(e);
  if(drag==='ball0'){ setBall0FromPointer(p); }
  else if(drag==='slider'){ setGapFromPointer(p); }
  else {
    hoverBall0=onBall0(p); hoverSlider=onSlider(p);
    cvs.style.cursor=hoverBall0?'grab':hoverSlider?'grab':'default';
  }
});
cvs.addEventListener('pointerdown',e=>{ const p=toWorld(e); cvs.setPointerCapture(e.pointerId);
  if(onBall0(p)){
    drag='ball0'; dragIdx=0; setBall0FromPointer(p);
  } else if(onSlider(p)){ drag='slider'; setGapFromPointer(p); }
});
window.addEventListener('pointerup',()=>{
  if(drag==='ball0'){ dragIdx=null; }
  drag=null;
});

// ═══ Reset / Beamer+ integration ════════════════════════════════════════════
function doReset(all){ if(all!==false){ gapDialFrac=0.3; }
  angle=[0,0,0,0,0]; omega=[0,0,0,0,0]; heatPuffs=[]; dragIdx=null;
  gapFrac=gapDialFrac;
}
function applyConfig(cfg){ if(!cfg) return;
  if(typeof cfg.gap==='number') gapDialFrac=cfg.gap;
  doReset(false);
}
applyConfig(window.WIDGET_CONFIG);
window.addEventListener('message',e=>{ const d=e.data; if(!d) return;
  const wid=(window.WIDGET_CONFIG&&window.WIDGET_CONFIG.id)||'cradle-widget';
  if(d.type==='widget-config') applyConfig(d.config);
  else if(d.type==='widget-get-state')
    window.parent.postMessage({type:'widget-state',widgetId:wid,state:{gap:gapDialFrac}},'*');
  else if(d.type==='widget-set-state'&&d.state){ const s=d.state;
    if(typeof s.gap==='number') gapDialFrac=s.gap;
  }
});
})();
</script>
</body>
</html>
