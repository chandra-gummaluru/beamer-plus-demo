<!doctype html>
<html lang="en">
<head>
<script id="widget-schema" type="application/json">
{
  "label": "Linked List Visualiser",
  "category": "Computer Science",
  "fields": []
}
</script>
<meta charset="utf-8"/>
<title>Linked List Deletion — Beamer+</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #ffffff;
  --bg-subtle:  #f9f9f8;
  --border:     #e9e9e6;
  --border-med: #d4d4cf;
  --text:       #1a1a18;
  --text-2:     #6b6b65;
  --text-3:     #aeaea5;
  --radius:     6px;
  --mono:       'JetBrains Mono', monospace;
  --ui:         'DM Sans', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; overflow: hidden; }
body { font-family: var(--ui); background: var(--bg); color: var(--text); }

/* ── Toolbar ─────────────────────────────────────────────────────── */
#toolbar {
  flex-shrink: 0; height: 42px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 14px; gap: 6px;
}
.tb-title { font-size: 13px; font-weight: 500; flex-shrink: 0; }
.sep      { width: 1px; height: 18px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
.spacer   { flex: 1; }

.case-btn {
  height: 28px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text-2);
  font: 500 12px var(--ui); cursor: pointer; white-space: nowrap;
  transition: background .12s, color .12s, border-color .12s;
}
.case-btn:hover  { border-color: var(--border-med); color: var(--text); }
.case-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

.mode-btn {
  height: 28px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text-3);
  font: 500 11.5px var(--ui); cursor: pointer; white-space: nowrap;
  transition: background .12s, color .12s, border-color .12s;
}
.mode-btn:hover  { color: var(--text-2); border-color: var(--border-med); }
.mode-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

.reset-btn {
  height: 28px; padding: 0 10px;
  border: 1px solid transparent; border-radius: var(--radius);
  background: transparent; color: var(--text-3);
  font: 500 12px var(--ui); cursor: pointer;
  transition: color .12s, border-color .12s;
}
.reset-btn:hover { color: var(--text-2); border-color: var(--border); }

/* ── Viz area ────────────────────────────────────────────────────── */
#viz {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; padding: 16px 24px;
}

/* ── Nav strip (step mode) ───────────────────────────────────────── */
#nav {
  flex-shrink: 0; height: 42px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px; padding: 0 14px;
}
.nav-info { flex: 1; font: 10.5px var(--mono); color: var(--text-3); }
.nb {
  height: 28px; padding: 0 12px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  font: 500 11.5px var(--ui); cursor: pointer; transition: all .1s;
}
.nb:hover:not(:disabled) { background: var(--bg-subtle); border-color: var(--border-med); }
.nb:disabled { opacity: .3; cursor: not-allowed; }
.nb.pri { background: var(--text); color: #fff; border-color: var(--text); }
.nb.pri:hover:not(:disabled) { background: #2d2d2a; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── Layout constants ────────────────────────────────────────────── */
const VALS = [10, 20, 30, 40, 50];
const N    = VALS.length;
const NW = 66, NH = 40, GAP = 112, CY = 82, X0 = 74;
const NX0 = X0 + N * GAP;
const SVW = NX0 + 70, SVH = 152;
const HALF = NW / 2;
function nx(i) { return X0 + i * GAP; }

/* ── Node colour palettes ────────────────────────────────────────── */
const NC = {
  nrm: ['#f9f9f8', '#d4d4cf', '#1a1a18'],
  cur: ['#eff6ff', '#93c5fd', '#1e40af'],
  vis: ['#f5f5f4', '#e2e2df', '#b0b0a8'],
  tgt: ['#fef3c7', '#f59e0b', '#92400e'],
  prv: ['#dcfce7', '#22c55e', '#15803d'],
  del: ['#f9f9f8', '#e9e9e6', '#d4d4cf'],
};

/* ── Step builder ────────────────────────────────────────────────── */
function buildSteps(t) {
  const isH = t === 0, isT = t === N - 1, v = VALS[t];
  const steps = [];

  if (isH) {
    steps.push({ phase:'found', cursor:0, prevAt:null, bypass:false, faded:false,
      msg:'Node ' + v + ' is the head \u2014 no traversal needed. Save temp = head.' });
    steps.push({ phase:'free',  cursor:0, prevAt:null, bypass:false, faded:false,
      msg:'Advance head = head\u2192next.' });
    steps.push({ phase:'free',  cursor:0, prevAt:null, bypass:false, faded:true,
      msg:'free(temp) \u2014 release node ' + v + '.' });
    steps.push({ phase:'done',  cursor:null, prevAt:null, bypass:false, faded:true,
      msg:'Done \u2014 node ' + v + ' removed.' });
  } else {
    steps.push({ phase:'scan', cursor:0, prevAt:null, bypass:false, faded:false,
      msg:'prev = head (node ' + VALS[0] + ')' });
    for (var i = 1; i < t; i++) {
      steps.push({ phase:'scan', cursor:i, prevAt:null, bypass:false, faded:false,
        msg:'prev\u2192next is node ' + VALS[i] + ', not the target \u2014 advance prev.' });
    }
    steps.push({ phase:'found', cursor:t, prevAt:t-1, bypass:false, faded:false,
      msg:'prev\u2192next is node ' + v + ' \u2014 predecessor found at node ' + VALS[t-1] + '.' });
    steps.push({ phase:'redir', cursor:t, prevAt:t-1, bypass:true, faded:false,
      msg: isT ? 'prev\u2192next = NULL \u2014 sever the tail.'
               : 'prev\u2192next = node ' + VALS[t+1] + ' \u2014 bypass node ' + v + '.' });
    steps.push({ phase:'free',  cursor:t, prevAt:t-1, bypass:true, faded:true,
      msg:'free(target) \u2014 release node ' + v + '.' });
    steps.push({ phase:'done',  cursor:null, prevAt:t-1, bypass:true, faded:true,
      msg:'Done \u2014 node ' + v + ' removed.' });
  }
  return steps;
}

var SCAN_MS = 420;

/* ── App ─────────────────────────────────────────────────────────── */
function App() {
  const [stepMode, setStepMode] = useState(false);
  const [target,   setTarget]   = useState(null);
  const [anim,     setAnim]     = useState({ phase:'idle', cursor:null, prevAt:null, bypass:false, faded:false, msg:'' });
  const [steps,    setSteps]    = useState([]);
  const [stepIdx,  setStepIdx]  = useState(0);
  const timers    = useRef([]);
  const bypassRef = useRef(null);

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };
  const at = (ms, fn) => timers.current.push(setTimeout(fn, ms));

  /* Animate bypass arc via stroke-dashoffset */
  useEffect(() => {
    if (!anim.bypass || !bypassRef.current) return;
    const p = bypassRef.current;
    const len = p.getTotalLength();
    p.style.strokeDasharray  = len + '';
    p.style.strokeDashoffset = len + '';
    p.style.transition = 'none';
    p.getBoundingClientRect();
    p.style.transition = 'stroke-dashoffset 0.6s ease';
    p.style.strokeDashoffset = '0';
  }, [anim.bypass]);

  /* ── Pick a case ─────────────────────────────────────────────── */
  const pick = useCallback((t) => {
    clearTimers();
    setTarget(t);

    if (stepMode) {
      const s = buildSteps(t);
      setSteps(s);
      setStepIdx(0);
      setAnim(Object.assign({}, s[0]));
    } else {
      const isH = t === 0;
      setAnim({ phase:'idle', cursor:null, prevAt:null, bypass:false, faded:false, msg:'' });
      setSteps([]); setStepIdx(0);

      if (isH) {
        at(120,  () => setAnim(a => Object.assign({}, a, { cursor:0, phase:'found' })));
        at(720,  () => setAnim(a => Object.assign({}, a, { faded:true, phase:'free' })));
        at(1440, () => setAnim(a => Object.assign({}, a, { phase:'done' })));
      } else {
        at(120, () => setAnim(a => Object.assign({}, a, { phase:'scan', cursor:0 })));
        for (let i = 1; i <= t - 1; i++) {
          const ci = i;
          at(120 + ci * SCAN_MS, () => setAnim(a => Object.assign({}, a, { cursor:ci })));
        }
        const base = 120 + t * SCAN_MS;
        at(base,        () => setAnim(a => Object.assign({}, a, { cursor:t, prevAt:t-1, phase:'found' })));
        at(base + 560,  () => setAnim(a => Object.assign({}, a, { bypass:true, phase:'redir' })));
        at(base + 1160, () => setAnim(a => Object.assign({}, a, { faded:true, phase:'free' })));
        at(base + 1860, () => setAnim(a => Object.assign({}, a, { phase:'done' })));
      }
    }
  }, [stepMode]);

  const reset = useCallback(() => {
    clearTimers();
    setTarget(null);
    setSteps([]); setStepIdx(0);
    setAnim({ phase:'idle', cursor:null, prevAt:null, bypass:false, faded:false, msg:'' });
  }, []);

  const toggleMode = useCallback(() => {
    clearTimers();
    setStepMode(m => !m);
    setTarget(null);
    setSteps([]); setStepIdx(0);
    setAnim({ phase:'idle', cursor:null, prevAt:null, bypass:false, faded:false, msg:'' });
  }, []);

  const goToStep = useCallback((idx) => {
    setStepIdx(idx);
    setAnim(Object.assign({}, steps[idx]));
  }, [steps]);

  useEffect(() => {
    if (!stepMode || target === null || !steps.length) return;
    const fn = e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown')
        setStepIdx(i => { const n = Math.min(i + 1, steps.length - 1); setAnim(Object.assign({}, steps[n])); return n; });
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')
        setStepIdx(i => { const n = Math.max(i - 1, 0); setAnim(Object.assign({}, steps[n])); return n; });
    };
    window.addEventListener('keydown', fn);
    return () => window.removeEventListener('keydown', fn);
  }, [stepMode, target, steps]);

  /* ── Derive per-node state ───────────────────────────────────── */
  function ns(i) {
    if (target === null) return 'nrm';
    const { phase, cursor, prevAt, faded } = anim;
    if (i === target) {
      if (faded) return 'del';
      if (phase === 'found' || phase === 'redir' || phase === 'free' || phase === 'done') return 'tgt';
    }
    if (i === prevAt && phase !== 'idle' && phase !== 'scan') return 'prv';
    if (phase === 'scan') {
      if (i === cursor)                  return 'cur';
      if (cursor !== null && i < cursor) return 'vis';
    }
    return 'nrm';
  }

  function arrVis(i) {
    if (target === null) return { show:true, faded:false };
    const { bypass, faded, prevAt } = anim;
    if (i === target && (bypass || faded))      return { show:false };
    if (i === prevAt && i + 1 === target) {
      if (bypass && !faded) return { show:true, faded:true };
      if (faded)            return { show:false };
    }
    return { show:true, faded:false };
  }

  const isTail   = target !== null && target === N - 1;
  const bypassTo = target !== null ? (isTail ? 'null' : target + 1) : null;
  const showPrev = anim.prevAt !== null && anim.phase !== 'idle' && anim.phase !== 'scan';

  const MSG_AUTO = {
    idle:  'Select a case above to watch the algorithm.',
    scan:  'Scanning \u2014 advancing prev\u2026',
    found: 'Predecessor found.',
    redir: 'Redirecting prev\u2192next\u2026',
    free:  'Freeing the node\u2026',
    done:  'Done \u2014 node successfully removed.',
  };
  const statusMsg = stepMode
    ? (anim.msg || 'Select a case above.')
    : (MSG_AUTO[anim.phase] || '');

  const CASES = [[0,'Case 1 \u2014 Head'], [2,'Case 2 \u2014 Middle'], [N-1,'Case 3 \u2014 Tail']];

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>

      {/* ── Toolbar ── */}
      <div id="toolbar">
        <span className="tb-title">Data Structures</span>
        <div className="sep"/>
        {CASES.map(([t, lbl]) => (
          <button key={t} className={'case-btn' + (target === t ? ' active' : '')}
                  onClick={() => pick(t)}>{lbl}</button>
        ))}
        <div className="spacer"/>
        <button className={'mode-btn' + (stepMode ? ' active' : '')} onClick={toggleMode}>
          {stepMode ? 'Step' : 'Auto'}
        </button>
        {target !== null &&
          <button className="reset-btn" onClick={reset}>&#x21ba; Reset</button>}
      </div>

      {/* ── Viz ── */}
      <div id="viz">
        <svg viewBox={'0 0 ' + SVW + ' ' + SVH} width="100%"
             style={{ maxWidth:660, display:'block', flexShrink:0 }}>
          <defs>
            {[['n','#d4d4cf'],['f','#e9e9e6'],['b','#f59e0b']].map(([id,col]) =>
              <marker key={id} id={'arr-' + id} markerWidth="7" markerHeight="5"
                      refX="6.5" refY="2.5" orient="auto">
                <polygon points="0 0,7 2.5,0 5" fill={col}/>
              </marker>
            )}
          </defs>

          <text x={NX0+8} y={CY+5} fontFamily="'JetBrains Mono',monospace"
                fontSize="11" fill="#aeaea5">NULL</text>

          {Array.from({length:N}, (_, i) => {
            const av = arrVis(i);
            if (!av.show) return null;
            const x1 = nx(i) + HALF + 5;
            const x2 = i === N-1 ? NX0-4 : nx(i+1) - HALF - 4;
            return (
              <line key={i} x1={x1} y1={CY} x2={x2} y2={CY}
                    stroke={av.faded ? '#e9e9e6' : '#d4d4cf'}
                    strokeWidth={av.faded ? 1 : 1.5}
                    markerEnd={av.faded ? 'url(#arr-f)' : 'url(#arr-n)'}
                    opacity={av.faded ? 0.4 : 1}
                    style={{transition:'stroke .3s ease, opacity .3s ease'}}/>
            );
          })}

          {anim.bypass && anim.prevAt !== null && bypassTo !== null && (() => {
            const x1 = nx(anim.prevAt) + HALF + 5;
            const x2 = bypassTo === 'null' ? NX0-4 : nx(bypassTo) - HALF - 4;
            const ctrl = CY - 54;
            return (
              <path ref={bypassRef}
                    d={'M ' + x1 + ' ' + CY + ' C ' + (x1+32) + ' ' + ctrl + ' ' + (x2-32) + ' ' + ctrl + ' ' + x2 + ' ' + CY}
                    fill="none" stroke="#f59e0b" strokeWidth={2}
                    strokeDasharray="6 3" markerEnd="url(#arr-b)"/>
            );
          })()}

          {showPrev && (
            <g>
              <line x1={nx(anim.prevAt)} y1={CY+NH/2+5}
                    x2={nx(anim.prevAt)} y2={CY+NH/2+17}
                    stroke="#22c55e" strokeWidth={1.5} opacity=".8"/>
              <text x={nx(anim.prevAt)} y={CY+NH/2+29} textAnchor="middle"
                    fontFamily="'JetBrains Mono',monospace"
                    fontSize="10" fontWeight="500" fill="#22c55e">prev</text>
            </g>
          )}

          {VALS.map((val, i) => {
            const s = ns(i);
            const nc = NC[s] || NC.nrm;
            const fill = nc[0], stroke = nc[1], tc = nc[2];
            return (
              <g key={i} style={{
                opacity:   s === 'del' ? 0 : 1,
                transform: s === 'del' ? 'translateY(-8px)' : 'translateY(0px)',
                transition:'opacity .6s ease, transform .6s ease',
                transformBox:'fill-box', transformOrigin:'center',
              }}>
                <rect x={nx(i)-HALF} y={CY-NH/2} width={NW} height={NH} rx={7}
                      fill={fill} stroke={stroke} strokeWidth={1.5}
                      style={{transition:'fill .35s ease, stroke .35s ease'}}/>
                <line x1={nx(i)+HALF-16} y1={CY-NH/2+6}
                      x2={nx(i)+HALF-16} y2={CY+NH/2-6}
                      stroke={stroke} strokeWidth={1} opacity=".55"
                      style={{transition:'stroke .35s ease'}}/>
                <text x={nx(i)-8} y={CY+5} textAnchor="middle"
                      fontFamily="'JetBrains Mono',monospace"
                      fontSize="13" fontWeight="500" fill={tc}
                      style={{transition:'fill .35s ease'}}>{val}</text>
                <circle cx={nx(i)+HALF-8} cy={CY} r={2.6}
                        fill={stroke} style={{transition:'fill .35s ease'}}/>
              </g>
            );
          })}
        </svg>

        <div style={{ fontSize:12, color:'#aeaea5', fontStyle:'italic',
                      textAlign:'center', minHeight:18, lineHeight:'18px' }}>
          {statusMsg}
        </div>
      </div>

      {/* ── Nav bar (step mode only) ── */}
      {stepMode && (
        <div id="nav">
          <div className="nav-info">
            {target !== null
              ? 'step ' + (stepIdx + 1) + ' / ' + steps.length + ' \u00b7 \u2190 \u2192 keys'
              : 'no selection'}
          </div>
          <button className="nb" disabled={target === null || stepIdx === 0}
                  onClick={() => goToStep(stepIdx - 1)}>&larr; Back</button>
          <button className="nb pri" disabled={target === null || stepIdx === steps.length - 1}
                  onClick={() => goToStep(stepIdx + 1)}>Next &rarr;</button>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
